document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

%,rgba(246,244,238,.95) 100%);\"><\u002Fdiv>\n\n    <div data-fade=\"\" style=\"position:absolute;inset:0;pointer-events:none;background:#0d0b12;opacity:1;transition:opacity 2.2s ease;\"><\u002Fdiv>\n\n    <div style=\"position:absolute;left:0;right:0;bottom:0;padding:44px 8% 76px;pointer-events:none;background:linear-gradient(transparent,rgba(28,22,18,.42) 55%,rgba(22,17,14,.72));\">\n      <div data-legenda=\"\" aria-live=\"polite\" role=\"status\" style=\"max-width:760px;margin:0 auto;text-align:center;font-size:clamp(15px,2.1vw,23px);line-height:1.62;color:#f7f3ea;font-style:italic;text-shadow:0 2px 14px rgba(0,0,0,.6);text-wrap:pretty;min-height:2.6em;\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;top:16px;left:0;right:0;display:flex;justify-content:center;gap:7px;\">\n      <span data-pip=\"0\" style=\"width:26px;height:2px;background:rgba(247,243,234,.75);border-radius:2px;transition:background .5s;\"><\u002Fspan>\n      <span data-pip=\"1\" style=\"width:26px;height:2px;background:rgba(247,243,234,.22);border-radius:2px;transition:background .5s;\"><\u002Fspan>\n      <span data-pip=\"2\" style=\"width:26px;height:2px;background:rgba(247,243,234,.22);border-radius:2px;transition:background .5s;\"><\u002Fspan>\n      <span data-pip=\"3\" style=\"width:26px;height:2px;background:rgba(247,243,234,.22);border-radius:2px;transition:background .5s;\"><\u002Fspan>\n      <span data-pip=\"4\" style=\"width:26px;height:2px;background:rgba(247,243,234,.22);border-radius:2px;transition:background .5s;\"><\u002Fspan>\n      <span data-pip=\"5\" style=\"width:26px;height:2px;background:rgba(247,243,234,.22);border-radius:2px;transition:background .5s;\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;top:12px;right:14px;display:flex;gap:8px;\">\n      <button data-btn-pausa=\"\" sc-camel-on-click=\"{{ alternarPausa }}\" title=\"Pausar ou retomar\" aria-label=\"Pausar ou retomar a cena\" style=\"appearance:none;cursor:pointer;width:44px;height:44px;border-radius:50%;border:.5px solid rgba(40,30,24,.28);background:rgba(250,248,243,.82);color:#3b2f26;font-size:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);\">⏸<\u002Fbutton>\n      <button data-btn-som=\"\" sc-camel-on-click=\"{{ alternarSom }}\" title=\"Narração\" aria-label=\"Ligar ou desligar a narração\" style=\"appearance:none;cursor:pointer;width:44px;height:44px;border-radius:50%;border:.5px solid rgba(40,30,24,.28);background:rgba(250,248,243,.82);color:#3b2f26;font-size:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);\">🔊<\u002Fbutton>\n    <\u002Fdiv>\n\n    <button data-btn-pular=\"\" sc-camel-on-click=\"{{ pular }}\" style=\"position:absolute;bottom:14px;left:50%;transform:translateX(-50%);appearance:none;cursor:pointer;font-family:Georgia,serif;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:11px 20px;min-height:44px;border-radius:40px;border:.5px solid rgba(247,243,234,.42);background:rgba(28,22,18,.34);color:#f7f3ea;backdrop-filter:blur(4px);\">Pular ›<\u002Fbutton>\n\n    <div data-aviso-voz=\"\" role=\"status\" style=\"display:none;position:absolute;z-index:25;left:14px;top:12px;max-width:300px;flex-direction:column;gap:9px;padding:14px 16px;border-radius:14px;background:rgba(250,248,243,.94);border:.5px solid rgba(40,30,24,.2);backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(20,14,10,.25);\">\n      <div style=\"font-family:system-ui,sans-serif;font-size:12.5px;line-height:1.5;color:#3b2f26;text-wrap:pretty;\">A voz da guia não toca dentro desta janela de pré-visualização. Para ouvir, use o arquivo <strong>Abertura Animada (standalone).html<\u002Fstrong> baixado no seu computador — as legendas seguem aqui de qualquer forma.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ fecharAviso }}\" style=\"appearance:none;cursor:pointer;font-family:Georgia,serif;font-size:13px;padding:10px 18px;min-height:44px;border-radius:40px;border:.5px solid rgba(40,30,24,.28);background:transparent;color:#3b2f26;\">Entendi<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div data-tela-inicial=\"\" style=\"position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0d0b12;text-align:center;padding:0 8%;\">\n      <div style=\"font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#c9bfe0;font-family:system-ui,sans-serif;\">Parque Modulador · IET<\u002Fdiv>\n      <div style=\"font-size:clamp(20px,3.4vw,30px);color:#f7f3ea;line-height:1.3;max-width:560px;\">Antes de começar, um convite para respirar com a guia<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ iniciar }}\" style=\"appearance:none;cursor:pointer;font-family:Georgia,serif;font-size:15px;padding:16px 36px;min-height:44px;border-radius:40px;border:none;background:#7b6bbd;color:#fbfaff;\">▶ Começar com som<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ iniciarSemSom }}\" style=\"appearance:none;cursor:pointer;font-family:Georgia,serif;font-size:13px;padding:12px 22px;min-height:44px;border-radius:40px;border:.5px solid rgba(247,243,234,.42);background:transparent;color:#d9d2ea;\">Continuar sem som<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div data-final=\"\" style=\"position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 50%,rgba(205,196,232,.9),rgba(238,235,246,.97));\">\n      <div style=\"font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#6f6690;font-family:system-ui,sans-serif;\">Parque Modulador · IET<\u002Fdiv>\n      <div style=\"font-size:clamp(26px,5vw,44px);color:#2e2740;text-align:center;line-height:1.1;\">O caminho já<br>começou em você<\u002Fdiv>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center;\">\n        <button sc-camel-on-click=\"{{ reiniciar }}\" style=\"appearance:none;cursor:pointer;font-family:Georgia,serif;font-size:14px;padding:14px 26px;min-height:44px;border-radius:40px;border:.5px solid rgba(46,39,64,.3);background:transparent;color:#2e2740;\">↺ Ver de novo<\u002Fbutton>\n        <a href=\"Parque dos 4 Raios (standalone).html\" style=\"text-decoration:none;font-family:Georgia,serif;font-size:15px;padding:15px 32px;min-height:44px;display:flex;align-items:center;border-radius:40px;background:#7b6bbd;color:#fbfaff;\">Entrar no Parque →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;narracao&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Voz da guia&quot;},&quot;velocidadeVoz&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.78,&quot;min&quot;:0.6,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Voz da guia&quot;},&quot;ambiencia&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Voz da guia&quot;}}\">\nclass Component extends DCLogic {\n  // Os 6 quadros seguem os Capítulos 1 a 7 do Lore: despertar na floresta,\n  // o primeiro portal (o corpo e a sede), a guia e a trilha chamada Cura,\n  // a casa da escuta, a alquimia interior e o espelho do propósito.\n  CENAS = [\n    { anim: 'kbA', dur: 9600, txt: 'Você desperta em um lugar vasto e silencioso, sem saber como chegou até aqui. O medo ocupa todos os espaços — e ainda assim uma pequena chama costura a noite diante de você.' },\n    { anim: 'kbB', dur: 9800, txt: 'A chama fala com voz calma e faz a primeira pergunta ao corpo: o que você precisa agora? Antes de qualquer mistério, é preciso beber, respirar, manter-se vivo.' },\n    { anim: 'kbC', dur: 10000, txt: 'A chama cresce e toma a forma da sua guia. Tati Àguiar não vem te salvar: ela aponta para a mata e ilumina uma trilha antes invisível. A trilha recebe um nome — Cura.' },\n    { anim: 'kbA', dur: 9800, txt: 'No centro da clareira, a casa da escuta. Aqui você senta, silencia e reconhece o que sente antes de nomear. Emoção não é desordem a reprimir: é linguagem a compreender.' },\n    { anim: 'kbB', dur: 9600, txt: 'O que queima, dissolve; o que dissolve, decanta. A alquimia interior separa a essência do condicionamento — e o que sobra, alimenta.' },\n    { anim: 'kbC', dur: 10600, txt: 'A jornada deixa de perguntar o que dói e passa a perguntar o que quer nascer. Este é o espelho do propósito, PaZciente. Respire fundo: o Parque te espera.' }\n  ];\n\n  state = { i: -1 };\n\n  componentDidMount() {\n    this.el = (s) => this.root && this.root.querySelector(s);\n    this.narrar = this.props.narracao !== false;\n    this.pausado = false;\n    try { speechSynthesis.getVoices(); } catch (e) {}\n    this._onKey = (e) => {\n      if (e.key === ' ') { e.preventDefault(); this.alternarPausa(); }\n      if (e.key === 'Escape') this.pular();\n    };\n    window.addEventListener('keydown', this._onKey);\n  }\n\n  componentWillUnmount() {\n    clearTimeout(this._t);\n    window.removeEventListener('keydown', this._onKey);\n    try { speechSynthesis.cancel(); } catch (e) {}\n    try { if (this._ac) this._ac.close(); } catch (e) {}\n  }\n\n  renderVals() {\n    return {\n      root: (n) => { if (n) this.root = n; },\n      alternarPausa: () => this.alternarPausa(),\n      alternarSom: () => this.alternarSom(),\n      pular: () => this.encerrar(),\n      reiniciar: () => this.reiniciar(),\n      fecharAviso: () => { const a = this.el('[data-aviso-voz]'); if (a) a.style.display = 'none'; },\n      iniciar: () => this.iniciar(true),\n      iniciarSemSom: () => this.iniciar(false)\n    };\n  }\n\n  // o gesto de clique é o que libera voz e áudio nos navegadores\n  iniciar(comSom) {\n    const tela = this.el('[data-tela-inicial]');\n    if (tela) tela.style.display = 'none';\n    this.narrar = comSom && this.props.narracao !== false;\n    const bSom = this.el('[data-btn-som]');\n    if (bSom) { bSom.textContent = this.narrar ? '🔊' : '🔇'; bSom.style.opacity = this.narrar ? '1' : '.65'; }\n    if (comSom) { this.initAmbiente(); if (this._ac && this._ac.state === 'suspended') this._ac.resume(); }\n    setTimeout(() => { const f = this.el('[data-fade]'); if (f) f.style.opacity = '0'; }, 120);\n    this._t = setTimeout(() => this.irPara(0), 900);\n  }\n\n  // ── voz da guia: a mais humana disponível, mansa e acolhedora ──\n  // Prioriza vozes neurais femininas pt-BR (Francisca, Luciana, Google pt-BR),\n  // fala devagar (rate 0.78) e quebra o texto em frases curtas, com respiro\n  // entre elas — é o que faz a locução soar humana em vez de robótica.\n  vozGuia() {\n    if (this._voz) return this._voz;\n    const vs = speechSynthesis.getVoices() || [];\n    const pt = vs.filter((v) => /pt[-_]?BR/i.test(v.lang) || /portugu/i.test(v.name));\n    const pref = ['francisca', 'luciana', 'google português do brasil', 'google portugues do brasil', 'maria', 'camila', 'fernanda', 'vitória', 'vitoria', 'helo'];\n    for (const p of pref) {\n      const m = pt.find((v) => v.name.toLowerCase().indexOf(p) !== -1);\n      if (m) { this._voz = m; return m; }\n    }\n    const fem = pt.find((v) => !/ricardo|daniel|felipe|thiago|male|homem/i.test(v.name));\n    this._voz = fem || pt[0] || null;\n    return this._voz;\n  }\n\n  falar(txt, opts) {\n    if (!this.narrar || !window.speechSynthesis) return;\n    const suave = !!(opts && opts.suave);\n    try {\n      speechSynthesis.cancel();\n      if (!speechSynthesis.getVoices().length) {\n        speechSynthesis.onvoiceschanged = () => { this._voz = null; this.falar(txt, opts); };\n      }\n      const v = this.vozGuia();\n      // frases curtas com pequena pausa: dá respiração à fala\n      const partes = txt.split(/(?<=[.!?…:—])\\s+/).filter((s) => s.trim());\n      partes.forEach((p, k) => {\n        const u = new SpeechSynthesisUtterance(p.trim());\n        u.lang = 'pt-BR';\n        // abertura: voz mais mansa e baixa, entrando aos poucos\n        u.rate = suave ? (this.props.velocidadeVoz ?? 0.78) * 0.9 : (this.props.velocidadeVoz ?? 0.78);\n        u.pitch = suave ? 0.94 : 1.06;\n        u.volume = suave ? (k === 0 ? 0.55 : 0.85) : 1;\n        if (v) u.voice = v;\n        if (k === 0) {\n          // dentro de um iframe de preview o navegador descarta a fala:\n          // onend chega quase instantâneo sem onstart. Detectamos e avisamos.\n          const t0 = Date.now();\n          let comecou = false;\n          u.onstart = () => { comecou = true; this._ttsOk = true; this.duckAmbiente(true); };\n          u.onend = () => { if (!comecou && Date.now() - t0 < 400 && !this._ttsOk) this.avisarVozBloqueada(); };\n        }\n        if (k === partes.length - 1) u.onend = () => this.duckAmbiente(false);\n        speechSynthesis.speak(u);\n        if (k < partes.length - 1) {\n          const respiro = new SpeechSynthesisUtterance(' ');\n          respiro.lang = 'pt-BR'; respiro.rate = 0.6; respiro.volume = 0;\n          speechSynthesis.speak(respiro);\n        }\n      });\n    } catch (e) {}\n  }\n\n  avisarVozBloqueada() {\n    if (this._avisou) return;\n    this._avisou = true;\n    const a = this.el('[data-aviso-voz]');\n    if (a) a.style.display = 'flex';\n  }\n\n  // ── ambiência morna sob a voz (pad grave + brisa), com ducking ──\n  initAmbiente() {\n    if (this._ac || this.props.ambiencia === false) return;\n    try {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      const ac = new AC();\n      this._ac = ac;\n      const out = ac.createGain(); out.gain.value = 0.0001; out.connect(ac.destination);\n      this._amb = out;\n      const bus = ac.createGain(); bus.gain.value = 1; bus.connect(out);\n      const dl = ac.createDelay(1.5); dl.delayTime.value = 0.7;\n      const fb = ac.createGain(); fb.gain.value = 0.3;\n      const wet = ac.createGain(); wet.gain.value = 0.32;\n      bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(out);\n      [110, 164.81, 220].forEach((f, i) => {\n        const o = ac.createOscillator(), g = ac.createGain();\n        o.type = i === 0 ? 'sine' : 'triangle'; o.frequency.value = f;\n        o.detune.value = (Math.random() * 8) - 4;\n        g.gain.value = 0.05 / (i + 1);\n        o.connect(g); g.connect(bus); o.start();\n      });\n      const sr = ac.sampleRate, buf = ac.createBuffer(1, sr * 4, sr), bd = buf.getChannelData(0);\n      for (let i = 0; i < bd.length; i++) bd[i] = (Math.random() * 2 - 1) * 0.045;\n      const ns = ac.createBufferSource(); ns.buffer = buf; ns.loop = true;\n      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 280;\n      const lfo = ac.createOscillator(); lfo.frequency.value = 0.05;\n      const lg = ac.createGain(); lg.gain.value = 80;\n      lfo.connect(lg); lg.connect(lp.frequency); lfo.start();\n      ns.connect(lp); lp.connect(bus); ns.start();\n      out.gain.setTargetAtTime(0.34, ac.currentTime, 3);\n    } catch (e) {}\n  }\n\n  duckAmbiente(falando) {\n    if (!this._ac || !this._amb) return;\n    try { this._amb.gain.setTargetAtTime(falando ? 0.1 : 0.34, this._ac.currentTime, falando ? 0.5 : 1.6); } catch (e) {}\n  }\n\n  irPara(i) {\n    if (i >= this.CENAS.length) { this.encerrar(); return; }\n    const c = this.CENAS[i];\n    this.state.i = i;\n    // camadas: a nova entra em cross-dissolve, o ken-burns roda pela duração inteira\n    const camadas = this.root ? this.root.querySelectorAll('[data-cena]') : [];\n    camadas.forEach((img) => {\n      const n = +img.getAttribute('data-cena');\n      if (n === i) {\n        img.style.animation = 'none';\n        void img.offsetWidth;\n        img.style.animation = c.anim + ' ' + (c.dur + 2600) + 'ms linear forwards';\n        img.style.opacity = '1';\n      } else {\n        img.style.opacity = '0';\n      }\n    });\n    const pips = this.ro

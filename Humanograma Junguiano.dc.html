document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

01, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c1ee01a9-a51d-4aa6-bf3a-122d31a16345\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"03d64d0c-96dc-46a0-bdce-7c14f1355986\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html,body{margin:0;padding:0;background:#1a1423;}\n  a{color:#c7b9ff;text-decoration:none;} a:hover{color:#e5dcff;}\n  button{font-family:'Nunito',system-ui,sans-serif;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh;background:linear-gradient(135deg,#1a1423 0%,#2d1b3d 100%);color:#ede9ff;font-family:'Nunito',system-ui,sans-serif;padding:34px 20px 80px;box-sizing:border-box;\">\n  <div style=\"max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:30px;\">\n\n    <a href=\"./O Parque - Jogo Completo.dc.html\" style=\"align-self:flex-start;display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:999px;border:1px solid rgba(199,185,255,.3);background:rgba(199,185,255,.08);color:#c7b9ff;font-size:13.5px;\"><span>←<\u002Fspan>Tela inicial<\u002Fa>\n\n    <div style=\"display:flex;flex-direction:column;gap:10px;\">\n      <div style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(199,185,255,.75);\">Humanograma · o caminho da individuação<\u002Fdiv>\n      <h1 style=\"font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(32px,5vw,48px);line-height:1.05;margin:0;\">Oito modos de habitar você<\u002Fh1>\n      <div style=\"font-size:16.5px;line-height:1.65;color:rgba(237,233,255,.65);max-width:38em;text-wrap:pretty;\">Arquétipo não é rótulo, é um jeito que a vida encontrou de aparecer em você. Cada um vem com uma analogia — uma cena comum — para você reconhecer sem precisar de teoria. Marque de 0 a 5 o quanto cada cena parece com o seu momento. Nada aqui classifica: só mostra por onde a integração está pedindo passagem.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;justify-content:center;\">{{ svgRoda }}<\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start;\">\n      <sc-for list=\"{{ cartas }}\" as=\"a\" hint-placeholder-count=\"8\">\n        <div style=\"border:1px solid {{ a.borda }};background:{{ a.fundo }};border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;\">\n            <div style=\"font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;color:{{ a.cor }};\">{{ a.nome }}<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,233,255,.42);\">{{ a.eixo }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.6;color:rgba(237,233,255,.78);font-style:italic;text-wrap:pretty;\">{{ a.analogia }}<\u002Fdiv>\n          <div style=\"display:flex;gap:7px;align-items:center;\">\n            <sc-for list=\"{{ a.pontos }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ p.marcar }}\" title=\"{{ p.rot }}\" style=\"appearance:none;cursor:pointer;flex:1;min-height:38px;border-radius:11px;border:1px solid {{ p.borda }};background:{{ p.fundo }};color:{{ p.texto }};font-size:13px;font-weight:600;\">{{ p.n }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:rgba(237,233,255,.45);\">{{ a.rotuloNota }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ a.abrir }}\" style=\"appearance:none;cursor:pointer;align-self:flex-start;border:none;background:transparent;color:{{ a.cor }};font-size:13.5px;padding:4px 0;\">{{ a.rotuloAbrir }}<\u002Fbutton>\n          <sc-if value=\"{{ a.aberto }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:11px;border-top:1px solid rgba(237,233,255,.12);padding-top:13px;\">\n              <div style=\"font-size:14.5px;line-height:1.6;color:rgba(237,233,255,.7);\"><span style=\"color:{{ a.cor }};font-weight:700;\">Persona: <\u002Fspan>{{ a.persona }}<\u002Fdiv>\n              <div style=\"font-size:14.5px;line-height:1.6;color:rgba(237,233,255,.7);\"><span style=\"color:#e0556b;font-weight:700;\">Sombra: <\u002Fspan>{{ a.sombra }}<\u002Fdiv>\n              <div style=\"font-size:14.5px;line-height:1.6;color:rgba(237,233,255,.7);\"><span style=\"color:#9ff0cd;font-weight:700;\">Virtude: <\u002Fspan>{{ a.virtude }}<\u002Fdiv>\n              <div style=\"background:rgba(255,255,255,.045);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;\">\n                <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(199,185,255,.7);\">A pergunta que volta para você<\u002Fdiv>\n                <div style=\"font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.45;color:#ede9ff;text-wrap:pretty;\">{{ a.pergunta }}<\u002Fdiv>\n                <textarea value=\"{{ a.resposta }}\" sc-camel-on-change=\"{{ a.escrever }}\" placeholder=\"Escreva aqui, do seu jeito. Ninguém corrige.\" rows=\"3\" style=\"width:100%;box-sizing:border-box;background:rgba(11,8,20,.55);border:1px solid rgba(237,233,255,.14);border-radius:12px;padding:11px 13px;font-family:'Nunito',system-ui,sans-serif;font-size:14px;color:#ede9ff;outline:none;resize:vertical;\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.6;color:rgba(159,240,205,.85);\"><span style=\"font-weight:700;\">Primeiro passo pequeno: <\u002Fspan>{{ a.gesto }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(160,143,255,.1);border:1px solid rgba(160,143,255,.3);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#c7b9ff;\">O que a sua roda está dizendo<\u002Fdiv>\n      <div style=\"font-size:15.5px;line-height:1.75;color:rgba(237,233,255,.8);text-wrap:pretty;\">{{ leitura }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(159,240,205,.08);border:1px solid rgba(159,240,205,.28);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9ff0cd;\">Caminho das virtudes · a semana da integração<\u002Fdiv>\n      <sc-for list=\"{{ caminho }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;gap:14px;align-items:flex-start;\">\n          <div style=\"flex:none;width:30px;height:30px;border-radius:50%;background:rgba(159,240,205,.16);color:#9ff0cd;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;\">{{ c.n }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px;\">\n            <div style=\"font-size:16px;font-weight:700;color:#e8ffef;\">{{ c.titulo }}<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.6;color:rgba(237,233,255,.68);text-wrap:pretty;\">{{ c.texto }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:13.5px;line-height:1.6;color:rgba(237,233,255,.5);\">A individuação não é virar outra pessoa. É parar de gastar energia mantendo escondida a parte que já é sua.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n      <button sc-camel-on-click=\"{{ enviar }}\" style=\"appearance:none;cursor:pointer;border:1px solid rgba(159,240,205,.45);background:rgba(159,240,205,.12);color:#9ff0cd;border-radius:999px;padding:14px 24px;font-size:15px;font-weight:600;min-height:48px;\">{{ enviarRotulo }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ limpar }}\" style=\"appearance:none;cursor:pointer;border:1px solid rgba(237,233,255,.18);background:transparent;color:rgba(237,233,255,.6);border-radius:999px;padding:14px 24px;font-size:15px;min-height:48px;\">↺ Refazer a roda<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pedirSessao }}\" style=\"appearance:none;cursor:pointer;border:1px solid rgba(199,185,255,.42);background:rgba(199,185,255,.12);color:#c7b9ff;border-radius:999px;padding:14px 24px;font-size:15px;font-weight:600;min-height:48px;\">{{ sessaoRotulo }}<\u002Fbutton>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;1400px&quot;}}\">\nconst ARQ = [\n  { id:'inocente', nome:'O Inocente', eixo:'confiança', cor:'#ffd700', ang:-90,\n    analogia:'É a criança que entra no mar sem medir a profundidade — e o adulto que ainda acredita que dessa vez vai dar certo.',\n    persona:'Aparece como a pessoa leve, otimista, que não quer criar problema e prefere acreditar que tudo se resolve.',\n    sombra:'Negar o que dói para não ter de agir; deixar que decidam por você e chamar isso de paz.',\n    virtude:'Confiança lúcida: enxergar o tamanho real do mar e ainda assim entrar na água.',\n    pergunta:'O que você já viu, mas ainda finge não ter visto?',\n    gesto:'Diga em voz alta, sem ninguém por perto, uma frase que você vem evitando dizer. Só isso, hoje.' },\n  { id:'explorador', nome:'O Explorador', eixo:'liberdade', cor:'#ff6b9d', ang:-45,\n    analogia:'É quem muda o caminho de casa só para ver outra rua — e às vezes muda de vida pelo mesmo motivo.',\n    persona:'Aparece como a pessoa inquieta, independente, que sufoca com rotina e combina de decidir depois.',\n    sombra:'Ir embora antes de sentir; confundir fuga com liberdade e recomeço com evolução.',\n    virtude:'Liberdade com raiz: escolher para onde ir sabendo de onde se está saindo.',\n    pergunta:'Da última vez que você foi embora de algo, o que ficou por sentir?',\n    gesto:'Fique cinco minutos a mais numa conversa que você normalmente encurtaria.' },\n  { id:'sabio', nome:'O Sábio', eixo:'entendimento', cor:'#a08fff', ang:0,\n    analogia:'É quem lê a bula inteira antes do remédio — e às vezes ainda está lendo quando a febre passa.',\n    persona:'Aparece como a pessoa que explica, contextualiza, entende todos os lados e é procurada para conselho.',\n    sombra:'Usar o entendimento como anestesia: compreender a dor com tanta clareza que não precisa senti-la.',\n    virtude:'Discernimento encarnado: saber o que é verdade e deixar essa verdade mudar o corpo.',\n    pergunta:'Qual coisa você já entendeu perfeitamente e mesmo assim continua fazendo igual?',\n    gesto:'Escolha uma coisa que você entende bem e faça, hoje, em vez de explicar.' },\n  { id:'heroi', nome:'O Herói', eixo:'coragem', cor:'#e0556b', ang:45,\n    analogia:'É quem carrega as sacolas todas de uma vez para não fazer duas viagens — e depois passa a noite com o ombro doendo.',\n    persona:'Aparece como a pessoa forte, resolvida, que aguenta, entrega e não deixa a peteca cair.',\n    sombra:'Provar valor pelo esforço; transformar cada dia num campo de batalha e o descanso em fracasso.',\n    virtude:'Coragem escolhida: entrar na luta que importa e sair das que só provam alguma coisa.',\n    pergunta:'Que batalha você está travando hoje só porque parar pareceria desistir?',\n    gesto:'Entregue uma tarefa a outra pessoa hoje, sem refazer depois.' },\n  { id:'mago', nome:'O Mago', eixo:'transformação', cor:'#6dd5ff', ang:90,\n    analogia:'É quem olha as sobras da geladeira e serve um jantar — a matéria era a mesma, mudou a mão.',\n    persona:'Aparece como a pessoa intensa, intuitiva, que atravessa crises e sai delas com outra forma.',\n    sombra:'Transmutar rápido demais: pular o luto, virar a página antes de ler, querer que a dor tenha sido lição já.',\n    virtude:'Alquimia paciente: deixar a matéria escurecer o tempo que precisa antes de virar ouro.',\n    pergunta:'O que em você ainda não terminou de se dissolver, mesmo que a história já esteja bem contada?',\n    gesto:'Reserve dez minutos hoje sem transformar nada: só ficar com o que está.' },\n  { id:'amante', nome:'O Amante', eixo:'entrega', cor:'#ff85c0', ang:135,\n    analogia:'É quem repete a mesma música vinte vezes porque ela toca num lugar exato — e quem some quando o outro chega perto demais.',\n    persona:'Aparece como a pessoa afetuosa, presente, que cuida do vínculo e sente cada mudança de temperatura.',\n    sombra:'Existir pelo olhar do outro; medir o próprio valor pela quantidade de amor que consegue segurar.',\n    virtude:'Presença sem posse: ficar perto sem desaparecer, amar sem virar refém.',\n    pergunta:'Onde você está pagando com sua presença um lugar que já era seu?',\n    gesto:'Faça hoje uma coisa que te dá prazer e que ninguém vai ver.' },\n  { id:'criador', nome:'O Criador', eixo:'expressão', cor:'#ffb347', ang:180,\n    analogia:'É quem reorganiza a estante de madrugada porque a ideia não deixa dormir — e quem nunca acha a versão boa o bastante.',\n    persona:'Aparece como a pessoa das ideias, dos projetos, que enxerga o que ainda não existe.',\n    sombra:'Perfeccionismo que engaveta; criar sem terminar para nunca ser julgada pelo resultado.',\n    virtude:'Forma acabada: entregar imperfeito e deixar a obra viver fora de você.',\n    pergunta:'O que está pronto o suficiente e você ainda não mostrou para ninguém?',\n    gesto:'Mostre hoje, para uma pessoa, algo seu que está inacabado.' },\n  { id:'cuidador', nome:'O Cuidador', eixo:'cuidado', cor:'#98ff98', ang:225,\n    analogia:'É quem serve o prato de todo mundo e senta por último — e come frio sem reclamar.',\n    persona:'Aparece como a pessoa disponível, atenta, que percebe a necessidade do outro antes da própria.',\n    sombra:'Cuidar para ser necessária; adoecer no lugar de pedir; chamar de amor o que é medo de sobrar.',\n    virtude:'Cuidado recíproco: cuidar por escolha e saber receber sem se desculpar.',\n    pergunta:'Se você não fosse útil para ninguém amanhã, o que sobraria de você?',\n    gesto:'Peça hoje uma ajuda pequena que você conseguiria fazer sem ajuda.' }\n];\n\nconst CH = 'iet_humanograma';\n\nclass Component extends DCLogic {\n  state = { notas:{}, respostas:{}, aberto:null, enviado:false };\n\n  componentDidMount(){\n    try{\n      const s = JSON.parse(localStorage.getItem(CH) || 'null');\n      if(s) this.setState({ notas:s.notas||{}, respostas:s.respostas||{} });\n    }catch(e){}\n  }\n\n  salvar(){\n    try{ localStorage.setItem(CH, JSON.stringify({ notas:this.state.notas, respostas:this.state.respostas, ts:Date.now() })); }catch(e){}\n  }\n\n  hexRgb(hex){\n    const r = /^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i.exec(hex);\n    return r ? parseInt(r[1],16)+','+parseInt(r[2],16)+','+parseInt(r[3],16) : '160,143,255';\n  }\n\n  renderVals(){\n    const notas = this.state.notas;\n    const nota = id => (typeof notas[id] === 'number' ? notas[id] : null);\n    const at = id => (nota(id) === null ? 0.18 : Math.max(0.12, nota(id) / 5));\n\n    const el = [\n      React.createElement('circle', { key:'o', cx:250, cy:250, r:220, fill:'none', stroke:'rgba(160,143,255,.18)', strokeWidth:2 }),\n      React.createElement('circle', { key:'i', cx:250, cy:250, r:180, fill:'none', stroke:'rgba(230,85,107,.13)', strokeWidth:1, strokeDasharray:'5,5' })\n    ];\n    ARQ.forEach(a => {\n      const rad = a.ang * Math.PI / 180;\n      const raio = 40 + 112 * at(a.id);\n      el.push(React.createElement('line', { key:'g'+a.id, x1:250, y1:250, x2:250+180*Math.cos(rad), y2:250+180*Math.sin(rad), stroke:'rgba(160,143,255,.1)', strokeWidth:1 }));\n      el.push(React.createElement('line', { key:'a'+a.id, x1:250, y1:250, x2:250+raio*Math.cos(rad), y2:250+raio*Math.sin(rad), stroke:a.cor, strokeWidth:2+at(a.id)*3, opacity:.25+at(a.id)*.6, strokeLinecap:'round' }));\n    });\n    el.push(React.createElement('circle', { key:'s', cx:250, cy:250, r:40, fill:'rgba(160,143,255,.2)', stroke:'#a08fff', strokeWidth:2 }));\n    el.push(React.createElement('text', { key:'st', x:250, y:255, textAnchor:'middle', fontSize:12, fill:'#c7b9ff', fontWeight:'bold', letterSpacing:2 }, 'SELF'));\n    ARQ.forEach(a => {\n      const rad = a.ang * Math.PI / 180;\n      const x = 250 + 208*Math.cos(rad), y = 250 + 208*Math.sin(rad);\n      el.push(React.createElement('g', { key:'n'+a.id },\n        React.createElement('circle', { cx:x, cy:y, r:15, fill:a.cor, opacity:.15+at(a.id)*.6 }),\n        React.createElement('circle', { cx:x, cy:y, r:15, fill:'none', stroke:a.cor, strokeWidth:1.6, opacity:.35+at(a.id)*.55 }),\n        React.createElement('text', { x:x, y:y+4, textAnchor:'middle', fontSize:11, fill:'#1a1423', fontWeight:'bold' }, nota(a.id) === null ? '' : String(nota(a.id))),\n        React.createElement('text', { x:250+236*Math.cos(rad), y:250+236*Math.sin(rad)+4, textAnchor:Math.abs(Math.cos(rad))<0.2?'middle':(Math.cos(rad)>0?'start':'end'), fontSize:10.5, fill:a.cor, fontWeight:'bold' }, a.nome.replace('O ',''))\n      ));\n    });\n\n    const cartas = ARQ.map(a => {\n      const n = nota(a.id);\n      const aberto = this.state.aberto === a.id;\n      return {\n        ...a,\n        borda: n !== null && n >= 4 ? 'rgba('+this.hexRgb(a.cor)+',.5)' : 'rgba(237,233,255,.12)',\n        fundo: n !== null && n >= 4 ? 'rgba('+this.hexRgb(a.cor)+',.09)' : 'rgba(255,255,255,.03)',\n        aberto,\n        resposta: this.state.respostas[a.id] || '',\n        rotuloAbrir: aberto ? 'fechar ↑' : 'ver persona, sombra e virtude ↓',\n        rotuloNota: n === null ? '0 = não me reconheço aqui · 5 = é exatamente assim que ando' : (n >= 4 ? 'Bem viva em você agora.' : n >= 2 ? 'Aparece de vez em quando.' : 'Quase adormecida — e o que dorme também fala.'),\n        abrir: () => this.setState({ aberto: aberto ? null : a.id }),\n        escrever: (e) => { const v = e.target.value; this.setState(s => ({ respostas: { ...s.respostas, [a.id]: v } }), () => this.salvar()); },\n        pontos: [0,1,2,3,4,5].map(k => ({\n          n: k, rot: 'nota ' + k,\n          borda: n === k ? a.cor : 'rgba(237,233,255,.14)',\n          fundo: n === k ? 'rgba('+this.hexRgb(a.cor)+',.3)' : 'transparent',\n          texto: n === k ? '#fff' : 'rgba(237,233,255,.5)',\n          marcar: () => this.setState(s => ({ notas: { ...s.notas, [a.id]: k } }), () => this.salvar())\n        }))\n      };\n    });\n\n    const marcados = ARQ.filter(a => nota(a.id) !== null);\n    const ord = marcados.slice().sort((x,y) => nota(y.id) - nota(x.id));\n    const altos = ord.filter(a => nota(a.id) >= 4);\n    const baixos = ord.filter(a => nota(a.id) <= 1);\n\n    let leitura;\n    if (marcados.length < 3) {\n      leitura = 'Marque pelo menos três cenas para a roda começar a falar. Não precisa acertar: escolha pela reação do corpo, não pelo que soa melhor.';\n    } else {\n      const top = ord.slice(0,2);\n      leitura = 'Neste momento você está habitando principalmente ' + top.map(a => a.nome).join(' e ') + '. '\n        + 'O que sustenta essa presença é ' + top[0].virtude.split(':')[0].toLowerCase() + '; o que a desgasta é ' + top[0].sombra.split(';')[0].toLowerCase() + '. '\n        + (baixos.length\n            ? 'Do outro lado da roda, ' + baixos.map(a => a.nome).join(' e ') + ' ' + (baixos.length > 1 ? 'estão' : 'está') + ' quase sem luz — e é justamente aí que costuma estar a energia que falta, guardada como sombra. '\n            : 'Nenhum arquétipo está apagado: sua energia está distribuída, o trabalho agora é de ritmo, não de resgate. ')\n        + 'Individuação, aqui, não significa fortalecer o que já é forte: significa devolver movimento ao que ficou parado, sem abandonar quem te trouxe até aqui.';\n    }\n\n    const foco = altos[0] || ord[0] || ARQ[2];\n    const resgate = baixos[0] || ord[ord.length-1] || ARQ[0];\n    const caminho = [\n      { n:'1', titulo:'Reconhecer sem julgar — ' + foco.nome, texto:'Durante três dias, observe quando ' + foco.nome.toLowerCase().replace('o ','o ') + ' assume o comando. Não mude nada: só anote a hora e o que estava em jogo. Reconhecer é o que tira o automático do automático.' },\n      { n:'2', titulo:'Nomear a sombra — sem virar defeito', texto:foco.sombra + ' Quando isso aparecer, diga para você mesma: \"isto é medo, não é a minha natureza\". A sombra não se corta, se conversa.' },\n      { n:'3', titulo:'Praticar a virtude — ' + resgate.nome, texto:resgate.virtude + ' Comece pelo gesto pequeno: ' + resgate.gesto.charAt(0).toLowerCase() + resgate.gesto.slice(1) + ' Repita quatro vezes na semana; na quinta, veja o que mudou no corpo.' }\n    ];\n\n    return {\n      svgRoda: React.createElement('svg', { viewBox:'-60 -20 620 540', width:440, height:384, style:{ maxWidth:'100%', filter:'drop-shadow(0 0 30px rgba(160,143,255,.28))' } }, el),\n      cartas, leitura, caminho,\n      enviarRotulo: this.state.enviado ? '✓ Roda enviada para a sua terapeuta' : '📤 Enviar minha roda para a terapeuta',\n      enviar: () => {\n        const p = { t:'humanograma', ts:Date.now(), dia:new Date().toLocaleDateString('pt-BR'),\n          notas:this.state.notas, respostas:this.state.respostas,\n          altos:altos.map(a=>a.nome), baixos:baixos.map(a=>a.nome) };\n        try{\n          const h = JSON.parse(localStorage.getItem('iet_sessoes') || '[]');\n          h.push(p);\n          localStorage.setItem('iet_sessoes', JSON.stringify(h.slice(-200)));\n        }catch(e){}\n        try{ if(window.parent && window.parent !== window) window.parent.postMessage(p, '*'); }catch(e){}\n        this.setState({ enviado:true });\n      },\n      limpar: () => this.setState({ notas:{}, respostas:{}, aberto:null, enviado:false }, () => this.salvar()),\n      sessaoRotulo: this.state.pedido ? '✓ Pedido enviado — ela vai te chamar' : '💬 Solicitar acompanhamento terapêutico',\n      pedirSessao: () => {\n        const p = { t:'agendar', ts:Date.now(), dia:new Date().toLocaleDateString('pt-BR'), origem:'humanograma',\n          altos:altos.map(a=>a.nome), baixos:baixos.map(a=>a.nome) };\n        try{\n          const fila = JSON.parse(localStorage.getItem('iet_pedidos_sessao') || '[]');\n          fila.push(p);\n          localStorage.setItem('iet_pedidos_sessao', JSON.stringify(fila.slice(-50)));\n        }catch(e){}\n        try{ if(window.parent && window.parent !== window) window.parent.postMessage({t:'pedido-sessao', v:p}, '*'); }catch(e){}\n        this.setState({ pedido:true });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

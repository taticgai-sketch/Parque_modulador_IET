tom:18px;\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{{ mestreDiaCor }};margin-bottom:6px;\">Mestre do dia<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:700;line-height:1.35;text-wrap:pretty;\">{{ mestreDiaTexto }}<\u002Fdiv>\n        <div style=\"font-size:15px;color:#5c5473;margin-top:8px;\">Tocar para conhecer →<\u002Fdiv>\n      <\u002Fbutton>\n\n      <div style=\"display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px 18px;margin-bottom:18px;\">\n        <span style=\"font-size:15px;font-weight:700;white-space:nowrap;\">{{ luzesGanhas }}<\u002Fspan>\n        <span style=\"font-size:15px;line-height:1.5;color:#5c5473;\">{{ campoResumo }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;\">\n        <sc-for list=\"{{ mestres }}\" as=\"m\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ m.abrir }}\" style=\"text-align:left;cursor:pointer;border-radius:18px;padding:18px;border:3px solid {{ m.borda }};background:{{ m.bg }};font-family:'Sora',sans-serif;color:#221d33;\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:9px;\">\n              <span style=\"width:34px;height:34px;border-radius:50%;background:{{ m.cor }};display:inline-block;\"><\u002Fspan>\n              <span style=\"font-size:26px;\">{{ m.emoji }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;line-height:1.25;\">{{ m.nome }}<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.45;color:#5c5473;margin-top:4px;\">{{ m.papel }}<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:700;color:{{ m.cor }};margin-top:9px;\">{{ m.missao }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ campoAberto }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:18px;background:#fff;border-radius:20px;padding:26px;box-shadow:0 4px 20px rgba(0,0,0,.07);\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px;\">\n            <span style=\"width:52px;height:52px;border-radius:50%;background:{{ campoCor }};display:inline-block;flex:0 0 52px;\"><\u002Fspan>\n            <div style=\"flex:1;\">\n              <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:{{ campoCor }};margin-bottom:3px;\">{{ campoMissao }}<\u002Fdiv>\n              <div style=\"font-size:26px;font-weight:700;line-height:1.2;\">{{ campoNome }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ campoFechar }}\" style=\"flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:2px solid #e2ddf3;background:#fff;color:#5c5473;font-size:18px;font-weight:700;cursor:pointer;\">✕<\u002Fbutton>\n          <\u002Fdiv>\n\n          <p style=\"margin:0 0 14px;font-size:19px;line-height:1.6;font-style:italic;text-wrap:pretty;\">{{ campoFala }}<\u002Fp>\n\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:20px;\">\n            <span style=\"font-size:14px;font-weight:700;white-space:nowrap;\">{{ campoNivel }}<\u002Fspan>\n            <div style=\"flex:1;height:9px;border-radius:5px;background:#eeebf8;overflow:hidden;\">\n              <div style=\"height:100%;border-radius:5px;background:{{ campoCor }};width:{{ campoBarra }}%;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size:13px;color:#5c5473;white-space:nowrap;\">{{ campoPontos }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;\">\n            <div style=\"background:#f7f6fd;border-radius:16px;padding:16px;\">\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a6fa8;margin-bottom:7px;\">No corpo<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.6;\">{{ campoCorpo }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#f7f6fd;border-radius:16px;padding:16px;\">\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a6fa8;margin-bottom:7px;\">No sentir<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.6;\">{{ campoEmocao }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#f7f6fd;border-radius:16px;padding:16px;\">\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a6fa8;margin-bottom:7px;\">Na energia<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.6;\">{{ campoEnergia }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-radius:16px;padding:18px;background:#f3f0ff;border:2px solid #ddd5f7;\">\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b5cae;margin-bottom:6px;\">Prática de hoje<\u002Fdiv>\n            <div style=\"font-size:17px;line-height:1.55;font-weight:600;text-wrap:pretty;\">{{ campoPratica }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ campoReceber }}\" style=\"width:100%;margin-top:16px;padding:18px;border-radius:16px;border:none;background:{{ campoCor }};color:#fff;font-family:'Sora',sans-serif;font-size:17px;font-weight:700;cursor:pointer;\">{{ campoBotao }}<\u002Fbutton>\n          <p style=\"margin:14px 0 0;font-size:15px;line-height:1.6;color:#5c5473;font-style:italic;text-wrap:pretty;\">{{ campoAcolhe }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top:26px;background:linear-gradient(135deg,#f3f0ff,#eaf6f9);border-radius:20px;padding:24px;border:3px solid #c1e2ea;\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4a8fa3;margin-bottom:6px;\">Missão 10 · Mestre Cristal<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;line-height:1.2;margin-bottom:8px;\">O Caminho da Integração<\u002Fdiv>\n        <p style=\"margin:0 0 16px;font-size:17px;line-height:1.6;color:#3d5b64;text-wrap:pretty;\">{{ integraTexto }}<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px;\">\n          <sc-for list=\"{{ integraPassos }}\" as=\"p\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;gap:12px;align-items:center;background:{{ p.bg }};border-radius:14px;padding:13px 16px;border:2px solid {{ p.borda }};\">\n              <span style=\"flex:0 0 30px;height:30px;border-radius:50%;background:{{ p.cor }};color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;\">{{ p.n }}<\u002Fspan>\n              <div style=\"flex:1;\">\n                <div style=\"font-size:16px;font-weight:700;line-height:1.3;\">{{ p.titulo }}<\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.5;color:#4f6068;margin-top:2px;\">{{ p.acao }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:13px;font-weight:700;color:{{ p.cor }};white-space:nowrap;\">{{ p.selo }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ integraAvancar }}\" style=\"width:100%;padding:18px;border-radius:16px;border:none;background:#4a8fa3;color:#fff;font-family:'Sora',sans-serif;font-size:17px;font-weight:700;cursor:pointer;\">{{ integraBotao }}<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:18px;background:#fff;border-radius:20px;padding:24px;\">\n        <div style=\"font-size:19px;font-weight:700;margin-bottom:4px;\">Sete formas de criar saúde<\u002Fdiv>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.6;color:#5c5473;text-wrap:pretty;\">Saúde não é só a ausência de doença: ela nasce das suas escolhas. Cada Mestre guarda um jeito de criar saúde no dia a dia.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;\">\n          <sc-for list=\"{{ pilares }}\" as=\"p\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;gap:11px;align-items:flex-start;background:#f7f6fd;border-radius:14px;padding:14px 16px;\">\n              <span style=\"width:12px;height:12px;border-radius:50%;background:{{ p.cor }};margin-top:5px;flex:0 0 12px;\"><\u002Fspan>\n              <div>\n                <div style=\"font-size:16px;font-weight:700;line-height:1.3;\">{{ p.nome }}<\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.5;color:#5c5473;margin-top:3px;\">{{ p.quem }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;font-weight:600;text-wrap:pretty;\">Saúde é luz. Luz é escolha. Escolha cuidar de você.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ======================= PRATO DE LUZ ======================= -->\n  <sc-if value=\"{{ mostraOn.nutrir }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <div style=\"max-width:1000px;margin:0 auto;background:#fbfdf8;border-radius:22px;padding:26px;color:#1e2a19;\">\n\n      <div style=\"display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;\">\n        <div style=\"flex:0 0 54px;height:54px;border-radius:50%;background:#e4f2da;display:flex;align-items:center;justify-content:center;font-size:28px;\">🌱<\u002Fdiv>\n        <div style=\"flex:1;\">\n          <div style=\"font-size:28px;font-weight:700;line-height:1.2;margin-bottom:6px;\">Prato de Luz<\u002Fdiv>\n          <p style=\"margin:0;font-size:17px;line-height:1.6;color:#55654e;text-wrap:pretty;\">Sou a Tati, sua Guia. Aqui a gente não fala de doença — fala do que acende o seu corpo. Cada comida traz uma luz: força, energia, defesa, calma, equilíbrio, sol. Monte seu prato de hoje e veja seu corpo acender.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px;align-items:center;background:#eef7e6;border-radius:16px;padding:14px 18px;margin-bottom:24px;\">\n        <span style=\"font-size:22px;\">🤍<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;font-weight:600;\">Não precisa ser perfeito. Precisa ser constante. Quando você cuida hoje, evita problema amanhã.<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start;\">\n\n        <div>\n          <div style=\"font-size:19px;font-weight:700;margin-bottom:4px;\">Monte seu prato de hoje<\u002Fdiv>\n          <p style=\"margin:0 0 14px;font-size:15px;line-height:1.5;color:#55654e;\">Toque no que você comeu (ou vai comer) hoje. Pode ser pouco.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;\">\n            <sc-for list=\"{{ comidas }}\" as=\"f\" hint-placeholder-count=\"18\">\n              <button sc-camel-on-click=\"{{ f.tocar }}\" style=\"cursor:pointer;border-radius:16px;padding:14px 8px;border:3px solid {{ f.borda }};background:{{ f.bg }};font-family:'Sora',sans-serif;color:#1e2a19;text-align:center;\">\n                <div style=\"font-size:30px;line-height:1;margin-bottom:6px;\">{{ f.e }}<\u002Fdiv>\n                <div style=\"font-size:14px;font-weight:700;line-height:1.25;\">{{ f.n }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"background:#fff;border-radius:20px;padding:22px;box-shadow:0 3px 16px rgba(0,0,0,.06);margin-bottom:14px;\">\n            <div style=\"font-size:19px;font-weight:700;margin-bottom:4px;\">Seu corpo hoje<\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:15px;line-height:1.5;color:#55654e;\">{{ pratoResumo }}<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:9px;\">\n              <sc-for list=\"{{ luzes }}\" as=\"l\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;align-items:center;gap:11px;border-radius:14px;padding:11px 13px;background:{{ l.bg }};border:2px solid {{ l.borda }};\">\n                  <span style=\"font-size:24px;opacity:{{ l.opacidade }};\">{{ l.emoji }}<\u002Fspan>\n                  <div style=\"flex:1;\">\n                    <div style=\"font-size:15px;font-weight:700;line-height:1.2;\">{{ l.nome }}<\u002Fdiv>\n                    <div style=\"font-size:13px;line-height:1.4;color:#55654e;\">{{ l.estado }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ pratoLimpar }}\" style=\"width:100%;margin-top:14px;padding:13px;border-radius:14px;border:2px solid #d8e6cd;background:#fff;color:#55654e;font-family:'Sora',sans-serif;font-size:15px;font-weight:700;cursor:pointer;\">Começar outro prato<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"background:#eef7e6;border-radius:20px;padding:20px;\">\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4e7a37;margin-bottom:8px;\">A Guia lembra<\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.65;text-wrap:pretty;\">Você não é só quem usa esse corpo. Você é quem cuida dele. Cada escolha vira força, energia e prevenção — e ninguém precisa fazer isso perfeito para começar hoje.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:28px;\">\n        <div style=\"font-size:19px;font-weight:700;margin-bottom:4px;\">As seis luzes, uma a uma<\u002Fdiv>\n        <p style=\"margin:0 0 14px;font-size:15px;line-height:1.5;color:#55654e;\">Toque para a Guia te explicar o que cada uma faz e onde encontrar.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;\">\n          <sc-for list=\"{{ nutriCards }}\" as=\"n\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ n.abrir }}\" style=\"text-align:left;cursor:pointer;border-radius:18px;padding:18px;border:3px solid {{ n.borda }};background:{{ n.bg }};font-family:'Sora',sans-serif;color:#1e2a19;\">\n              <div style=\"font-size:32px;line-height:1;margin-bottom:9px;\">{{ n.emoji }}<\u002Fdiv>\n              <div style=\"font-size:17px;font-weight:700;line-height:1.25;\">{{ n.nome }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.45;color:#55654e;margin-top:4px;\">{{ n.apelido }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ nutriAberto }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:18px;background:#fff;border-radius:20px;padding:26px;box-shadow:0 4px 20px rgba(0,0,0,.07);\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px;\">\n            <span style=\"font-size:44px;\">{{ nutriEmoji }}<\u002Fspan>\n            <div style=\"flex:1;\">\n              <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4e7a37;margin-bottom:3px;\">{{ nutriMissao }}<\u002Fdiv>\n              <div style=\"font-size:26px;font-weight:700;line-height:1.2;\">{{ nutriNome }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ nutriFechar }}\" style=\"flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:2px solid #d8e6cd;background:#fff;color:#55654e;font-size:18px;font-weight:700;cursor:pointer;\">✕<\u002Fbutton>\n          <\u002Fdiv>\n\n          <p style=\"margin:0 0 18px;font-size:18px;line-height:1.6;text-wrap:pretty;\">{{ nutriOque }}<\u002Fp>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:18px;\">\n            <sc-for list=\"{{ nutriFaz }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start;background:#f4faee;border-radius:14px;padding:13px 16px;\">\n                <span style=\"font-size:18px;\">✨<\u002Fspan>\n                <span style=\"font-size:16px;line-height:1.55;font-weight:600;text-wrap:pretty;\">{{ p.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#f4faee;border-radius:16px;padding:16px 18px;margin-bottom:18px;\">\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4e7a37;margin-bottom:8px;\">Onde encontrar<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.7;\">{{ nutriComidas }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-radius:16px;padding:18px;background:#fff8e6;border:2px solid #f0dba8;\">\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a5801f;margin-bottom:6px;\">Missão de hoje<\u002Fdiv>\n            <div style=\"font-size:17px;line-height:1.55;font-weight:600;text-wrap:pretty;\">{{ nutriTarefa }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ======================= CUIDE DE VOCÊ ======================= -->\n  <sc-if value=\"{{ mostraOn.cuidar }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <div style=\"max-width:940px;margin:0 auto;background:#fff5f7;border-radius:22px;padding:26px;color:#2b1820;\">\n\n      <div style=\"display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;\">\n        <div style=\"flex:0 0 54px;height:54px;border-radius:50%;background:#ffd9e3;display:flex;align-items:center;justify-content:center;font-size:28px;\">💗<\u002Fdiv>\n        <div style=\"flex:1;\">\n          <div style=\"font-size:28px;font-weight:700;line-height:1.2;margin-bottom:6px;\">Cuide de Você<\u002Fdiv>\n          <p style=\"margin:0;font-size:17px;line-height:1.6;color:#6b4a56;text-wrap:pretty;\">Oito missões curtinhas pra você conhecer seu corpo por dentro e por fora. Não é exame de hospital, não é diagnóstico. É intimidade com você mesmo — e ela salva vidas.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px;align-items:center;background:#ffe6ed;border-radius:16px;padding:14px 18px;margin-bottom:22px;\">\n        <span style=\"font-size:22px;\">🤍<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;font-weight:600;\">Se notar algo diferente, fale com alguém que cuida de você. Sem susto, sem pressa — só fale.<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:22px;\">\n        <sc-for list=\"{{ cuidados }}\" as=\"c\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ c.abrir }}\" style=\"text-align:left;cursor:pointer;border-radius:18px;padding:18px;border:3px solid {{ c.borda }};background:{{ c.bg }};font-family:'Sora',sans-serif;color:#2b1820;\">\n            <div style=\"font-size:34px;line-height:1;margin-bottom:10px;\">{{ c.emoji }}<\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;line-height:1.25;margin-bottom:5px;\">{{ c.missao }}<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.45;color:#6b4a56;\">{{ c.resumo }}<\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:13px;font-weight:700;color:{{ c.selo }};\">{{ c.rotulo }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ cuidaAberto }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-radius:20px;padding:26px;box-shadow:0 4px 20px rgba(0,0,0,.07);\">\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px;\">\n            <span style=\"font-size:44px;\">{{ cuidaEmoji }}<\u002Fspan>\n            <div style=\"flex:1;\">\n              <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#c4557d;margin-bottom:3px;\">Missão<\u002Fdiv>\n              <div style=\"font-size:26px;font-weight:700;line-height:1.2;\">{{ cuidaMissao }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ cuidaFechar }}\" style=\"flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:2px solid #f0cdd8;background:#fff;color:#8b6a76;font-size:18px;font-weight:700;cursor:pointer;\">✕<\u002Fbutton>\n          <\u002Fdiv>\n\n          <p style=\"margin:0 0 18px;font-size:17px;line-height:1.6;color:#4a3038;text-wrap:pretty;\">{{ cuidaIntro }}<\u002Fp>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:18px;\">\n            <sc-for list=\"{{ cuidaPassos }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start;background:#fff5f7;border-radius:14px;padding:14px 16px;\">\n                <span style=\"flex:0 0 28px;height:28px;border-radius:50%;background:#ef7d9d;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;\">{{ p.n }}<\u002Fspan>\n                <span style=\"font-size:16px;line-height:1.55;font-weight:600;text-wrap:pretty;\">{{ p.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff8e6;border-radius:16px;padding:16px 18px;margin-bottom:18px;\">\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#b07d1a;margin-bottom:8px;\">Fique de olho em<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.7;color:#4a3a20;\">{{ cuidaObservar }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n            <button sc-camel-on-click=\"{{ cuidaMarcar }}\" style=\"flex:1;min-width:220px;padding:18px;border-radius:16px;border:none;background:#ef7d9d;color:#fff;font-family:'Sora',sans-serif;font-size:17px;font-weight:700;cursor:pointer;\">{{ cuidaBotao }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ cuidaFechar }}\" style=\"flex:0 0 auto;padding:18px 24px;border-radius:16px;border:2px solid #f0cdd8;background:#fff;color:#8b6a76;font-family:'Sora',sans-serif;font-size:17px;font-weight:700;cursor:pointer;\">Voltar<\u002Fbutton>\n          <\u002Fdiv>\n\n          <p style=\"margin:16px 0 0;font-size:14px;line-height:1.6;color:#8b6a76;text-wrap:pretty;\">Isso aqui não é diagnóstico. É você conhecendo seu corpo. Qualquer coisa diferente, fale com alguém que cuida de você.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ======================= BORA BRINCAR ======================= -->\n  <sc-if value=\"{{ mostraOn.brincar }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n\n    <!-- tela: o Guia se apresenta -->\n    <div style=\"display:{{ mostra2.bInicio }};max-width:760px;margin:0 auto;\">\n      <div style=\"background:#fff8ee;border-radius:22px;padding:32px;color:#2b2118;\">\n        <div style=\"display:flex;gap:18px;align-items:flex-start;margin-bottom:22px;\">\n          <div style=\"flex:0 0 76px;height:76px;border-radius:50%;background:#ffd79a;display:flex;align-items:center;justify-content:center;font-size:40px;animation:pulsa 2.4s ease-in-out infinite;\">🧍<\u002Fdiv>\n          <div style=\"flex:1;background:#fff;border-radius:18px;border-bottom-left-radius:4px;padding:18px 20px;box-shadow:0 2px 10px rgba(0,0,0,.07);\">\n            <div style=\"font-size:12px;font-weight:700;color:#c47a1a;letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px;\">Guia do Corpo<\u002Fdiv>\n            <p style=\"margin:0;font-size:19px;line-height:1.6;font-weight:600;text-wrap:pretty;\">Oi! Eu sou o Guia do Corpo. Vou te ajudar a descobrir como você se mexe. Bora regular?<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px;\">\n          <div style=\"background:#fff;border-radius:16px;padding:18px;\">\n            <div style=\"font-size:30px;margin-bottom:8px;\">🤳<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:700;margin-bottom:4px;\">Você se vê na tela<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.55;color:#6b5b4a;\">Como uma selfie. Faça o movimento olhando pra você mesmo.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border-radius:16px;padding:18px;\">\n            <div style=\"font-size:30px;margin-bottom:8px;\">🎯<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:700;margin-bottom:4px;\">São missões curtinhas<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.55;color:#6b5b4a;\">“Olhe pro céu”, “Encoste a orelha no ombro”. Uma de cada vez.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border-radius:16px;padding:18px;\">\n            <div style=\"font-size:30px;margin-bottom:8px;\">🙂<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:700;margin-bottom:4px;\">Eu te digo como foi<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.55;color:#6b5b4a;\">Sem número difícil. Só carinha, cor e uma frase.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#ffeed6;border-radius:16px;padding:18px;margin-bottom:24px;\">\n          <p style=\"margin:0;font-size:15px;line-height:1.65;font-weight:600;\">Regra de ouro: <span style=\"font-weight:400;\">vá só até onde é confortável. Se doer, pare — e procure alguém que cuida de você.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ comecarBrincar }}\" style=\"width:100%;padding:20px;border-radius:16px;border:none;background:#f0a94c;color:#2b2118;font-family:'Sora',sans-serif;font-size:20px;font-weight:700;cursor:pointer;\">Bora regular! 🎮<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- tela: missão -->\n    <div style=\"display:{{ mostra2.bMissao }};max-width:1000px;margin:0 auto;\">\n      <div style=\"background:#fff8ee;border-radius:22px;padding:26px;color:#2b2118;\">\n\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;\">\n          <span style=\"font-size:13px;font-weight:700;color:#c47a1a;\">Missão {{ mNum }} de {{ mTotal }}<\u002Fspan>\n          <div style=\"flex:1;height:10px;border-radius:5px;background:#ffe3bd;overflow:hidden;\">\n            <div style=\"height:100%;border-radius:5px;background:#f0a94c;width:{{ mProgresso }}%;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size:13px;font-weight:700;color:#8b7a67;\">{{ mParte }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n          <div style=\"flex:1;min-width:170px;display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);\">\n            <span style=\"flex:0 0 26px;height:26px;border-radius:50%;background:#f0a94c;color:#2b2118;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;\">1<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.45;font-weight:600;\">Leia a missão e faça o movimento devagar.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:170px;display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);\">\n            <span style=\"flex:0 0 26px;height:26px;border-radius:50%;background:#f0a94c;color:#2b2118;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;\">2<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.45;font-weight:600;\">Pare onde ficou desconfortável e arraste a barrinha até ali.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:170px;display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);\">\n            <span style=\"flex:0 0 26px;height:26px;border-radius:50%;background:#f0a94c;color:#2b2118;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;\">3<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.45;font-weight:600;\">Eu te devolvo a carinha e o que fazer com isso.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;\">\n\n          <div>\n            <div style=\"font-size:12px;font-weight:700;color:#c47a1a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;\">Sua selfie de movimento (opcional)<\u002Fdiv>\n            <div style=\"position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#2b2118;\">\n              <video ref=\"{{ videoRefB }}\" autoplay=\"\" playsinline=\"\" muted=\"\" style=\"width:100%;height:100%;object-fit:cover;transform:scaleX(-1);\"><\u002Fvideo>\n              <div style=\"position:absolute;left:12px;top:12px;font-size:13px;font-weight:700;color:#fff8ee;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:10px;\">Espelho — faça o movimento se olhando<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ ligarCamera }}\" style=\"width:100%;margin-top:10px;padding:14px;border-radius:14px;border:2px solid #f0a94c;background:#fff;color:#c47a1a;font-family:'Sora',sans-serif;font-size:15px;font-weight:700;cursor:pointer;\">📷 {{ rotuloCamera }}<\u002Fbutton>\n            <sc-if value=\"{{ camErro }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:8px 0 0;font-size:13px;line-height:1.5;color:#a4472f;background:#ffe9e2;border-radius:12px;padding:10px 12px;\">{{ camErro }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px;\">\n              <div style=\"font-size:30px;font-weight:700;line-height:1.2;margin-bottom:10px;text-wrap:pretty;\">{{ mTit }}<\u002Fdiv>\n              <p style=\"margin:0;font-size:17px;line-height:1.6;color:#6b5b4a;text-wrap:pretty;\">{{ mDica }}<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px;\">\n              <div style=\"font-size:15px;font-weight:700;margin-bottom:4px;\">Até onde você conseguiu ir?<\u002Fdiv>\n              <p style=\"margin:0 0 14px;font-size:14px;line-height:1.5;color:#8b7a67;\">Arraste a bolinha até o ponto onde seu corpo parou.<\u002Fp>\n              <input type=\"range\" min=\"0\" max=\"{{ mMax }}\" step=\"1\" value=\"{{ mValor }}\" sc-camel-on-change=\"{{ mMudar }}\" sc-camel-on-input=\"{{ mMudar }}\" style=\"width:100%;height:26px;accent-color:#f0a94c;\">\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#8b7a67;margin-top:2px;\">\n                <span>quase não saiu do lugar<\u002Fspan><span>fui até o meu limite<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border-radius:18px;padding:22px;background:{{ mCor }}22;border:3px solid {{ mCor }};\">\n              <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:10px;\">\n                <span style=\"font-size:44px;\">{{ mCara }}<\u002Fspan>\n                <span style=\"font-size:20px;font-weight:700;line-height:1.35;text-wrap:pretty;\">{{ mFrase }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;color:#4a3d31;text-wrap:pretty;\">{{ mExpl }}<\u002Fp>\n              <div style=\"display:inline-block;padding:8px 16px;border-radius:999px;background:#2b2118;color:#fff8ee;font-size:15px;font-weight:700;\">{{ mAcao }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:12px;margin-top:20px;\">\n          <button sc-camel-on-click=\"{{ mVoltar }}\" style=\"flex:0 0 auto;padding:18px 24px;border-radius:16px;border:2px solid #e0cdb5;background:#fff;color:#8b7a67;font-family:'Sora',sans-serif;font-size:18px;font-weight:700;cursor:pointer;\">←<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ mProxima }}\" style=\"flex:1;padding:18px;border-radius:16px;border:none;background:#f0a94c;color:#2b2118;font-family:'Sora',sans-serif;font-size:19px;font-weight:700;cursor:pointer;\">{{ mRotulo }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- tela: fim -->\n    <div style=\"display:{{ mostra2.bFim }};max-width:700px;margin:0 auto;\">\n      <div style=\"background:#fff8ee;border-radius:22px;padding:32px;color:#2b2118;text-align:center;\">\n        <div style=\"font-size:56px;margin-bottom:10px;\">🎉<\u002Fdiv>\n        <div style=\"font-size:28px;font-weight:700;margin-bottom:8px;\">Você terminou as missões!<\u002Fdiv>\n        <div style=\"font-size:17px;color:#6b5b4a;margin-bottom:24px;\">Mexeu bem em <strong>{{ mBoas }}<\u002Fstrong> de <strong>{{ mFeitas }}<\u002Fstrong> movimentos que você fez.<\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:18px;padding:22px;margin-bottom:14px;text-align:left;\">\n          <p style=\"margin:0;font-size:18px;line-height:1.65;font-weight:600;text-wrap:pretty;\">{{ mResumo }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#ffeed6;border-radius:18px;padding:20px;margin-bottom:24px;text-align:left;\">\n          <div style=\"font-size:13px;font-weight:700;color:#c47a1a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;\">Lembre-se<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.7;\">Se doer, procure alguém que cuida de você.<br>Se estiver difícil, vale conversar com um profissional.<br>Seu corpo está pedindo atenção — e ele avisa antes de gritar.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n          <button sc-camel-on-click=\"{{ mSalvarBrincar }}\" style=\"flex:1;min-width:200px;padding:18px;border-radius:16px;border:none;background:#f0a94c;color:#2b2118;font-family:'Sora',sans-serif;font-size:17px;font-weight:700;cursor:pointer;\">Guardar meu resultado<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ mReiniciar }}\" style=\"flex:1;min-width:200px;padding:18px;border-radius:16px;border:2px solid #e0cdb5;background:#fff;color:#8b7a67;font-family:'Sora',sans-serif;font-size:17px;font-weight:700;cursor:pointer;\">Jogar de novo<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ======================= AVALIAR ======================= -->\n  <div style=\"display:{{ mostra.avaliar }};\">\n\n    <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;\">\n      <sc-for list=\"{{ segmentos }}\" as=\"s\" hint-placeholder-count=\"9\">\n        <button sc-camel-on-click=\"{{ s.selecionar }}\" style=\"padding:8px 13px;border-radius:8px;border:1px solid {{ s.borda }};background:{{ s.bg }};color:{{ s.fg }};font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;cursor:pointer;\">{{ s.emoji }} {{ s.nomeUp }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1.1fr 0.95fr;gap:16px;align-items:start;\">\n\n      <!-- PAINEL 1 — espelhamento corporal -->\n      <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:14px;padding:16px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;\">\n          <h2 style=\"margin:0;font-size:13px;font-weight:600;color:#9aa1a8;text-transform:uppercase;letter-spacing:.09em;\">Espelhamento corporal<\u002Fh2>\n          <button sc-camel-on-click=\"{{ ligarCamera }}\" style=\"padding:6px 10px;border-radius:7px;border:1px solid #2a2e33;background:#20242a;color:#7fd1c1;font-family:'Sora',sans-serif;font-size:11px;font-weight:600;cursor:pointer;\">{{ rotuloCamera }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"position:relative;aspect-ratio:3/4;border-radius:11px;overflow:hidden;background:#0b0d0f;border:1px solid #23272c;\">\n          <video ref=\"{{ videoRef }}\" autoplay=\"\" playsinline=\"\" muted=\"\" style=\"width:100%;height:100%;object-fit:cover;transform:scaleX(-1);\"><\u002Fvideo>\n\n          <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;\">\n            <div style=\"position:relative;width:2px;height:46%;background:rgba(255,255,255,.28);\">\n              <div style=\"position:absolute;left:-1px;bottom:0;width:4px;height:4px;border-radius:50%;background:#fff;\"><\u002Fdiv>\n              <div style=\"position:absolute;bottom:0;left:0;width:2px;height:100%;transform-origin:bottom center;transform:rotate({{ agulhaDeg }}deg);background:{{ corStatus }};box-shadow:0 0 12px {{ corStatus }};\"><\u002Fdiv>\n              <div style=\"position:absolute;bottom:0;left:0;width:2px;height:100%;transform-origin:bottom center;transform:rotate({{ alvoDeg }}deg);background:repeating-linear-gradient(to top,rgba(255,255,255,.5) 0 6px,transparent 6px 12px);\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position:absolute;left:10px;top:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8b9198;background:rgba(0,0,0,.45);padding:4px 7px;border-radius:6px;\">{{ dicaEspelho }}<\u002Fdiv>\n          <div style=\"position:absolute;right:10px;bottom:10px;font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500;color:{{ corStatus }};\">{{ valorAtual }}°<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-top:12px;font-size:10.5px;color:#7d848b;font-family:'IBM Plex Mono',monospace;\">\n          <span style=\"color:#4ade80;\">■ dentro<\u002Fspan><span style=\"color:#fbbf24;\">■ reduzida<\u002Fspan><span style=\"color:#f87171;\">■ excessiva<\u002Fspan>\n          <span style=\"margin-left:auto;\">--- movimento ideal<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PAINEL 2 — instruções -->\n      <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:14px;padding:20px;\">\n        <h2 style=\"margin:0 0 4px;font-size:13px;font-weight:600;color:#9aa1a8;text-transform:uppercase;letter-spacing:.09em;\">Painel de instruções<\u002Fh2>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6f757c;margin-bottom:16px;\">prova {{ passo }} de {{ totalPassos }} · {{ segNome }}<\u002Fdiv>\n\n        <div style=\"font-size:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:14px;\">{{ movNome }}<\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;\">\n          <div style=\"background:#1e2226;border-radius:9px;padding:11px 13px;\">\n            <div style=\"font-size:10px;color:#6f757c;text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px;\">Plano<\u002Fdiv>\n            <div style=\"font-size:14px;font-weight:600;\">{{ movPlano }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#1e2226;border-radius:9px;padding:11px 13px;\">\n            <div style=\"font-size:10px;color:#6f757c;text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px;\">Eixo<\u002Fdiv>\n            <div style=\"font-size:14px;font-weight:600;\">{{ movEixo }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#1e2226;border-radius:9px;padding:11px 13px;grid-column:span 2;\">\n            <div style=\"font-size:10px;color:#6f757c;text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px;\">ADM normal<\u002Fdiv>\n            <div style=\"font-size:14px;font-weight:600;color:#7fd1c1;font-family:'IBM Plex Mono',monospace;\">{{ movADM }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <p style=\"margin:0 0 18px;font-size:14px;line-height:1.65;color:#c3c8cd;text-wrap:pretty;\">{{ movDesc }}<\u002Fp>\n\n        <div style=\"background:#1e2226;border-radius:11px;padding:16px;margin-bottom:16px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;\">\n            <span style=\"font-size:12px;color:#9aa1a8;\">Registre o ângulo obtido<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:20px;color:{{ corStatus }};\">{{ valorAtual }}°<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"{{ sliderMin }}\" max=\"{{ sliderMax }}\" step=\"1\" value=\"{{ valorAtual }}\" sc-camel-on-change=\"{{ mudarValor }}\" sc-camel-on-input=\"{{ mudarValor }}\" style=\"width:100%;\">\n          <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6f757c;margin-top:4px;\">\n            <span>{{ sliderMin }}°<\u002Fspan><span>ideal {{ movMaxRot }}°<\u002Fspan><span>{{ sliderMax }}°<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:9px;\">\n          <button sc-camel-on-click=\"{{ anterior }}\" style=\"flex:0 0 auto;padding:12px 16px;border-radius:9px;border:1px solid #2a2e33;background:#20242a;color:#c3c8cd;font-family:'Sora',sans-serif;font-size:13px;font-weight:600;cursor:pointer;\">←<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ proximo }}\" style=\"flex:1;padding:12px;border-radius:9px;border:none;background:#7fd1c1;color:#0f1113;font-family:'Sora',sans-serif;font-size:14px;font-weight:700;cursor:pointer;\">{{ rotuloProximo }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PAINEL 3 — registro clínico -->\n      <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:14px;padding:20px;\">\n        <h2 style=\"margin:0 0 14px;font-size:13px;font-weight:600;color:#9aa1a8;text-transform:uppercase;letter-spacing:.09em;\">Registro clínico<\u002Fh2>\n\n        <div style=\"background:#0b0d0f;border:1px solid #23272c;border-radius:10px;padding:14px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:2;color:#dfe3e7;margin-bottom:16px;\">\n          <sc-for list=\"{{ linhasRegistro }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div style=\"white-space:pre;\">{{ l.txt }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border-radius:10px;padding:14px;margin-bottom:14px;background:{{ statusBg }};border:1px solid {{ corStatus }};\">\n          <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#9aa1a8;margin-bottom:5px;\">Indicador de risco<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:700;color:{{ corStatus }};\">{{ statusTexto }}<\u002Fdiv>\n          <div style=\"margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9aa1a8;\">{{ classeADM }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#14181c;border:1px solid #253138;border-radius:10px;padding:15px;margin-bottom:14px;\">\n          <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7fd1c1;margin-bottom:7px;\">Escuta integral do movimento<\u002Fdiv>\n          <p style=\"margin:0 0 10px;font-size:13px;line-height:1.7;color:#c3c8cd;text-wrap:pretty;\">{{ escutaIntegral }}<\u002Fp>\n          <p style=\"margin:0;font-size:13px;line-height:1.7;color:#9aa1a8;text-wrap:pretty;\">{{ escutaFecho }}<\u002Fp>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ alternarExplicacao }}\" style=\"width:100%;padding:11px;border-radius:9px;border:1px solid #2a2e33;background:#20242a;color:#7fd1c1;font-family:'Sora',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;\">Entenda seu resultado<\u002Fbutton>\n\n        <div style=\"display:{{ mostra.explicacao }};background:#1e2226;border-radius:10px;padding:15px;margin-bottom:14px;\">\n          <p style=\"margin:0 0 12px;font-size:13px;line-height:1.7;color:#c3c8cd;text-wrap:pretty;\">{{ explicacaoOcupacional }}<\u002Fp>\n          <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#6f757c;margin-bottom:7px;\">Sugestão de autocuidado<\u002Fdiv>\n          <sc-for list=\"{{ autocuidado }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:8px;font-size:13px;line-height:1.6;color:#dfe3e7;margin-bottom:5px;\">\n              <span style=\"color:#7fd1c1;\">·<\u002Fspan><span>{{ a.txt }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:{{ mostra.notaLombar }};background:#1a1614;border:1px solid #3a2f26;border-radius:10px;padding:14px;margin-bottom:14px;\">\n          <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#c9a37a;margin-bottom:7px;\">Casos clínicos possíveis — plano frontal lombar<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.9;color:#d8c6b2;\">\n            Anquilose esquerda — F: 20-0<br>\n            Anquilose direita — F: 0-20<br>\n            Restrição parcial — F: 30-20-0\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ salvar }}\" style=\"width:100%;padding:13px;border-radius:9px;border:1px solid #7fd1c1;background:transparent;color:#7fd1c1;font-family:'Sora',sans-serif;font-size:13px;font-weight:700;cursor:pointer;\">Salvar no histórico<\u002Fbutton>\n        <div style=\"display:{{ mostra.salvo }};margin-top:9px;font-size:12px;color:#4ade80;text-align:center;\">Avaliação salva. Compare na aba 5.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ======================= TABELAS ======================= -->\n  <div style=\"display:{{ mostra.tabelas }};\">\n    <p style=\"margin:0 0 20px;font-size:14px;line-height:1.7;color:#9aa1a8;max-width:720px;text-wrap:pretty;\">Referência completa de amplitude de movimento usada pelo módulo. Coluna registra por plano (Sagital, Frontal, Rotação); membros registram por código de movimento.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;\">\n      <sc-for list=\"{{ tabela }}\" as=\"t\" hint-placeholder-count=\"9\">\n        <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:13px;padding:17px;\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:13px;padding-bottom:11px;border-bottom:1px solid #23272c;\">\n            <span style=\"font-size:15px;\">{{ t.emoji }}<\u002Fspan>\n            <span style=\"font-size:15px;font-weight:700;\">{{ t.nomeUp }}<\u002Fspan>\n            <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6f757c;\">{{ t.grupo }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ t.linhas }}\" as=\"ln\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed #212529;\">\n              <span style=\"font-size:13px;color:#dfe3e7;flex:1;\">{{ ln.nome }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7fd1c1;\">{{ ln.adm }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"margin-top:11px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.8;color:#8b9198;background:#0b0d0f;border-radius:8px;padding:10px;white-space:pre-line;\">{{ t.formato }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ======================= EDUCATIVO ======================= -->\n  <div style=\"display:{{ mostra.educativo }};\">\n    <div style=\"max-width:760px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7fd1c1;letter-spacing:.09em;text-transform:uppercase;margin-bottom:14px;\">Consciência corporal e prevenção<\u002Fdiv>\n      <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:14px;padding:28px;font-size:16px;line-height:1.85;color:#dfe3e7;text-wrap:pretty;\">\n        <p style=\"margin:0 0 14px;\">Você está realizando um teste de amplitude de movimento.<\u002Fp>\n        <p style=\"margin:0 0 14px;\">Cada articulação do corpo possui valores considerados saudáveis, chamados ADM.<\u002Fp>\n        <p style=\"margin:0 0 14px;\">Quando você se movimenta, o jogo mede seus ângulos e compara com esses valores.<\u002Fp>\n        <p style=\"margin:0 0 14px;\">Se você estiver dentro da amplitude normal, significa que sua articulação está funcionando bem.<\u002Fp>\n        <p style=\"margin:0 0 14px;\">Se estiver abaixo, pode haver rigidez, fraqueza ou limitação funcional.<\u002Fp>\n        <p style=\"margin:0 0 14px;\">Se estiver acima, pode indicar hipermobilidade, que aumenta o risco de lesões.<\u002Fp>\n        <p style=\"margin:0 0 14px;\">Este módulo foi criado para ajudar você a conhecer seu corpo, prevenir dores e melhorar sua saúde ocupacional.<\u002Fp>\n        <p style=\"margin:0;color:#c9a37a;\">Se seus resultados estiverem fora da faixa normal, considere procurar um profissional de saúde.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#14181c;border:1px solid #253138;border-radius:14px;padding:24px;margin-top:16px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7fd1c1;letter-spacing:.09em;text-transform:uppercase;margin-bottom:14px;\">O que é ADM — ADMc e ADMp<\u002Fdiv>\n        <p style=\"margin:0 0 14px;font-size:15px;line-height:1.8;color:#dfe3e7;text-wrap:pretty;\">A amplitude de movimento é o deslocamento <strong style=\"color:#7fd1c1;\">angular<\u002Fstrong> de uma <strong style=\"color:#7fd1c1;\">articulação<\u002Fstrong>. Quando esse deslocamento é máximo, recebe o nome de <strong>ADMc<\u002Fstrong> — amplitude de movimento completa. Quando ocorre em amplitudes <strong style=\"color:#7fd1c1;\">menores<\u002Fstrong> que a completa, é chamado de <strong>ADMp<\u002Fstrong> — amplitude de movimento parcial.<\u002Fp>\n        <p style=\"margin:0;font-size:15px;line-height:1.8;color:#c3c8cd;text-wrap:pretty;\">Cada prova do módulo classifica seu resultado nas duas escalas: o grau obtido e a proporção dele em relação à ADMc de referência.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#1a1614;border:1px solid #3a2f26;border-radius:14px;padding:24px;margin-top:16px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#c9a37a;letter-spacing:.09em;text-transform:uppercase;margin-bottom:14px;\">Antes de medir — protocolo e escuta<\u002Fdiv>\n        <p style=\"margin:0 0 14px;font-size:15px;line-height:1.8;color:#d8c6b2;text-wrap:pretty;\">Antes de começar a mensurar, os procedimentos devem ser explicados em detalhe, junto com os motivos pelos quais são feitos. Nem sempre será possível realizar o exame completo: uma articulação em inflamação aguda, por exemplo, não deve ser forçada. O nível de movimentação disponível depende de muitos fatores.<\u002Fp>\n        <p style=\"margin:0;font-size:15px;line-height:1.8;color:#d8c6b2;text-wrap:pretty;\">Nesses casos o encaminhamento é duplo: buscar ajuda médica para o que é estrutural, e complementar com a escuta do que aquele movimento pode estar sinalizando subjetivamente. Tudo aqui tem cunho integral — o grau é dado, e o dado é convite à compreensão, nunca sentença.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin-top:16px;\">\n        <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:12px;padding:16px;\">\n          <div style=\"font-size:13px;font-weight:700;margin-bottom:6px;color:#7fd1c1;\">Biomecânica<\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;line-height:1.65;color:#9aa1a8;\">Todo movimento acontece em um plano e gira em torno de um eixo. Nomear os dois transforma um gesto automático em gesto observado.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:12px;padding:16px;\">\n          <div style=\"font-size:13px;font-weight:700;margin-bottom:6px;color:#7fd1c1;\">Cinesiologia<\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;line-height:1.65;color:#9aa1a8;\">A amplitude disponível define quais tarefas o corpo alcança sem compensar. Compensação repetida é onde a dor começa.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:12px;padding:16px;\">\n          <div style=\"font-size:13px;font-weight:700;margin-bottom:6px;color:#7fd1c1;\">Terapia ocupacional<\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;line-height:1.65;color:#9aa1a8;\">O grau importa pelo que ele permite fazer: alcançar a prateleira, dirigir olhando o ombro, carregar sem travar a lombar.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ======================= FLUXOGRAMA ======================= -->\n  <div style=\"display:{{ mostra.fluxo }};\">\n    <div style=\"max-width:900px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7fd1c1;letter-spacing:.09em;text-transform:uppercase;margin-bottom:18px;\">Fluxograma de decisão clínica — módulo angular<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:0;\">\n        <sc-for list=\"{{ fluxo }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <div>\n            <div style=\"display:flex;gap:16px;align-items:flex-start;background:#171a1d;border:1px solid #2a2e33;border-radius:12px;padding:17px 19px;\">\n              <div style=\"flex:0 0 32px;height:32px;border-radius:50%;background:#20242a;border:1px solid #2f353b;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#7fd1c1;\">{{ f.n }}<\u002Fdiv>\n              <div style=\"flex:1;\">\n                <div style=\"font-size:15px;font-weight:600;margin-bottom:5px;\">{{ f.titulo }}<\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.7;color:#9aa1a8;white-space:pre-line;text-wrap:pretty;\">{{ f.corpo }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:16px;width:1px;background:#2f353b;margin:0 auto;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ======================= HISTÓRICO ======================= -->\n  <div style=\"display:{{ mostra.historico }};\">\n    <div style=\"display:grid;grid-template-columns:1.4fr .9fr;gap:16px;align-items:start;\">\n      <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:14px;padding:20px;\">\n        <h2 style=\"margin:0 0 4px;font-size:13px;font-weight:600;color:#9aa1a8;text-transform:uppercase;letter-spacing:.09em;\">Evolução angular<\u002Fh2>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6f757c;margin-bottom:18px;\">cada barra = % da ADM normal alcançada<\u002Fdiv>\n\n        <div style=\"display:{{ mostra.vazio }};font-size:14px;color:#6f757c;padding:30px 0;text-align:center;\">Nenhuma avaliação salva ainda. Faça uma prova na aba 1 e salve.<\u002Fdiv>\n\n        <sc-for list=\"{{ historico }}\" as=\"h\" hint-placeholder-count=\"2\">\n          <div style=\"border-bottom:1px solid #23272c;padding-bottom:15px;margin-bottom:15px;\">\n            <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:11px;\">\n              <span style=\"font-size:14px;font-weight:700;\">{{ h.emoji }} {{ h.seg }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6f757c;\">{{ h.data }}<\u002Fspan>\n              <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:{{ h.cor }};\">média {{ h.media }}%<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ h.barras }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px;\">\n                <span style=\"flex:0 0 150px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9aa1a8;\">{{ b.rot }}<\u002Fspan>\n                <div style=\"flex:1;height:8px;border-radius:4px;background:#20242a;overflow:hidden;\">\n                  <div style=\"height:100%;border-radius:4px;width:{{ b.pct }}%;background:{{ b.cor }};\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"flex:0 0 62px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#dfe3e7;\">{{ b.val }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <button sc-camel-on-click=\"{{ limparHistorico }}\" style=\"padding:9px 14px;border-radius:8px;border:1px solid #2a2e33;background:#20242a;color:#8b9198;font-family:'Sora',sans-serif;font-size:12px;cursor:pointer;\">Limpar histórico<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:14px;padding:20px;\">\n          <h2 style=\"margin:0 0 12px;font-size:13px;font-weight:600;color:#9aa1a8;text-transform:uppercase;letter-spacing:.09em;\">Alerta diário<\u002Fh2>\n          <p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#c3c8cd;text-wrap:pretty;\">Um lembrete curto por dia para alongar, estender e reobservar. A avaliação longitudinal só existe se o gesto virar rotina.<\u002Fp>\n          <label style=\"display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;margin-bottom:14px;\">\n            <input type=\"checkbox\" checked=\"{{ alertaOn }}\" sc-camel-on-change=\"{{ mudarAlerta }}\" style=\"width:17px;height:17px;accent-color:#7fd1c1;\">\n            <span>Ativar alerta diário<\u002Fspan>\n          <\u002Flabel>\n          <div style=\"background:#1e2226;border-radius:10px;padding:14px;\">\n            <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#6f757c;margin-bottom:7px;\">Prática de hoje<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.65;color:#dfe3e7;\">{{ praticaHoje }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#171a1d;border:1px solid #2a2e33;border-radius:14px;padding:20px;\">\n          <h2 style=\"margin:0 0 12px;font-size:13px;font-weight:600;color:#9aa1a8;text-transform:uppercase;letter-spacing:.09em;\">Metas de autocuidado<\u002Fh2>\n          <sc-for list=\"{{ metas }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px dashed #212529;\">\n              <span style=\"color:#7fd1c1;font-family:'IBM Plex Mono',monospace;font-size:12px;\">{{ m.tag }}<\u002Fspan>\n              <span style=\"font-size:13px;line-height:1.6;color:#dfe3e7;flex:1;\">{{ m.txt }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:900}}\">\nconst C_OK='#4ade80', C_LOW='#fbbf24', C_HI='#f87171';\n\nconst SEG = [\n  { id:'cervical', nome:'Cervical', emoji:'🟪', grupo:'coluna', tipo:'coluna', blocos:[\n    { sigla:'S', plano:'Sagital', eixo:'Latero-lateral', desc:'Jogador olha para cima (extensão) e depois para baixo (flexão).',\n      campos:[{k:'EXT',nome:'Extensão cervical',max:60},{k:'FLEX',nome:'Flexão cervical',max:50}] },\n    { sigla:'F', plano:'Frontal', eixo:'Antero-posterior', desc:'Jogador inclina a cabeça para o ombro esquerdo e direito.',\n      campos:[{k:'ESQ',nome:'Inclinação esquerda',max:45},{k:'DIR',nome:'Inclinação direita',max:45}] },\n    { sigla:'R', plano:'Transversal (Rotação)', eixo:'Longitudinal', desc:'Jogador gira a cabeça para olhar por cima dos ombros.',\n      campos:[{k:'ESQ',nome:'Rotação esquerda',max:80},{k:'DIR',nome:'Rotação direita',max:80}] } ] },\n\n  { id:'toracica', nome:'Torácica', emoji:'🟦', grupo:'coluna', tipo:'coluna', blocos:[\n    { sigla:'S', plano:'Sagital', eixo:'Latero-lateral', desc:'Jogador estende levemente o tronco e depois flexiona para frente.',\n      campos:[{k:'EXT',nome:'Extensão torácica',max:5},{k:'FLEX',nome:'Flexão torácica',max:45}] },\n    { sigla:'F', plano:'Frontal', eixo:'Antero-posterior', desc:'Jogador inclina o tronco lateralmente.',\n      campos:[{k:'ESQ',nome:'Inclinação esquerda',max:45},{k:'DIR',nome:'Inclinação direita',max:45}] },\n    { sigla:'R', plano:'Transversal (Rotação)', eixo:'Longitudinal', desc:'Jogador gira o tronco para esquerda e direita.',\n      campos:[{k:'ESQ',nome:'Rotação esquerda',max:30},{k:'DIR',nome:'Rotação direita',max:30}] } ] },\n\n  { id:'lombar', nome:'Lombar', emoji:'🟫', grupo:'coluna', tipo:'coluna', blocos:[\n    { sigla:'S', plano:'Sagital', eixo:'Latero-lateral', desc:'Jogador estende a lombar e depois flexiona o tronco para frente.',\n      campos:[{k:'EXT',nome:'Extensão lombar',max:25},{k:'FLEX',nome:'Flexão lombar',max:60}] },\n    { sigla:'F', plano:'Frontal (Flexão lateral)', eixo:'Antero-posterior', desc:'Jogador inclina o tronco lateralmente para esquerda e direita.',\n      campos:[{k:'ESQ',nome:'Flexão lateral esquerda',max:25},{k:'DIR',nome:'Flexão lateral direita',max:25}] } ] },\n\n  { id:'ombro', nome:'Ombro', emoji:'🟦', grupo:'membro superior', tipo:'membro', blocos:[\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Elevar o braço à frente até acima da cabeça.', campos:[{k:'OMBRO_FLEX',nome:'Flexão',max:180}] },\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Levar o braço para trás do corpo.', campos:[{k:'OMBRO_EXT',nome:'Extensão',max:40}] },\n    { plano:'Frontal', eixo:'Antero-posterior', desc:'Elevar o braço lateralmente até acima da cabeça.', campos:[{k:'OMBRO_ABD',nome:'Abdução',max:180}] },\n    { plano:'Frontal', eixo:'Antero-posterior', desc:'Cruzar o braço em direção ao corpo.', campos:[{k:'OMBRO_ADU',nome:'Adução',max:30}] },\n    { plano:'Transversal', eixo:'Longitudinal', desc:'Antebraço gira para o abdômen com cotovelo a 90°.', campos:[{k:'OMBRO_RI',nome:'Rotação interna',max:80}] },\n    { plano:'Transversal', eixo:'Longitudinal', desc:'Antebraço gira para fora com cotovelo a 90°.', campos:[{k:'OMBRO_RE',nome:'Rotação externa',max:90}] } ] },\n\n  { id:'cotovelo', nome:'Cotovelo', emoji:'🟩', grupo:'membro superior', tipo:'membro', blocos:[\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Dobrar o cotovelo aproximando a mão do ombro.', campos:[{k:'COTOV_FLEX',nome:'Flexão',max:150}] },\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Estender completamente o cotovelo. O valor ideal é 0° — qualquer grau restante é déficit de extensão.', campos:[{k:'COTOV_EXT',nome:'Extensão',max:0,zero:true}] } ] },\n\n  { id:'antebraco', nome:'Antebraço', emoji:'🟧', grupo:'membro superior', tipo:'membro', blocos:[\n    { plano:'Transversal', eixo:'Longitudinal', desc:'Palma gira para baixo.', campos:[{k:'ANTEB_PRON',nome:'Pronação',max:80}] },\n    { plano:'Transversal', eixo:'Longitudinal', desc:'Palma gira para cima.', campos:[{k:'ANTEB_SUP',nome:'Supinação',max:80}] } ] },\n\n  { id:'punho', nome:'Punho', emoji:'🟨', grupo:'membro superior', tipo:'membro', blocos:[\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Mão dobra para baixo.', campos:[{k:'PUNHO_FLEX',nome:'Flexão',max:60}] },\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Mão dobra para cima.', campos:[{k:'PUNHO_EXT',nome:'Extensão',max:60}] },\n    { plano:'Frontal', eixo:'Antero-posterior', desc:'Mão inclina para o lado do polegar.', campos:[{k:'PUNHO_DR',nome:'Desvio radial',max:20}] },\n    { plano:'Frontal', eixo:'Antero-posterior', desc:'Mão inclina para o lado do dedo mínimo.', campos:[{k:'PUNHO_DU',nome:'Desvio ulnar',max:30}] } ] },\n\n  { id:'quadril', nome:'Quadril', emoji:'🟪', grupo:'membro inferior', tipo:'membro', blocos:[\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Elevar a coxa à frente.', campos:[{k:'QUAD_FLEX',nome:'Flexão',max:100}] },\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Levar a perna para trás.', campos:[{k:'QUAD_EXT',nome:'Extensão',max:30}] },\n    { plano:'Frontal', eixo:'Antero-posterior', desc:'Afastar a perna lateralmente.', campos:[{k:'QUAD_ABD',nome:'Abdução',max:40}] },\n    { plano:'Frontal', eixo:'Antero-posterior', desc:'Cruzar a perna para a linha média.', campos:[{k:'QUAD_ADU',nome:'Adução',max:20}] },\n    { plano:'Transversal', eixo:'Longitudinal', desc:'Pé gira para dentro com joelho flexionado.', campos:[{k:'QUAD_RI',nome:'Rotação interna',max:40}] },\n    { plano:'Transversal', eixo:'Longitudinal', desc:'Pé gira para fora com joelho flexionado.', campos:[{k:'QUAD_RE',nome:'Rotação externa',max:50}] } ] },\n\n  { id:'joelho', nome:'Joelho', emoji:'🟥', grupo:'membro inferior', tipo:'membro', blocos:[\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Dobrar o joelho aproximando o calcanhar da coxa.', campos:[{k:'JOELHO_FLEX',nome:'Flexão',max:150}] },\n    { plano:'Sagital', eixo:'Latero-lateral', desc:'Estender completamente o joelho. O valor ideal é 0° — qualquer grau restante é déficit [mSel.k]: Math.min(10, base + 2) };\n          try { localStorage.setItem('iet_luzes', JSON.stringify(l)); } catch (e) {}\n          return { luzes: l, campoSel: null };\n        });\n      },\n\n      comidas: COMIDAS.map(f => {\n        const sel = (st.prato || []).indexOf(f.n) >= 0;\n        return { n: f.n, e: f.e, bg: sel ? '#dcf0cd' : '#fff', borda: sel ? '#7bb661' : '#e6efdd',\n          tocar: () => this.setState(s => {\n            const p = s.prato || [];\n            return { prato: p.indexOf(f.n) >= 0 ? p.filter(x => x !== f.n) : p.concat(f.n) };\n          }) };\n      }),\n      luzes: NUTRI.map(n => {\n        const aceso = (st.prato || []).some(nome => {\n          const f = COMIDAS.find(c => c.n === nome);\n          return f && f.nut.indexOf(n.k) >= 0;\n        });\n        return { emoji: n.emoji, nome: n.luz, opacidade: aceso ? '1' : '.35',\n          bg: aceso ? '#eef7e6' : '#fafbf8', borda: aceso ? '#7bb661' : '#eceee9',\n          estado: aceso ? 'acesa — ' + n.nome + ' entrou no prato' : 'apagada — falta ' + n.nome.toLowerCase() };\n      }),\n      pratoResumo: (() => {\n        const acesas = NUTRI.filter(n => (st.prato || []).some(nome => {\n          const f = COMIDAS.find(c => c.n === nome); return f && f.nut.indexOf(n.k) >= 0;\n        })).length;\n        if (!(st.prato || []).length) return 'Seu prato ainda está vazio. Toque em uma comida ao lado e veja o que acende.';\n        if (acesas <= 2) return 'Duas luzes já é começo. Escolha mais uma comida e veja outra acender.';\n        if (acesas <= 4) return 'Seu prato está ficando bonito: ' + acesas + ' luzes acesas de 6.';\n        if (acesas === 5) return 'Cinco de seis. Falta pouquinho para o corpo inteiro acender.';\n        return 'Seis luzes acesas. Hoje seu corpo tem força, sol, defesa, energia, calma e equilíbrio. 🤍';\n      })(),\n      pratoLimpar: () => this.setState({ prato: [] }),\n\n      nutriCards: NUTRI.map(n => ({ emoji: n.emoji, nome: n.nome, apelido: n.apelido,\n        bg: st.nutriSel === n.k ? '#fff' : n.bg, borda: st.nutriSel === n.k ? '#7bb661' : n.borda,\n        abrir: () => this.setState({ nutriSel: n.k }) })),\n      nutriAberto: !!nSel,\n      nutriEmoji: nSel ? nSel.emoji : '',\n      nutriNome: nSel ? nSel.nome : '',\n      nutriMissao: nSel ? nSel.missao : '',\n      nutriOque: nSel ? nSel.oque : '',\n      nutriFaz: nSel ? nSel.faz.map(t => ({ t })) : [],\n      nutriComidas: nSel ? nSel.comidas : '',\n      nutriTarefa: nSel ? nSel.tarefa : '',\n      nutriFechar: () => this.setState({ nutriSel: null }),\n\n      cuidados: CUIDADOS.map(c => ({\n        emoji: c.emoji, missao: c.missao, resumo: c.resumo,\n        bg: st.cuidaSel === c.k ? '#fff' : c.bg,\n        borda: st.cuidaSel === c.k ? '#ef7d9d' : c.borda,\n        selo: cFeitos[c.k] ? '#2f8f63' : '#c4557d',\n        rotulo: cFeitos[c.k] ? '✓ feita' : 'tocar para começar →',\n        abrir: () => this.setState({ cuidaSel: c.k })\n      })),\n      cuidaAberto: !!cSel,\n      cuidaEmoji: cSel ? cSel.emoji : '',\n      cuidaMissao: cSel ? cSel.missao : '',\n      cuidaIntro: cSel ? cSel.intro : '',\n      cuidaPassos: cSel ? cSel.passos.map((t, i) => ({ n: i + 1, t })) : [],\n      cuidaObservar: cSel ? cSel.observar : '',\n      cuidaBotao: cSel && cFeitos[cSel.k] ? '✓ Missão marcada como feita' : 'Fiz essa missão',\n      cuidaFechar: () => this.setState({ cuidaSel: null }),\n      cuidaMarcar: () => {\n        if (!cSel) return;\n        this.setState(s => {\n          const f = { ...(s.cuidaFeitos || {}), [cSel.k]: Date.now() };\n          try { localStorage.setItem('iet_cuidar_feitos', JSON.stringify(f)); } catch (e) {}\n          return { cuidaFeitos: f, cuidaSel: null };\n        });\n      },\n\n      segmentos: SEG.map((s, i) => ({\n        emoji:s.emoji, nomeUp:s.nome.toUpperCase(),\n        bg: i === segIdx ? '#20343180' : '#171a1d',\n        fg: i === segIdx ? '#7fd1c1' : '#8b9198',\n        borda: i === segIdx ? '#7fd1c1' : '#2a2e33',\n        selecionar: () => this.setState({ seg:i, passo:0, salvo:false })\n      })),\n\n      segNome: seg.nome, passo: passo + 1, totalPassos: provas.length,\n      movNome: p.nome, movPlano: p.bloco.plano, movEixo: p.bloco.eixo,\n      movADM: p.zero ? '0° (extensão completa)' : '0–' + p.max + '°',\n      movDesc: p.bloco.desc, movMaxRot: idealDeg,\n      valorAtual: valor, sliderMin: 0, sliderMax,\n      agulhaDeg: Math.round(valor * escala), alvoDeg: Math.round(idealDeg * escala),\n      corStatus: cl.cor, statusTexto: cl.txt,\n      statusBg: cl.st === 'ok' ? '#132018' : cl.st === 'low' ? '#211c10' : cl.st === 'hi' ? '#231313' : '#1e2226',\n      dicaEspelho: p.bloco.plano + ' · eixo ' + p.bloco.eixo.toLowerCase(),\n      classeADM: v === undefined ? 'ADM não registrada' : (p.zero ? (v <= 0 ? 'ADMc — amplitude de movimento completa' : 'ADMp — amplitude de movimento parcial') : (v >= p.max ? 'ADMc — amplitude de movimento completa' : 'ADMp — amplitude de movimento parcial (' + Math.min(100, Math.round(v / p.max * 100)) + '% da ADMc)')),\n      escutaIntegral: ESCUTA[seg.id] || '',\n      escutaFecho: cl.st === 'ok'\n        ? 'Amplitude preservada também é informação: o corpo está sustentando esse território. Registre e siga observando.'\n        : 'Duas coisas caminham juntas: buscar avaliação médica ou ocupacional para o que é estrutural, e escutar o que esse movimento pode estar sinalizando. Nada aqui é diagnóstico nem sentença — é vetor de progressão.',\n      rotuloCamera: st.camera ? 'Espelho ligado' : 'Ligar espelho',\n      videoRef: this.videoRef, videoRefB: this.videoRefB,\n      camErro: st.camErro || '',\n      ligarCamera: async () => {\n        if (st.camera) { this._attach(); return; }\n        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {\n          this.setState({ camera:false, camErro:'Este navegador não permite câmera aqui. Abra a página direto no navegador (não dentro de um quadro) e use https.' });\n          return;\n        }\n        try {\n          const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });\n          this._stream = s;\n          this.setState({ camera:true, camErro:'' }, () => this._attach());\n          this._attach();\n        } catch (e) {\n          const n = e && e.name;\n          this.setState({ camera:false, camErro:\n            n === 'NotAllowedError' ? 'Permissão de câmera negada. Autorize a câmera no cadeado da barra de endereço e toque de novo.'\n            : n === 'NotFoundError' ? 'Nenhuma câmera encontrada neste aparelho.'\n            : n === 'NotReadableError' ? 'A câmera está sendo usada por outro app. Feche-o e tente de novo.'\n            : 'Não consegui ligar a câmera (' + (n || 'erro') + '). Você pode seguir sem espelho.' });\n        }\n      },\n      mudarValor: e => {\n        const nv = parseInt(e.target.value, 10) || 0;\n        this.setState(s => ({ valores: { ...s.valores, [chave]: nv }, salvo:false }));\n      },\n      anterior: () => this.setState({ passo: Math.max(0, passo - 1), explic:false }),\n      proximo: () => this.setState(s => passo < provas.length - 1 ? { passo: passo + 1, explic:false } : { aba:'historico' }),\n      rotuloProximo: passo < provas.length - 1 ? 'Próximo movimento →' : 'Concluir segmento',\n\n      linhasRegistro: linhas,\n      alternarExplicacao: () => this.setState(s => ({ explic: !s.explic })),\n      explicacaoOcupacional: this.explicar(seg, p, cl),\n      autocuidado: this.cuidados(cl).map(t => ({ txt:t })),\n\n      salvar: () => {\n        const reg = { segId: seg.id, data: new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }), valores: { ...this.state.valores } };\n        const novo = [reg].concat(this.state.hist).slice(0, 40);\n        try { localStorage.setItem('iet_adm_hist', JSON.stringify(novo)); } catch (e) {}\n        this.setState({ hist: novo, salvo: true });\n      },\n      limparHistorico: () => { try { localStorage.setItem('iet_adm_hist', '[]'); } catch (e) {} this.setState({ hist: [] }); },\n\n      tabela, fluxo: FLUXO, historico,\n      alertaOn: st.alerta,\n      mudarAlerta: e => { const on = e.target.checked; try { localStorage.setItem('iet_adm_alerta', on ? '1' : '0'); } catch (er) {} this.setState({ alerta:on }); },\n      praticaHoje: PRATICAS[dia % PRATICAS.length],\n      metas: [\n        { tag:'7d', txt:'Registrar um segmento por dia, sempre no mesmo horário.' },\n        { tag:'30d', txt:'Recuperar 5° a 10° em cada movimento classificado como reduzido.' },\n        { tag:'90d', txt:'Todos os segmentos avaliados dentro da faixa, com registro longitudinal completo.' },\n        { tag:'sempre', txt:'Parar antes da dor. Amplitude se ganha com constância, não com força.' }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

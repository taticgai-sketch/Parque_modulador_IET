  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"fb3fabdf-7c63-4a29-bee1-ce7e228687ea\"><\u002Fscript>\n\n\n\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<script src=\"d65eb983-947a-476a-97b9-f2adb8ec8805\"><\u002Fscript>\n<script src=\"170eecdc-4716-476d-88d2-298014070dac\"><\u002Fscript>\n<script src=\"48740e15-25c0-4d1a-a6e6-339de8996993\"><\u002Fscript>\n<script src=\"6342ebbe-5767-49d4-ae4f-6c797e26c5da\"><\u002Fscript>\n<style>\n  html,body{margin:0;height:100%;min-height:100dvh;background:#07071a;overflow:hidden;font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased;}\n  *{box-sizing:border-box;}\n  @keyframes hbWingL{0%,100%{transform:rotate(-18deg) scaleY(1);}50%{transform:rotate(-38deg) scaleY(0.6);}}\n  @keyframes hbWingR{0%,100%{transform:rotate(18deg) scaleY(1);}50%{transform:rotate(38deg) scaleY(0.6);}}\n  [data-wing-l]{animation:hbWingL .18s ease-in-out infinite;transform-origin:20px 18px;}\n  [data-wing-r]{animation:hbWingR .18s ease-in-out infinite;transform-origin:20px 18px;}\n  @keyframes pq-pulse{0%,100%{opacity:.55}50%{opacity:1}}\n  @keyframes pq-floatin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n  @keyframes pq-spin{to{transform:rotate(360deg)}}\n  @keyframes vn-pop{0%{opacity:0;transform:scale(.55) translateY(22px)}62%{opacity:1;transform:scale(1.045) translateY(-3px)}100%{opacity:1;transform:scale(1) translateY(0)}}\n  @keyframes vn-breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.03)}}\n  @keyframes vn-talk{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.28)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}\n  @keyframes vn-caret{0%,100%{opacity:1}50%{opacity:0}}\n  @keyframes vn-listen{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:1}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div ref=\"{{ rootRef }}\" style=\"position:fixed;inset:0;overflow:hidden;background:#07071a;font-family:Georgia,serif;user-select:none;-webkit-user-select:none;\">\n\n  <canvas ref=\"{{ canvasRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;\"><\u002Fcanvas>\n\n  <!-- crosshair -->\n  <div data-cross=\"\" style=\"position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 8px rgba(255,255,255,.6),0 0 0 1px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .5s;\"><\u002Fdiv>\n\n  <!-- HUD top-left -->\n  <div data-hud=\"\" style=\"position:absolute;left:14px;top:14px;z-index:8;opacity:0;transition:opacity .6s;pointer-events:none;\">\n    <div style=\"font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#9896b8;font-family:system-ui,sans-serif;margin-bottom:3px;\">Parque Modulador · IET<\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:8px;\">\n      <span data-score=\"\" style=\"font-size:30px;color:#ede9ff;line-height:1;\">0<\u002Fspan>\n      <span style=\"font-size:13px;color:#6c6a88;font-family:system-ui,sans-serif;\">/ 12 · consciência desperta<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;max-width:min(78vw,420px);\">\n      <div data-raio=\"1\" style=\"display:flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:30px;border:.5px solid rgba(255,140,107,.35);background:rgba(255,140,107,.08);transition:all .4s;\">\n        <span style=\"font-size:13px;\">🌍<\u002Fspan>\n        <span style=\"font-size:11px;color:#cfc9ea;font-family:system-ui,sans-serif;\">Físico<\u002Fspan>\n        <span data-count=\"\" style=\"font-size:10px;color:#ff8c6b;font-family:system-ui,sans-serif;font-weight:600;\">0/3<\u002Fspan>\n      <\u002Fdiv>\n      <div data-raio=\"2\" style=\"display:flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:30px;border:.5px solid rgba(160,143,255,.35);background:rgba(160,143,255,.08);transition:all .4s;\">\n        <span style=\"font-size:13px;\">💧<\u002Fspan>\n        <span style=\"font-size:11px;color:#cfc9ea;font-family:system-ui,sans-serif;\">Personalidade<\u002Fspan>\n        <span data-count=\"\" style=\"font-size:10px;color:#a08fff;font-family:system-ui,sans-serif;font-weight:600;\">0/3<\u002Fspan>\n      <\u002Fdiv>\n      <div data-raio=\"3\" style=\"display:flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:30px;border:.5px solid rgba(232,201,122,.35);background:rgba(232,201,122,.08);transition:all .4s;\">\n        <span style=\"font-size:13px;\">🔥<\u002Fspan>\n        <span style=\"font-size:11px;color:#cfc9ea;font-family:system-ui,sans-serif;\">Alma<\u002Fspan>\n        <span data-count=\"\" style=\"font-size:10px;color:#e8c97a;font-family:system-ui,sans-serif;font-weight:600;\">0/3<\u002Fspan>\n      <\u002Fdiv>\n      <div data-raio=\"4\" style=\"display:flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:30px;border:.5px solid rgba(94,207,176,.35);background:rgba(94,207,176,.08);transition:all .4s;\">\n        <span style=\"font-size:13px;\">⬡<\u002Fspan>\n        <span style=\"font-size:11px;color:#cfc9ea;font-family:system-ui,sans-serif;\">Integração<\u002Fspan>\n        <span data-count=\"\" style=\"font-size:10px;color:#5ecfb0;font-family:system-ui,sans-serif;font-weight:600;\">0/3<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- player de vídeo/áudio dentro do jogo: YouTube/Spotify embutidos —\n       funciona em qualquer janela (o site externo aberto direto era bloqueado) -->\n  <div data-video-modal=\"\" style=\"display:none;position:fixed;inset:0;z-index:80;background:rgba(4,4,14,.88);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px;\">\n    <div style=\"width:min(94vw,720px);background:#0e0e1e;border:.5px solid rgba(160,143,255,.35);border-radius:16px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px;\">\n        <div data-video-titulo=\"\" style=\"flex:1;min-width:0;font-size:13.5px;color:#ede9ff;font-family:system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">Vídeo<\u002Fdiv>\n        <a data-video-abrir=\"\" href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"flex:none;font-size:11.5px;color:#a08fff;font-family:system-ui,sans-serif;text-decoration:none;border:.5px solid rgba(160,143,255,.4);border-radius:20px;padding:6px 12px;\">Abrir no app ↗<\u002Fa>\n        <button data-video-fechar=\"\" type=\"button\" style=\"flex:none;appearance:none;cursor:pointer;width:34px;height:34px;border-radius:50%;border:.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#ede9ff;font-size:15px;-webkit-tap-highlight-color:transparent;\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div data-video-frame=\"\" style=\"border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;\"><\u002Fdiv>\n      <div style=\"font-size:10.5px;color:#6c6a88;font-family:system-ui,sans-serif;margin-top:8px;\">Assista aqui mesmo e depois toque em ✕ para continuar a jornada. ✦<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- didactic card -->\n  <div data-card=\"\" style=\"position:absolute;left:50%;bottom:22px;transform:translate(-50%,150%);width:min(92vw,440px);max-height:78vh;overflow-y:auto;z-index:12;background:rgba(14,14,30,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:.5px solid rgba(255,255,255,.18);border-left:3px solid #a08fff;border-radius:16px;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.55);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .5s;pointer-events:none;\">\n    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:7px;\">\n      <span data-card-icon=\"\" style=\"font-size:16px;\">🌍<\u002Fspan>\n      <span data-card-raio=\"\" style=\"font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#a08fff;font-family:system-ui,sans-serif;flex:1;\">Raio<\u002Fspan>\n      <span data-card-plus=\"\" style=\"font-size:11px;color:#5ecfb0;font-family:system-ui,sans-serif;\">+1 consciência<\u002Fspan>\n    <\u002Fdiv>\n    <div data-card-title=\"\" style=\"font-size:19px;color:#ede9ff;margin-bottom:6px;\">Título<\u002Fdiv>\n    <div data-card-body=\"\" style=\"font-size:14px;line-height:1.7;color:#b8b4d4;font-style:italic;\">Texto.<\u002Fdiv>\n    <div data-card-media-label=\"\" style=\"font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#6c6a88;font-family:system-ui,sans-serif;margin-top:14px;margin-bottom:7px;\">Aprofunde-se<\u002Fdiv>\n    <div data-card-media=\"\" style=\"display:flex;flex-direction:column;gap:7px;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:13px;\">\n      <button data-card-ouvir=\"\" style=\"flex:1;appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:13px;padding:10px 12px;border-radius:30px;border:.5px solid rgba(94,207,176,.5);background:rgba(94,207,176,.12);color:#5ecfb0;-webkit-tap-highlight-color:transparent;\">🔊 Ouvir de novo<\u002Fbutton>\n      <button data-card-fechar=\"\" style=\"appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:13px;padding:10px 18px;border-radius:30px;border:.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#cfc9ea;-webkit-tap-highlight-color:transparent;\">Fechar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- sound toggle -->\n  <button data-sound=\"\" style=\"position:absolute;right:14px;top:14px;z-index:13;appearance:none;cursor:pointer;width:44px;height:44px;border-radius:50%;border:.5px solid rgba(255,255,255,.18);background:rgba(14,14,30,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ede9ff;font-size:18px;opacity:0;transition:opacity .6s;-webkit-tap-highlight-color:transparent;\">🔊<\u002Fbutton>\n\n  <!-- voice controls: volume / pause / replay -->\n  <button data-voice-toggle=\"\" style=\"position:absolute;right:66px;top:66px;z-index:13;appearance:none;cursor:pointer;width:40px;height:40px;border-radius:50%;border:.5px solid rgba(255,255,255,.18);background:rgba(14,14,30,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ede9ff;font-size:15px;opacity:0;transition:opacity .6s;-webkit-tap-highlight-color:transparent;\" title=\"Controles de voz\">🎚️<\u002Fbutton>\n  <div data-voice-panel=\"\" style=\"position:absolute;right:14px;top:112px;z-index:14;display:none;flex-direction:column;gap:8px;width:180px;background:rgba(14,14,30,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:.5px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.5);\">\n    <div style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8f8ab0;font-family:system-ui,sans-serif;\">Voz da narração<\u002Fdiv>\n    <div style=\"display:flex;gap:6px;\">\n      <button data-voice-pause=\"\" style=\"flex:1;appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:12px;padding:8px 6px;border-radius:20px;border:.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#ede9ff;-webkit-tap-highlight-color:transparent;\">⏸ Pausar<\u002Fbutton>\n      <button data-voice-replay=\"\" style=\"flex:1;appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:12px;padding:8px 6px;border-radius:20px;border:.5px solid rgba(94,207,176,.4);background:rgba(94,207,176,.1);color:#5ecfb0;-webkit-tap-highlight-color:transparent;\">🔁 Reouvir<\u002Fbutton>\n    <\u002Fdiv>\n    <input data-voice-volume=\"\" type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"1\" style=\"width:100%;accent-color:#a08fff;\">\n    <button data-voice-mute=\"\" style=\"appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:12px;padding:8px 6px;border-radius:20px;border:.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#ede9ff;-webkit-tap-highlight-color:transparent;\">🔊 Ouvir narração<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- home / voltar ao início (visível andando, para nunca ficar sem saída) -->\n  <button data-home=\"\" style=\"position:absolute;right:66px;top:14px;z-index:13;appearance:none;cursor:pointer;width:44px;height:44px;border-radius:50%;border:.5px solid rgba(255,255,255,.18);background:rgba(14,14,30,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ede9ff;font-size:18px;opacity:0;transition:opacity .6s;-webkit-tap-highlight-color:transparent;\" title=\"Voltar ao início\">🏠<\u002Fbutton>\n\n  <!-- Mestre proximity prompt -->\n  <button data-mestre-prompt=\"\" style=\"position:absolute;left:50%;top:60%;transform:translate(-50%,0);z-index:11;display:none;align-items:center;gap:9px;appearance:none;cursor:pointer;font-family:Georgia,serif;font-size:15px;padding:13px 22px;border-radius:40px;border:.5px solid rgba(160,143,255,.6);background:rgba(160,143,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#ede9ff;box-shadow:0 10px 30px rgba(160,143,255,.32);animation:pq-pulse 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent;\">🌳 Falar com o Mestre<\u002Fbutton>\n\n  <!-- Mestre consciousness flow -->\n  <div data-mestre-flow=\"\" style=\"position:absolute;inset:0;z-index:22;display:none;flex-direction:column;justify-content:flex-end;background:linear-gradient(to bottom,rgba(6,6,16,0) 16%,rgba(6,6,16,.5) 42%,rgba(6,6,16,.94) 70%);\">\n    <!-- top bar -->\n    <div style=\"position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:16px;max-width:600px;margin:0 auto;width:100%;font-family:system-ui,sans-serif;\">\n      <button data-mestre-close=\"\" style=\"appearance:none;cursor:pointer;border:none;background:transparent;color:#9896b8;font-size:20px;font-weight:bold;line-height:1;padding:4px 8px;-webkit-tap-highlight-color:transparent;\">✕<\u002Fbutton>\n      <div style=\"flex:1;height:6px;background:#14142a;border-radius:3px;overflow:hidden;border:.5px solid rgba(160,143,255,.2);\">\n        <div data-mestre-fill=\"\" style=\"height:100%;width:10%;background:#a08fff;border-radius:3px;transition:width .5s,background .6s;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"color:#e8c97a;font-weight:700;font-size:14px;\">💎 <span data-mestre-xp=\"\">100<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <!-- window -->\n    <div data-mestre-window=\"\" style=\"align-self:center;width:100%;max-width:540px;max-height:62vh;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0 14px 18px;background:rgba(14,14,30,.96);border:.5px solid rgba(160,143,255,.3);border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);\">\n\n      <!-- screen: cadastro (anamnese) — fallback para quem entrou andando sem dados -->\n      <div data-mscreen=\"cadastro\" style=\"display:none;\">\n        <div style=\"background:#14142a;border:.5px solid rgba(160,143,255,.28);border-radius:14px;padding:14px 16px;margin-bottom:14px;\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:7px;\">\n            <div style=\"width:30px;height:30px;border-radius:50%;background:rgba(160,143,255,.12);border:1px solid rgba(160,143,255,.28);display:flex;align-items:center;justify-content:center;font-size:14px;\">🌳<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.1em;color:#a08fff;text-transform:uppercase;font-family:system-ui,sans-serif;\">Tati Àguiar · Anamnese<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;font-style:italic;line-height:1.6;color:#cfc9ea;\">Antes de abrir o portal, me conta um pouquinho de você, com carinho. Preciso ao menos da sua data de nascimento. 🤍<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:14px;font-family:system-ui,sans-serif;\">\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9896b8;\">Como posso te chamar?\n            <div style=\"display:flex;gap:6px;\"><input data-cad-nome=\"\" type=\"text\" placeholder=\"Seu nome\" style=\"flex:1;min-width:0;background:#1a1a32;border:.5px solid rgba(255,255,255,.13);border-radius:10px;padding:10px 12px;color:#ede9ff;font-size:15px;outline:none;font-family:Georgia,serif;\"><button data-micfield=\"cad-nome\" data-mictipo=\"texto\" type=\"button\" title=\"Preencher falando\" style=\"appearance:none;cursor:pointer;flex:none;width:42px;border-radius:10px;border:.5px solid rgba(160,143,255,.35);background:#1a1a32;color:#ede9ff;font-size:16px;-webkit-tap-highlight-color:transparent;\">🎙️<\u002Fbutton><\u002Fdiv>\n          <\u002Flabel>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9896b8;\">Nascimento\n              <div style=\"display:flex;gap:6px;\"><input data-cad-data=\"\" type=\"date\" style=\"flex:1;min-width:0;background:#1a1a32;border:.5px solid rgba(255,255,255,.13);border-radius:10px;padding:10px 12px;color:#ede9ff;font-size:14px;outline:none;font-family:Georgia,serif;\"><button data-micfield=\"cad-data\" data-mictipo=\"data\" type=\"button\" title=\"Falar a data\" style=\"appearance:none;cursor:pointer;flex:none;width:42px;border-radius:10px;border:.5px solid rgba(160,143,255,.35);background:#1a1a32;color:#ede9ff;font-size:16px;-webkit-tap-highlight-color:transparent;\">🎙️<\u002Fbutton><\u002Fdiv>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9896b8;\">Hora (se souber)\n              <div style=\"display:flex;gap:6px;\">< ition:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(160,143,255,.45);border:1px solid rgba(255,255,255,.4);box-shadow:0 4px 14px rgba(0,0,0,.4);transform:translate(0,0);\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- bottom hint -->\n  <div data-hint=\"\" style=\"position:absolute;right:16px;bottom:18px;z-index:9;opacity:0;transition:opacity .6s;text-align:right;font-family:system-ui,sans-serif;font-size:11.5px;color:#7d7b9c;line-height:1.7;pointer-events:none;max-width:46vw;\"><\u002Fdiv>\n\n  <!-- win overlay -->\n  <div data-win=\"\" style=\"position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 90% at 50% 30%,rgba(94,207,176,.14),rgba(7,7,26,.86) 60%);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);\">\n    <div style=\"text-align:center;max-width:440px;animation:pq-floatin .8s ease both;\">\n      <div style=\"font-size:46px;margin-bottom:10px;\">⬡<\u002Fdiv>\n      <div style=\"font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#5ecfb0;font-family:system-ui,sans-serif;margin-bottom:8px;\">A Grande Obra · Integração Total<\u002Fdiv>\n      <div style=\"font-size:clamp(26px,7vw,38px);color:#ede9ff;line-height:1.12;margin-bottom:14px;\">Consciência Integrada<\u002Fdiv>\n      <p style=\"font-size:14.5px;line-height:1.8;color:#b8b4d4;font-style:italic;margin:0 0 22px;\">Você percorreu os quatro Raios — corpo, mente, alma e propósito. Saúde é o equilíbrio vivo entre eles, sustentando-se mutuamente. Leve o Parque com você.<\u002Fp>\n      <button data-restart=\"\" style=\"appearance:none;border:none;cursor:pointer;font-family:Georgia,serif;font-size:15px;padding:13px 26px;border-radius:40px;background:#5ecfb0;color:#04231c;\">Caminhar novamente<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- orbit menu (after guided journey) -->\n  <div data-orbit-menu=\"\" style=\"position:absolute;left:50 w.webkitAudioContext;\n      const ac = new AC();\n      this.actx = ac;\n      const master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);\n      this.master = master;\n      // regulação respiratória guiada: substitui o drone ambiente por um\n      // tom único que sobe suave na inspiração e desce na expiração,\n      // ciclo de 10s (5s+5s = 6 respirações/min — frequência de ressonância\n      // usada em biofeedback de VFC). Cada ciclo completo é uma medida real\n      // de regulação/engajamento terapêutico, registrada nos KPIs.\n      // Só a aba líder cria os osciladores e conta os ciclos.\n      this._isAudioLeader = this._acquireAudioLeadership();\n      if (this._isAudioLeader) {\n        const duck = ac.createGain(); duck.gain.value = 1; duck.connect(master);\n        const breath = ac.createGain(); breath.gain.value = 0.0001; breath.connect(duck);\n        const bOsc = ac.createOscillator(); bOsc.type = 'sine'; bOsc.frequency.value = 220;\n        bOsc.connect(breath); bOsc.start();\n        const bLfoFreq = ac.createOscillator(); bLfoFreq.type = 'sine'; bLfoFreq.frequency.value = 1 / 10; // 1 ciclo = 10s\n        const bLfoFreqG = ac.createGain(); bLfoFreqG.gain.value = 10; // ±10Hz de vibrato lento\n        bLfoFreq.connect(bLfoFreqG); bLfoFreqG.connect(bOsc.frequency); bLfoFreq.start();\n        const bLfoGain = ac.createOscillator(); bLfoGain.type = 'sine'; bLfoGain.frequency.value = 1 / 10;\n        const bLfoGainG = ac.createGain(); bLfoGainG.gain.value = 0.05;\n        const bLfoGainOff = ac.createConstantSource(); bLfoGainOff.offset.value = 0.055; bLfoGainOff.start();\n        bLfoGain.connect(bLfoGainG); bLfoGainG.connect(breath.gain); bLfoGainOff.connect(breath.gain); bLfoGain.start();\n        // trilha profunda Solfeggio: pad grave em harmônicos de 528Hz\n        // (66·99·132·198Hz) com filtro passa-baixa e maré de ~26s — música\n        // relaxante contínua que atua como modulador de ansiedade. Passa\n        / lace(/\\b(um|uma|primeiro|dois|duas|três|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove|vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa)\\b/g, (m) => String(PAL[m]));\n    if (tipo === 'hora') {\n      if (/meio[- ]dia/.test(t)) return /e meia/.test(t) ? '12:30' : '12:00';\n      if (/meia[- ]noite/.test(t)) return '00:00';\n      const m = t.match(/(\\d{1,2})\\s*(?::|h\\b|hora|horas)?\\s*(?:e\\s*)?(\\d{1,2}|meia)?/);\n      if (!m) return '';\n      let h = parseInt(m[1], 10);\n      const min = m[2] === 'meia' ? 30 : (m[2] ? parseInt(m[2], 10) : 0);\n      if (isNaN(h) || h > 23 || isNaN(min) || min > 59) return '';\n      if (/(da tarde|da noite)/.test(t) && h < 12) h += 12;\n      if (/da manhã/.test(t) && h === 12) h = 0;\n      return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');\n    }\n    if (tipo === 'data') {\n      const MES = { janeiro: 1, fevereiro: 2, 'março': 3, marco: 3, abril: 4, maio: 5, junho: 6, julho: 7, agosto: 8, setembro: 9, outubro: 10, novembro: 11, dezembro: 12 };\n      t = t.replace(/\\b(janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\\b/g, (m) => String(MES[m]));\n      t = t.replace(/mil novecentos e (\\d{1,2})/g, (m, n) => String(1900 + parseInt(n, 10)))\n        .replace(/dois mil e (\\d{1,2})/g, (m, n) => String(2000 + parseInt(n, 10)))\n        .replace(/\\bdois mil\\b/g, '2000')\n        .replace(/\\b2 mil e (\\d{1,2})\\b/g, (m, n) => String(2000 + parseInt(n, 10)))\n        .replace(/\\b2 mil\\b/g, '2000')\n        .replace(/\\b(19\\d\\d|20\\d\\d)\\s+e\\s+(\\d)\\b/g, (m, y, u) => String(parseInt(y, 10) + parseInt(u, 10)));\n      const nums = (t.match(/\\d+/g) || []).map(Number);\n      if (nums.length < 2) return '';\n      const d = nums[0], mo = nums[1];\n      let y = nums[2];\n      if (y === undefined) y = new Date().getFullYear();\n      if (y < 100) y += (y > (new Dat o é leveza: água, respiração e ritmo limpando o que pesa.', emocional: 'Nas emoções, o Branco purifica: memórias antigas se lavam e dão lugar à paz do presente.', mental: 'Na mente, o Branco é clareza: pensamentos simples, ordenados, sem ruído.', personalidade: 'Na personalidade, o Branco é harmonia criativa: transformar conflito em arte e beleza.' },\n      verde: { v: 'Cura e Verdade', fisico: 'No corpo físico, a Cura do Verde é regeneração: confiar na inteligência do corpo que se refaz a cada dia.', emocional: 'Nas emoções, o Verde é verdade sentida: nomear o que se sente já é metade da cura.', mental: 'Na mente, o Verde é precisão: pensar com honestidade, investigar com curiosidade e soltar o que não é verdadeiro.', personalidade: 'Na personalidade, o Verde é integridade: viver alinhado à própria verdade, curando também quem está perto.' },\n      rubi: { v: 'Paz e Devoção', fisico: 'No corpo físico, a Paz do Rubi é serviço: mãos que cuidam, gestos concretos de dedicação ao que importa.', emocional: 'Nas emoções, o Rubi é devoção serena: amar o que se faz e encontrar tranquilidade no entregar-se.', mental: 'Na mente, o Rubi é propósito: pensamentos a serviço de algo maior que acalma a ansiedade.', personalidade: 'Na personalidade, o Rubi é paz que contagia: presença mansa que serve e pacifica os ambientes.' },\n      violeta: { v: 'Transmutação e Misericórdia', fisico: 'No corpo físico, o Violeta transmuta: cansaço vira energia renovada quando há perdão e soltura.', emocional: 'Nas emoções, o Violeta é misericórdia: perdoar a si e aos outros liberta o coração do peso antigo.', mental: 'Na mente, o Violeta é alquimia: crenças rígidas se dissolvem e abrem espaço para o novo.', personalidade: 'Na personalidade, o Violeta é liberdade: reinventar-se sem culpa, honrando cada versão de si.' }\n    };\n    return V[key] || V.azul;\n  }\n\n  nivelFeitos(key) { return (this.progRaios && this.progRaios[key]) || 0; }\n\n  // primeiro Raio ainda não completado nos 4 níveis (ordem Azul→Violeta)\n  raioAtual() {\n    for (const k of this.RAIO_ORDEM) if (this.nivelFeitos(k) < 4) return k;\n    return null;\n  }\n\n  jornadaCompleta() { return this.RAIO_ORDEM.every((k) => this.nivelFeitos(k) >= 4); }\n\n  // Jornada guiada: até completar os 28 níveis só o Raio da vez aparece;\n  // depois disso a escolha é livre entre os 7.\n  atualizarModoJornada() {\n    const root = this.rootRef.current; if (!root) return;\n    const livre = this.jornadaCompleta();\n    const atual = this.raioAtual();\n    root.querySelectorAll('[data-master]').forEach((m) => {\n      const k = m.getAttribute('data-master');\n      m.style.display = (livre || k === atual) ? 'flex' : 'none';\n    });\n    const t = root.querySelector('[data-escolha-titulo]');\n    if (t) t.textContent = livre ? 'Escolha o Raio · Mestre em forma andrógina integrada' : 'Sua Jornada · Raio da vez';\n    const s = root.querySelector('[data-escolha-sub]');\n    if (s) s.textContent = livre\n      ? 'Você completou a jornada dos 7 Raios — agora o Parque é todo seu: escolha livremente o Raio que quiser revisitar. ✨'\n      : 'A jornada segue a ordem dos Raios, do Azul ao Violeta, vivendo os 4 níveis de cada um. Só depois de completar todo o caminho você escolhe livremente.';\n  }\n\n  raioLiberado(key) {\n    const i = this.RAIO_ORDEM.indexOf(key);\n    if (i <= 0) return true;\n    return this.nivelFeitos(this.RAIO_ORDEM[i - 1]) >= 4;\n  }\n\n  salvarProg() { try { localStorage.setItem('iet_prog_raios', JSON.stringify(this.progRaios)); } catch (e) {} }\n\n  aplicarTravas() {\n    const root = this.rootRef.current; if (!root) return;\n    root.querySelectorAll('[data-master]').forEach((m) => {\n      const key = m.getAttribute('data-master');\n      const aberto = this.raioLiberado(key);\n      m.style.opacity = aberto ? '1' : '0.42';\n      m.style.filter = aberto ? 'none' : 'grayscale(0.7)';\n      let tag = m.querySelector('[data-trava-tag]');\n      if (!tag) {\n        tag = document.createElement('div');\n        tag.setAttribute('data-trava-tag', '');\n        tag.style.cssText = 'flex:none;font-size:13px;font-family:system-ui,sans-serif;';\n        m.appendChild(tag);\n      }\n      const feitos = this.nivelFeitos(key);\n      tag.textContent = !aberto ? '🔒' : (feitos >= 4 ? '✨' : (feitos > 0 ? feitos + '/4' : ''));\n    });\n  }\n\n  renderNiveis() {\n    const root = this.rootRef.current; if (!root) return;\n    const enc = root.querySelector('[data-encruzilhada]'); if (enc) enc.style.display = 'none';\n    const box = root.querySelector('[data-niveis-box]');\n    const lista = root.querySelector('[data-niveis-lista]');\n    const tit = root.querySelector('[data-niveis-titulo]');\n    if (!box || !lista) return;\n    const key = this.mestreKey, cor = this.mestreCor || '#a08fff';\n    const feitos = this.nivelFeitos(key);\n    box.style.display = 'block'; box.style.borderColor = cor + '4d';\n    if (tit) { tit.textContent = 'Os 4 Níveis do ' + this.mestreRaio + ' · ' + this.VIRTUDE_NIVEL(key).v; tit.style.color = cor; }\n    lista.innerHTML = '';\n    this.NIVEIS_DEF().forEach((nv, i) => {\n      const feito = i < feitos, atual = i === feitos;\n      const row = document.createElement('button');\n      row.type = 'button';\n      row.style.cssText = 'appearance:none;text-align:left;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;font-family:Georgia,serif;cursor:' + (atual ? 'pointer' : 'default') + ';border:.5px solid ' + (feito ? cor + '66' : 'rgba(255,255,255,.12)') + ';background:' + (feito ? cor + '1a' : (atual ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.15)')) + ';opacity:' + (feito || atual ? '1' : '.45') + ';';\n      row.innerHTML = '<span style=\"font-size:15px;flex:none;\">' + (feito ? '✅' : (atual ? nv.icone : '🔒')) + '<\u002Fspan><span style=\"flex:1;font-size:12.5px;color:#ede9ff;\">' + nv.nome + (atual ? ' <em style=\"color:' + cor + ';font-size:11px;\">— toque para jogar este nível<\u002Fem>' : '') + '<\u002Fspan>';\n      if (atual) row.addEventListener('click', () => this.jogarNivel(key, nv, i));\n      lista.appendChild(row);\n    });\n    this.aplicarTravas();\n  }\n\n  // ───────── Encruzilhada: a Dor arquetípica de cada Raio e as duas trilhas —\n  // Desejo (impulso reativo do ego) vs. Vontade (força motriz da alma).\n  // Escolher a virtude cura a dor naquele nível; escolher a sombra recebe\n  // ensino gentil (orgulho interno vs. externo etc.) e tenta de novo. ─────────\n  DOR_RAIO(key) {\n    const D = {\n      azul: { dor: 'o Medo que paralisa', sombra: 'Endurecer e controlar tudo e todos, para nunca mais se sentir vulnerável.', virtude: 'Firmar a Vontade: dizer sim e não com amor, protegendo sem aprisionar.', ensino: 'Percebe, meu bem: isso é o Desejo do ego — controle imediato que gera ansiedade. A Vontade é diferente: ela protege sem endurecer. O Orgulho, quando mantido internamente, é autoproteção e preservação do seu valor; projetado para fora vira arrogância — opera no lugar errado. Escolhe de novo, com calma.' },\n      dourado: { dor: 'a Confusão mental e o excesso', sombra: 'Consumir mais e mais informação e telas, buscando alguma resposta lá fora.', virtude: 'Aquietar e discernir: a Sabedoria escuta antes de acumular, e ilumina o que já se sabe.', ensino: 'Esse é o Desejo pedindo estímulo imediato — e a mente só fica mais cheia. A Vontade escolhe a pausa: sabedoria não é acumular, é iluminar. Tenta outra vez.' },\n      rosa: { dor: 'a Ferida do abandono', sombra: 'Agarrar-se ao outro e agradar sempre, com medo de ficar só.', virtude: 'Amar a si primeiro: o Amor incondicional acolhe a própria falta antes de pedir ao outro.', ensino: 'O apego é o Desejo tentando tapar a falta por fora — e a ansiedade cresce. A Vontade ama de dentro pra fora: quem se acolhe, vincula sem prender. Escolhe de novo, coração.' },\n      branco: { dor: 'o Peso das memórias antigas', sombra: 'Esconder e anestesiar o que dói, fingindo que nada aconteceu.', virtude: 'Deixar a água lavar: a Pureza olha a memória com honestidade e a devolve leve.', ensino: 'Anestesiar é alívio imediato do Desejo — mas o peso volta. A Vontade purifica: olhar com verdade já é começar a limpar. Vem, tenta de novo.' },\n      verde: { dor: 'a Mentira que adoece', sombra: 'Maquiar a própria verdade para caber na expectativa dos outros.', virtude: 'Nomear com honestidade: a Cura começa quando a Verdade é dita, primeiro para si.', ensino: 'Caber na expectativa alheia é Desejo de aprovação — e o corpo sente. A Vontade cura pela verdade: nomear o que se sente já é metade da cura. Escolhe outra vez.' },\n      rubi: { dor: 'o Cuidar invisível que exaure', sombra: 'Servir sem parar esperando reconhecimento, e ressentir quando não vem.', virtude: 'Servir em Paz: a Devoção se entrega por amor ao que faz, não pela plateia.', ensino: 'Servir esperando aplauso é o Desejo disfarçado de bondade — e vira ressentimento. A Vontade serve em paz, devota ao que importa. Tenta de novo, com man-sidão.' },\n      violeta: { dor: 'o Cansaço que aprisiona (burnout)', sombra: 'Insistir no mesmo ritmo e carregar a culpa antiga, sem se perdoar.', virtude: 'Transmutar com Misericórdia: perdoar-se, soltar o peso e deixar o novo nascer.', ensino: 'Insistir sem perdão é o ego repetindo o circuito antigo. A Vontade transmuta: misericórdia consigo liberta o coração. Escolhe de novo, na calma.' }\n    };\n    return D[key] || D.azul;\n  }\n\n  darPontos(n, motivo) {\n    this.pontos += n;\n    try { localStorage.setItem('iet_pontos', String(this.pontos)); } catch (e) {}\n    this.logKpi('pontos', { ganho: n, total: this.pontos, motivo: motivo || '' });\n    this.renderCaminho();\n  }\n\n  renderCaminho() {\n    const root = this.rootRef.current; if (!root) return;\n    const pts = root.querySelector('[data-caminho-pontos]');\n    const barra = root.querySelector('[data-caminho-barra]');\n    const leg = root.querySelector('[data-caminho-legenda]');\n    if (!pts) return;\n    const feitos = this.RAIO_ORDEM.reduce((s, k) => s + this.nivelFeitos(k), 0);\n    pts.textContent = this.pontos + ' pts · ' + feitos + '/28 níveis';\n    if (barra) barra.style.width = Math.min(100, Math.round(feitos / 28 * 100)) + '%';\n    if (leg) leg.textContent = feitos >= 28 ? 'Jornada completa — o Parque inteiro está aberto para revisitar. ✨' : 'Cada nível vivido pela virtude ilumina um trecho do caminho.';\n  }\n\n  jogarNivel(key, nv, i) {\n    // encruzilhada do circuito de resposta: apresenta a Dor e as duas trilhas.\n    const root = this.rootRef.current; if (!root) return;\n    const enc = root.querySelector('[data-encruzilhada]');\n    const dorEl = root.querySelector('[data-enc-dor]');\n    const ops = root.querySelector('[data-enc-opcoes]');\n    if (!enc || !dorEl || !ops) return;\n    const D = this.DOR_RAIO(key), cor = this.mestreCor || '#a08fff';\n    enc.style.display = 'block';\n    const intro = 'No nível ' + nv.nome.split(' · ')[0] + ', ' + D.dor + ' pede passagem. Sente aí dentro: qual trilha você escolhe?';\n    dorEl.textContent = '🌗 ' + intro;\n    // áudio onipresente: fala a pergunta E as duas opções de resposta (abaixo)\n    this._encInicio = Date.now(); this._encErros = 0;\n    const opcoes = [\n      { t: D.sombra, ok: false },\n      { t: D.virtude, ok: true }\n    ];\n    if (Math.random() < 0.5) opcoes.reverse();\n    this.falarVN(intro + ' Lembra: o Desejo é impulso imediato do ego; a Vontade é a força mansa da alma. Primeira trilha: ' + opcoes[0].t + ' Segunda trilha: ' + opcoes[1].t, { quem: 'mestre' });\n    ops.innerHTML = '';\n    opcoes.forEach((op) => {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.style.cssText = 'appearance:none;text-align:left;cursor:pointer;font-family:Georgia,serif;font-size:12.5px;line-height:1.55;color:#ede9ff;padding:10px 12px;border-radius:11px;border:.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);-webkit-tap-highlight-color:transparent;';\n      b.textContent = op.t;\n      b.addEventListener('click', () => {\n        // KPI clínico: latência cognitiva (tempo de análise antes da resposta)\n        const latencia = Date.now() - (this._encInicio || Date.now());\n        if (op.ok) {\n          this.logKpi('encruzilhada_virtude', { raio: key, nivel: nv.id, latencia_ms: latencia, tentativas_sombra: this._encErros, periodo: this.classificarPeriodo(latencia, this._encErros) });\n          enc.style.display = 'none';\n          this.concluirNivel(key, nv, i);\n        } else {\n          b.style.opacity = '.4'; b.style.cursor = 'default';\n          this._encErros = (this._encErros || 0) + 1;\n          this.logKpi('encruzilhada_sombra', { raio: key, nivel: nv.id, latencia_ms: latencia, tentativas: this._encErros, periodo: this.classificarPeriodo(latencia, this._encErros) });\n          // na repetição do loop reativo, o Mestre ilumina o mecanismo de\n          // autoagressão (analogia com as defesas do corpo)\n          const falaAuto = 'Assim como as defesas do seu próprio corpo às vezes atacam suas células saudáveis ao tentar combater um perigo, a sua mente cria armaduras — como o orgulho, o medo ou a inveja — que fingem te proteger, mas acabam atacando você por dentro. Onde você está se atacando para tentar se defender? Escolhe de novo, com carinho.';\n          this.falarVN(this._encErros >= 2 ? falaAuto : D.ensino, { quem: 'mestre' });\n        }\n      });\n      ops.appendChild(b);\n    });\n  }\n\n  // Linha do tempo patológica aplicada à telemetria: classifica o momento do\n  // circuito de resposta — incubação (roda o padrão sem sinais), prodrômico\n  // (sinais sutis: resposta impulsiva rápida), estado (loop reativo repetido),\n  // evolução-cura (escolha da virtude com presença).\n  classificarPeriodo(latenciaMs, erros) {\n    if (erros >= 2) return 'estado';\n    if (erros === 1) return 'prodromico';\n    if (latenciaMs < 2500) return 'prodromico-impulsivo';\n    return 'evolucao-cura';\n  }\n\n  concluirNivel(key, nv, i) {\n    const txt = this.VIRTUDE_NIVEL(key)[nv.id];\n    this.progRaios[key] = i + 1;\n    this.salvarProg();\n    this.logKpi('nivel_concluido', { raio: key, nivel: nv.id, ordem: i + 1 });\n    const fim = (i + 1) >= 4;\n    let fala = 'Você escolheu a trilha da virtude — mais sete passos de luz no seu caminho. ' + txt;\n    if (fim) {\n      const prox = this.RAIO_ORDEM[this.RAIO_ORDEM.indexOf(key) + 1];\n      fala += prox ? ' Você completou os quatro níveis deste Raio — que benção! O Raio ' + prox.charAt(0).toUpperCase() + prox.slice(1) + ' acabou de se abrir pra você. 🤍' : ' Você percorreu todos os Raios — agora o Parque inteiro é seu, com escolha livre. 🤍';\n    }\n    this.darPontos(7, 'nível vivido pela virtude — ' + key + '/' + nv.id);\n    // vítória final: todos os 7 Raios nos 4 níveis — feedback sonoro e visual\n    const totalFeitos = this.RAIO_ORDEM.reduce((s, k) => s + this.nivelFeitos(k), 0);\n    if (totalFeitos >= 28) { this.tocarVitoria(); fala += ' Sinta essa expansão: o circuito de resposta agora é seu. ✨'; }\n    this.falarVN(fala, { quem: 'mestre' });\n    if (fim) {\n      // avança sozinho para o próximo Raio da ordem (sem tela de escolha)\n      this.aplicarTravas();\n      this.atualizarModoJornada();\n      const root = this.rootRef.current;\n      const prox = this.raioAtual();\n      if (root && prox && !this.jornadaCompleta()) {\n        const el = root.querySelector('[data-master=\"' + prox + '\"]');\n        if (el) this.selectMaster(el, { silent: true });\n      }\n    }\n    this.renderNiveis();\n  }\n\n  // arpejo ascendente de vitória (264→330→396→528→792Hz) + brilho na barra\n  tocarVitoria() {\n    try {\n      const ac = this.actx; if (!ac) return;\n      [264, 330, 396, 528, 792].forEach((f, i) => {\n        const t = ac.currentTime + i * 0.22;\n        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;\n        const g = ac.createGain();\n        g.gain.setValueAtTime(0, t);\n        g.gain.linearRampToValueAtTime(0.12, t + 0.06);\n        g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);\n        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 2.3);\n      });\n    } catch (e) {}\n    const root = this.rootRef.current;\n    const barra = root && root.querySelector('[data-caminho-barra]');\n    if (barra) { barra.style.boxShadow = '0 0 18px 4px rgba(232,201,122,.8)'; setTimeout(() => { barra.style.boxShadow = ''; }, 4000); }\n    this.logKpi('jornada_completa', { pontos: this.pontos });\n  }\n\n  hideIntro() {\n    this.stopSpeak();\n    const root = this.rootRef.current; if (!root) return;\n    const intro = root.querySelector('[data-intro]'); if (intro) intro.style.display = 'none';\n  }\n\n  startGuided() {\n    this.hideIntro();\n    this.initAudio();\n    this.openMestre();\n  }\n\n  startWalk() {\n    this.hideIntro();\n    this.hideOrbitMenu();\n    this.beginPlay();\n  }\n\n  // ───────── Trilho Guiado: o beija-flor voa sozinho pela trilha de luz\n  // até o ponto do campo atual; ao estacionar, zoom suave → interface 2D.\n  // O jogador não navega — o sistema assume 100% da condução. ─────────\n  autoVoo(dt) {\n    const dx = -this.player.x, dz = -this.player.z;\n    const dist = Math.hypot(dx, dz);\n    if (dist < 7.6) {\n      if (!this._autoChegou) {\n        this._autoChegou = true; this._autoTrilho = false;\n        setTimeout(() => { if (this.mode === 'play') this.openMestre(); }, 750);\n      }\n      return;\n    }\n    const nx = dx / dist, nz = dz / dist;\n    const sp = Math.min(4.6, 1.4 + dist * 0.22);\n    this.player.x += nx * sp * dt;\n    this.player.z += nz * sp * dt;\n    // orienta suavemente o olhar na direção do voo\n    const alvo = Math.atan2(-nx, -nz);\n    let d = alvo - this.yaw;\n    while (d > Math.PI) d -= Math.PI * 2;\n    while (d < -Math.PI) d += Math.PI * 2;\n    this.yaw += d * Math.min(1, 2.6 * dt);\n    this._firstMoveDone = true;\n  }\n\n  startOrbit() {\n    const root = this.rootRef.current; if (!root) return;\n    this.mode = 'orbit';\n    this._orbitT = this.clock ? this.clock.elapsedTime : 0;\n    ['[data-hud]', '[data-cross]', '[data-hint]', '[data-joy]', '[data-arrow]', '[data-mestre-prompt]'].forEach((s) => { const el = root.querySelector(s); if (el) { el.style.opacity = '0'; el.style.display = 'none'; } });\n    const sound = root.querySelector('[data-sound]'); if (sound) sound.style.opacity = '1';\n    const vt1 = root.querySelector('[data-voice-toggle]'); if (vt1) vt1.style.opacity = '1';\n    const home = root.querySelector('[data-home]'); if (home) home.style.opacity = '1';\n    const menu = root.querySelector('[data-orbit-menu]'); if (menu) menu.style.display = 'flex';\n  }\n\n  // Sempre dá pra voltar ao início — sem isso, andar pelo parque virava\n  // um beco sem saída (sem menu, sem \"voltar\").\n  voltarAoInicio() {\n    this.stopSpeak();\n    this.hideVN();\n    const root = this.rootRef.current; if (!root) return;\n    this.mode = 'intro';\n    ['[data-hud]', '[data-cross]', '[data-hint]', '[data-joy]', '[data-home]', '[data-sound]', '[data-voice-toggle]'].forEach((s) => {\n      const el = root.querySelector(s); if (el) el.style.opacity = '0';\n    });\n    const vpanel = root.querySelector('[data-voice-panel]'); if (vpanel) vpanel.style.display = 'none';\n    const arrow = root.querySelector('[data-arrow]'); if (arrow) arrow.style.display = 'none';\n    const prompt = root.querySelector('[data-mestre-prompt]'); if (prompt) prompt.style.display = 'none';\n    this.hideOrbitMenu();\n    const mf = root.querySelector('[data-mestre-flow]'); if (mf) mf.style.display = 'none';\n    const intro = root.querySelector('[data-intro]'); if (intro) intro.style.display = 'flex';\n    this.introStep(this.mapaReal ? 'guia' : 'title');\n  }\n\n  hideOrbitMenu() {\n    const root = this.rootRef.current; if (!root) return;\n    const menu = root.querySelector('[data-orbit-menu]'); if (menu) menu.style.display = 'none';\n  }\n\n  openMestre() {\n    if (this.mode === 'mestre') return;\n    const THREE = window.THREE;\n    this._mestreReturn = (this.mode === 'play') ? 'play' : 'orbit';\n    this.mode = 'mestre';\n    this.vnFade(); // transição suave 3D → tela 2D de diálogo\n    this.estagio = 'formal'; this.escolhaSinal = ''; this.mestreDone = false;\n    this._mestreCam = { pos: new THREE.Vector3(0, 3.6, 8.8), look: new THREE.Vector3(0, 1.5, 0) };\n    const root = this.rootRef.current;\n    this.initAudio();\n    root.querySelector('[data-mestre-flow]').style.display = 'flex';\n    ['[data-hud]', '[data-cross]', '[data-hint]', '[data-joy]', '[data-arrow]'].forEach((s) => { const el = root.querySelector(s); if (el) el.style.opacity = el.hasAttribute('data-arrow') ? '' : '0'; });\n    const arrow = root.querySelector('[data-arrow]'); if (arrow) arrow.style.display = 'none';\n    const sound = root.querySelector('[data-sound]'); if (sound) sound.style.opacity = '1';\n    const vt2 = root.querySelector('[data-voice-toggle]'); if (vt2) vt2.style.opacity = '1';\n    const pr = root.querySelector('[data-mestre-prompt]'); if (pr) pr.style.display = 'none';\n    const fx = root.querySelector('[data-mestre-faixa]'); if (fx) fx.value = 'formal';\n    this.estagio = 'formal';\n    this.setCoreColor(0x7b6de0, 1); this.monad.scale.set(1, 1, 1);\n    this.setMProgress(10, '100');\n    if (this.mapaReal && this.mestreKey) {\n      // já veio da tela 3 com mapa + Mestre escolhidos: vai direto à leitura real.\n      this.mostrarDiagnosticoReal(root);\n    } else if (this.mapaReal) {\n      // tem mapa mas nenhum Mestre escolhido ainda (ex.: veio andando e falou com o Mestre) — sugere um e segue.\n      const key = this.raioIdParaMasterKey(this.leituraReal.raioId);\n      const el = key && root.querySelector('[data-master=\"' + key + '\"]');\n      if (el) this.selectMaster(el, { silent: true });\n      this.mostrarDiagnosticoReal(root);\n    } else {\n      // sem dados na memória da sessão — tenta restaurar de jogada a

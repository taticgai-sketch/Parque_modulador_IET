  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e:10px;letter-spacing:.18em;text-transform:uppercase;color:#a08fff;font-family:system-ui,sans-serif;flex:1;\">Raio<\u002Fspan>\n      <span data-card-plus=\"\" style=\"font-size:11px;color:#5ecfb0;font-family:system-ui,sans-serif;\">+1 consciência<\u002Fspan>\n    <\u002Fdiv>\n    <div data-card-title=\"\" style=\"font-size:19px;color:#ede9ff;margin-bottom:6px;\">Título<\u002Fdiv>\n    <div data-card-body=\"\" style=\"font-size:14px;line-height:1.7;color:#b8b4d4;font-style:italic;\">Texto.<\u002Fdiv>\n    <div data-card-media-label=\"\" style=\"font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#6c6a88;font-family:system-ui,sans-serif;margin-top:14px;margin-bottom:7px;\">Aprofunde-se<\u002Fdiv>\n    <div data-card-media=\"\" style=\"display:flex;flex-direction:column;gap:7px;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:13px;\">\n      <button data-card-ouvir=\"\" style=\"flex:1;appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:13px;padding:10px 12px;border-radius:30px;border:.5px solid rgba(94,207,176,.5);background:rgba(94,207,176,.12);color:#5ecfb0;-webkit-tap-highlight-color:transparent;\">🔊 Ouvir de novo<\u002Fbutton>\n      <button data-card-fechar=\"\" style=\"appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:13px;padding:10px 18px;border-radius:30px;border:.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#cfc9ea;-webkit-tap-highlight-color:transparent;\">Fechar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- sound toggle -->\n  <button data-sound=\"\" style=\"position:absolute;right:14px;top:14px;z-index:13;appearance:none;cursor:pointer;width:44px;height:44px;border-radius:50%;border:.5px solid rgba(255,255,255,.18);background:rgba(14,14,30,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ede9ff;font-size:18px;opacity:0;transition:opacity .6s;-webkit-tap-highlight-color:transparent;\">🔊<\u002Fbutton>\n\n  <!-- voice controls: volume / pause / replay -->\n  <button data-voice-toggle=\"\" style=\"position:absolute;right:66px;top:66px;z-index:13;appearance:none;cursor:pointer;width:40px;height:40px;border-radius:50%;border:.5px solid rgba(255,255,255,.18);background:rgba(14,14,30,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ede9ff;font-size:15px;opacity:0;transition:opacity .6s;-webkit-tap-highlight-color:transparent;\" title=\"Controles de voz\">🎚️<\u002Fbutton>\n  <div data-voice-panel=\"\" style=\"position:absolute;right:14px;top:112px;z-index:14;display:none;flex-direction:column;gap:8px;width:180px;background:rgba(14,14,30,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:.5px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.5);\">\n    <div style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8f8ab0;font-family:system-ui,sans-serif;\">Voz da narração<\u002Fdiv>\n    <div style=\"display:flex;gap:6px;\">\n      <button data-voice-pause=\"\" style=\"flex:1;appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:12px;padding:8px 6px;border-radius:20px;border:.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#ede9ff;-webkit-tap-highlight-color:transparent;\">⏸ Pausar<\u002Fbutton>\n      <button data-voice-replay=\"\" style=\"flex:1;appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:12px;padding:8px 6px;border-radius:20px;border:.5px solid rgba(94,207,176,.4);background:rgba(94,207,176,.1);color:#5ecfb0;-webkit-tap-highlight-color:transparent;\">🔁 Reouvir<\u002Fbutton>\n    <\u002Fdiv>\n    <input data-voice-volume=\"\" type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"1\" style=\"width:100%;accent-color:#a08fff;\">\n    <button data-voice-mute=\"\" style=\"appearance:none;cursor:pointer;font-family:system-ui,sans-serif;font-size:12px;padding:8px 6px;border-radius:20px;border:.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#ede9ff;-webkit-tap-highlight-color:transparent;\">🔊 Ouvir narração<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- home / voltar ao início (visível andando, para nunca ficar sem saída) -->\n  <button data-home=\"\" style=\"position:absolute;right:66px;top:14px;z-index:13;appearance:none;cursor:pointer;width:44px;height:44px;border-radius:50%;border:.5px solid rgba(255,255,255,.18);background:rgba(14,14,30,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ede9ff;font-size:18px;opacity:0;transition:opacity .6s;-webkit-tap-highlight-color:transparent;\" title=\"Voltar ao início\">🏠<\u002Fbutton>\n\n  <!-- Mestre proximity prompt -->\n  <button data-mestre-prompt=\"\" style=\"position:absolute;left:50%;top:60%;transform:translate(-50%,0);z-index:11;display:none;align-items:center;gap:9px;appearance:none;cursor:pointer;font-family:Georgia,serif;font-size:15px;padding:13px 22px;border-radius:40px;border:.5px solid rgba(160,143,255,.6);background:rgba(160,143,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#ede9ff;box-shadow:0 10px 30px rgba(160,143,255,.32);animation:pq-pulse 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent;\">🌳 Falar com o Mestre<\u002Fbutton>\n\n  <!-- Mestre consciousness flow -->\n  <div data-mestre-flow=\"\" style=\"position:absolute;inset:0;z-index:22;display:none;flex-direction:column;justify-content:flex-end;background:linear-gradient(to bottom,rgba(6,6,16,0) 16%,rgba(6,6,16,.5) 42%,rgba(6,6,16,.94) 70%);\">\n    <!-- top bar -->\n    <div style=\"position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:16px;max-width:600px;margin:0 auto;width:100%;font-family:system-ui,sans-serif;\">\n      <button data-mestre-close=\"\" style=\"appearance:none;cursor:pointer;border:none;background:transparent;color:#9896b8;font-size:20px;font-weight:bold;line-height:1;padding:4px 8px;-webkit-tap-highlight-color:transparent;\">✕<\u002Fbutton>\n      <div style=\"flex:1;height:6px;background:#14142a;border-radius:3px;overflow:hidden;border:.5px solid rgba(160,143,255,.2);\">\n        <div data-mestre-fill=\"\" style=\"height:100%;width:10%;background:#a08fff;border-radius:3px;transition:width .5s,background .6s;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"color:#e8c97a;font-weight:700;font-size:14px;\">💎 <span data-mestre-xp=\"\">100<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <!-- window -->\n    <div data-mestre-window=\"\" style=\"align-self:center;width:100%;max-width:540px;max-height:62vh;overflow-y:auto;margin:0 14px 18px;background:rgba(14,14,30,.96);border:.5px solid rgba(160,143,255,.3);border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);\">\n\n      <!-- screen: cadastro (anamnese) — fallback para quem entrou andando sem dados -->\n      <div data-mscreen=\"cadastro\" style=\"display:none;\">\n        <div style=\"background:#14142a;border:.5px solid rgba(160,143,255,.28);border-radius:14px;padding:14px 16px;margin-bottom:14px;\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:7px;\">\n            <div style=\"width:30px;height:30px;border-radius:50%;background:rgba(160,143,255,.12);border:1px solid rgba(160,143,255,.28);display:flex;align-items:center;justify-content:center;font-size:14px;\">🌳<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.1em;color:#a08fff;text-transform:uppercase;font-family:system-ui,sans-serif;\">Tati Àguiar · Anamnese<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;font-style:italic;line-height:1.6;color:#cfc9ea;\">Antes de abrir o portal, me conta um pouquinho de você, com carinho. Preciso ao menos da sua data de nascimento. 🤍<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:14px;font-family:system-ui,sans-serif;\">\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9896b8;\">Como posso te chamar?\n            <div style=\"display:flex;gap:6px;\"><input data-cad-nome=\"\" type=\"text\" placeholder=\"Seu nome\" style=\"flex:1;min-width:0;background:#1a1a32;border:.5px solid rgba(255,255,255,.13);border-radius:10px;padding:10px 12px;color:#ede9ff;font-size:15px;outline:none;font-family:Georgia,serif;\"><button data-micfield=\"cad-nome\" data-mictipo=\"texto\" type=\"button\" title=\"Preencher falando\" style=\"appearance:none;cursor:pointer;flex:none;width:42px;border-radius:10px;border:.5px solid rgba(160,143,255,.35);background:#1a1a32;color:#ede9ff;font-size:16px;-webkit-tap-highlight-color:transparent;\">🎙️<\u002Fbutton><\u002Fdiv>\n          <\u002Flabel>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9896b8;\">Nascimento\n              <div style=\"display:flex;gap:6px;\"><input data-cad-data=\"\" type=\"date\" style=\"flex:1;min-width:0;background:#1a1a32;border:.5px solid rgba(255,255,255,.13);border-radius:10px;padding:10px 12px;color:#ede9ff;font-size:14px;outline:none;font-family:Georgia,serif;\"><button data-micfield=\"cad-data\" data-mictipo=\"data\" type=\"button\" title=\"Falar a data\" style=\"appearance:none;cursor:pointer;flex:none;width:42px;border-radius:10px;border:.5px solid rgba(160,143,255,.35);background:#1a1a32;color:#ede9ff;font-size:16px;-webkit-tap-highlight-color:transparent;\">🎙️<\u002Fbutton><\u002Fdiv>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9896b8;\">Hora (se souber)\n              <div style=\"display:flex;gap:6px;\"><input data-cad-hora=\"\" type=\"time\" style=\"flex:1;min-wi is._recCampo = null; reset(); resetPh(); }\n  }\n\n  // converte fala pt-BR em valor de campo; devolve '' se não entender.\n  falaParaCampo(txt, tipo) {\n    let t = (txt || '').trim().toLowerCase();\n    if (!t) return '';\n    if (tipo === 'texto') {\n      const limpo = (txt || '').trim().replace(/[.!?,;]+$/, '');\n      return limpo.replace(/(^|\\s)(\\S)/g, (m, sp, ch) => sp + ch.toUpperCase());\n    }\n    // números por extenso mais comuns (o reconhecedor costuma devolver dígitos,\n    // mas cobrimos os casos falados)\n    const PAL = { 'um': 1, 'uma': 1, 'primeiro': 1, 'dois': 2, 'duas': 2, 'três': 3, 'tres': 3, 'quatro': 4, 'cinco': 5, 'seis': 6, 'sete': 7, 'oito': 8, 'nove': 9, 'dez': 10, 'onze': 11, 'doze': 12, 'treze': 13, 'quatorze': 14, 'catorze': 14, 'quinze': 15, 'dezesseis': 16, 'dezessete': 17, 'dezoito': 18, 'dezenove': 19, 'vinte': 20, 'trinta': 30, 'quarenta': 40, 'cinquenta': 50, 'sessenta': 60, 'setenta': 70, 'oitenta': 80, 'noventa': 90 };\n    t = t.replace(/\\b(vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa) e (um|uma|dois|duas|três|tres|quatro|cinco|seis|sete|oito|nove)\\b/g, (m, d, u) => String(PAL[d] + PAL[u]))\n      .replace(/\\b(um|uma|primeiro|dois|duas|três|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove|vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa)\\b/g, (m) => String(PAL[m]));\n    if (tipo === 'hora') {\n      if (/meio[- ]dia/.test(t)) return /e meia/.test(t) ? '12:30' : '12:00';\n      if (/meia[- ]noite/.test(t)) return '00:00';\n      const m = t.match(/(\\d{1,2})\\s*(?::|h\\b|hora|horas)?\\s*(?:e\\s*)?(\\d{1,2}|meia)?/);\n      if (!m) return '';\n      let h = parseInt(m[1], 10);\n      const min = m[2] === 'meia' ? 30 : (m[2] ? parseInt(m[2], 10) : 0);\n      if (isNaN(h) || h > 23 || isNaN(min) || min > 59) return '';\n      if (/(da tarde|da noite)/.test(t) && h < 12) h += 12;\n      if (/da manhã/.test(t) && h === 12) h = 0;\n      return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');\n    }\n    if (tipo === 'data') {\n      const MES = { janeiro: 1, fevereiro: 2, 'março': 3, marco: 3, abril: 4, maio: 5, junho: 6, julho: 7, agosto: 8, setembro: 9, outubro: 10, novembro: 11, dezembro: 12 };\n      t = t.replace(/\\b(janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\\b/g, (m) => String(MES[m]));\n      t = t.replace(/mil novecentos e (\\d{1,2})/g, (m, n) => String(1900 + parseInt(n, 10)))\n        .replace(/dois mil e (\\d{1,2})/g, (m, n) => String(2000 + parseInt(n, 10)))\n        .replace(/\\bdois mil\\b/g, '2000')\n        .replace(/\\b2 mil e (\\d{1,2})\\b/g, (m, n) => String(2000 + parseInt(n, 10)))\n        .replace(/\\b2 mil\\b/g, '2000')\n        .replace(/\\b(19\\d\\d|20\\d\\d)\\s+e\\s+(\\d)\\b/g, (m, y, u) => String(parseInt(y, 10) + parseInt(u, 10)));\n      const nums = (t.match(/\\d+/g) || []).map(Number);\n      if (nums.length < 2) return '';\n      const d = nums[0], mo = nums[1];\n      let y = nums[2];\n      if (y === undefined) y = new Date().getFullYear();\n      if (y < 100) y += (y > (new Date().getFullYear() % 100)) ? 1900 : 2000;\n      if (d < 1 || d > 31 || mo < 1 || mo > 12 || y < 1900 || y > new Date().getFullYear()) return '';\n      return String(y) + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');\n    }\n    return '';\n  }\n\n  dataPorExtenso(iso) {\n    const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];\n    const p = (iso || '').split('-');\n    if (p.length !== 3) return iso;\n    return parseInt(p[2], 10) + ' de ' + (MESES[parseInt(p[1], 10) - 1] || p[1]) + ' de ' + p[0];\n  }\n\n  pararMic() {\n    if (this._rec) { try { this._rec.onend = null; this._rec.stop(); } catch (e) {} this._rec = null; }\n    const els = this._vnEls();\n    if (els && els.ouvindo) els.ouv ot.querySelector('[data-mestre-window]'); if (win) win.scrollTop = 0;\n  }\n\n  setMProgress(pct, xp) {\n    const root = this.rootRef.current; if (!root) return;\n    const f = root.querySelector('[data-mestre-fill]'); if (f) f.style.width = pct + '%';\n    if (xp != null) { const x = root.querySelector('[data-mestre-xp]'); if (x) x.textContent = xp; }\n  }\n\n  // ───────── Intro / seleção / modos ─────────\n  // Mapa raioId (1-7, base Trigueirinho) → chave do Mestre nesta tela.\n  raioIdParaMasterKey(id) {\n    return ({ '1': 'azul', '2': 'dourado', '3': 'rosa', '4': 'branco', '5': 'verde', '6': 'rubi', '7': 'violeta' })[String(id)] || null;\n  }\n\n  introStep(name) {\n    this.stopSpeak();\n    const root = this.rootRef.current; if (!root) return;\n    root.querySelectorAll('[data-istep]').forEach((s) => { s.style.display = (s.getAttribute('data-istep') === name) ? 'block' : 'none'; });\n    if (name === 'cadastro') {\n      this.initAudio();\n      this.falarVN('Antes de escolher o Mestre, me conta um pouquinho de você. Preciso ao menos da sua data de nascimento — nunca invento nada do seu céu, só calculo a partir do que você me der.', { quem: 'tati' });\n    } else if (name === 'guia') {\n      this.initAudio();\n      this.aplicarTravas();\n      this.renderNiveis();\n      this.renderCaminho();\n      const sug = root.querySelector('[data-guia-sugestao]');\n      if (this.leituraReal && sug) {\n        sug.style.display = 'block';\n        sug.textContent = '✦ Seu Sol está em ' + this.mapaReal.sol.signo + ', que a base Trigueirinho aproxima do ' + this.leituraReal.raioNome.split('·').slice(0, 2).join('·') + '. Já destaquei esse Mestre — mas escolha livremente quem quiser.';\n        const key = this.raioIdParaMasterKey(this.leituraReal.raioId);\n        const el = key && root.querySelector('[data-master=\"' + key + '\"]');\n        if (el) this.selectMaster(el, { silent: true });\n        this.falarVN('Escolha o Mestre que vai te acompanhar. ' + sug.textCon or = this.mestreCor || '#a08fff';\n    enc.style.display = 'block';\n    const intro = 'No nível ' + nv.nome.split(' · ')[0] + ', ' + D.dor + ' pede passagem. Sente aí dentro: qual trilha você escolhe?';\n    dorEl.textContent = '🌗 ' + intro;\n    // áudio onipresente: fala a pergunta E as duas opções de resposta (abaixo)\n    this._encInicio = Date.now(); this._encErros = 0;\n    const opcoes = [\n      { t: D.sombra, ok: false },\n      { t: D.virtude, ok: true }\n    ];\n    if (Math.random() < 0.5) opcoes.reverse();\n    this.falarVN(intro + ' Lembra: o Desejo é impulso imediato do ego; a Vontade é a força mansa da alma. Primeira trilha: ' + opcoes[0].t + ' Segunda trilha: ' + opcoes[1].t, { quem: 'mestre' });\n    ops.innerHTML = '';\n    opcoes.forEach((op) => {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.style.cssText = 'appearance:none;text-align:left;cursor:pointer;font-family:Georgia,serif;font-size:12.5px;line-height:1.55;color:#ede9ff;padding:10px 12px;border-radius:11px;border:.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);-webkit-tap-highlight-color:transparent;';\n      b.textContent = op.t;\n      b.addEventListener('click', () => {\n        // KPI clínico: latência cognitiva (tempo de análise antes da resposta)\n        const latencia = Date.now() - (this._encInicio || Date.now());\n        if (op.ok) {\n          this.logKpi('encruzilhada_virtude', { raio: key, nivel: nv.id, latencia_ms: latencia, tentativas_sombra: this._encErros, periodo: this.classificarPeriodo(latencia, this._encErros) });\n          enc.style.display = 'none';\n          this.concluirNivel(key, nv, i);\n        } else {\n          b.style.opacity = '.4'; b.style.cursor = 'default';\n          this._encErros = (this._encErros || 0) + 1;\n          this.logKpi('encruzilhada_sombra', { raio: key, nivel: nv.id, latencia_ms: latencia, tentativas: this._encErros, periodo: this.classificarPeriodo(latencia, this._encErros) });\n          // na repetição do loop reativo, o Mestre ilumina o mecanismo de\n          // autoagressão (analogia com as defesas do corpo)\n          const falaAuto = 'Assim como as defesas do seu próprio corpo às vezes atacam suas células saudáveis ao tentar combater um perigo, a sua mente cria armaduras — como o orgulho, o medo ou a inveja — que fingem te proteger, mas acabam atacando você por dentro. Onde você está se atacando para tentar se defender? Escolhe de novo, com carinho.';\n          this.falarVN(this._encErros >= 2 ? falaAuto : D.ensino, { quem: 'mestre' });\n        }\n      });\n      ops.appendChild(b);\n    });\n  }\n\n  // Linha do tempo patológica aplicada à telemetria: classifica o momento do\n  // circuito de resposta — incubação (roda o padrão sem sinais), prodrômico\n  // (sinais sutis: resposta impulsiva rápida), estado (loop reativo repetido),\n  // evolução-cura (escolha da virtude com presença).\n  classificarPeriodo(latenciaMs, erros) {\n    if (erros >= 2) return 'estado';\n    if (erros === 1) return 'prodromico';\n    if (latenciaMs < 2500) return 'prodromico-impulsivo';\n    return 'evolucao-cura';\n  }\n\n  concluirNivel(key, nv, i) {\n    const txt = this.VIRTUDE_NIVEL(key)[nv.id];\n    this.progRaios[key] = i + 1;\n    this.salvarProg();\n    this.logKpi('nivel_concluido', { raio: key, nivel: nv.id, ordem: i + 1 });\n    const fim = (i + 1) >= 4;\n    let fala = 'Você escolheu a trilha da virtude — mais sete passos de luz no seu caminho. ' + txt;\n    if (fim) {\n      const prox = this.RAIO_ORDEM[this.RAIO_ORDEM.indexOf(key) + 1];\n      fala += prox ? ' Você completou os quatro níveis deste Raio — que benção! O Raio ' + prox.charAt(0).toUpperCase() + prox.slice(1) + ' acabou de se abrir pra você. 🤍' : ' Você percorreu todos os Raios — agora o Parque inteiro é seu, com escolha livre. 🤍';\n    }\n    this.darPontos(7, 'nível vivido pela virtude — ' + key + '/' + nv.id);\n    // vítória final: todos os 7 Raios nos 4 níveis — feedback sonoro e visual\n    const totalFeitos = this.RAIO_ORDEM.reduce((s, k) => s + this.nivelFeitos(k), 0);\n    if (totalFeitos >= 28) { this.tocarVitoria(); fala += ' Sinta essa expansão: o circuito de resposta agora é seu. ✨'; }\n    this.falarVN(fala, { quem: 'mestre' });\n    this.renderNiveis();\n  }\n\n  // arpejo ascendente de vitória (264→330→396→528→792Hz) + brilho na barra\n  tocarVitoria() {\n    try {\n      const ac = this.actx; if (!ac) return;\n      [264, 330, 396, 528, 792].forEach((f, i) => {\n        const t = ac.currentTime + i * 0.22;\n        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;\n        const g = ac.createGain();\n        g.gain.setValueAtTime(0, t);\n        g.gain.linearRampToValueAtTime(0.12, t + 0.06);\n        g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);\n        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 2.3);\n      });\n    } catch (e) {}\n    const root = this.rootRef.current;\n    const barra = root && root.querySelector('[data-caminho-barra]');\n    if (barra) { barra.style.boxShadow = '0 0 18px 4px rgba(232,201,122,.8)'; setTimeout(() => { barra.style.boxShadow = ''; }, 4000); }\n    this.logKpi('jornada_completa', { pontos: this.pontos });\n  }\n\n  hideIntro() {\n    this.stopSpeak();\n    const root = this.rootRef.current; if (!root) return;\n    const intro = root.querySelector('[data-intro]'); if (intro) intro.style.display = 'none';\n  }\n\n  startGuided() {\n    this.hideIntro();\n    this.initAudio();\n    this.openMestre();\n  }\n\n  startWalk() {\n    this.hideIntro();\n    this.hideOrbitMenu();\n    this.beginPlay();\n  }\n\n  startOrbit() {\n    const root = this.rootRef.current; if (!root) return;\n    this.mode = 'orbit';\n    this._orbitT = this.clock ? this.clock.elapsedTime : 0;\n    ['[data-hud]', '[data-cross]', '[data-hint]', '[data-joy]', '[data-arrow]', '[data-mestre-prompt]'].forEach((s) => { const el = root.querySelector(s); if (el) { el.style.opacity = '0'; el.style.display = 'none'; } });\n    const sound = root.querySelector('[data-sound]'); if (sound) sound.style.opacity = '1';\n    const vt1 = root.querySelector('[data-voice-toggle]'); if (vt1) vt1.style.opacity = '1';\n    const home = root.querySelector('[data-home]'); if (home) home.style.opacity = '1';\n    const menu = root.querySelector('[data-orbit-menu]'); if (menu) menu.style.display = 'flex';\n  }\n\n  // Sempre dá pra voltar ao início — sem isso, andar pelo parque virava\n  // um beco sem saída (sem menu, sem \"voltar\").\n  voltarAoInicio() {\n    this.stopSpeak();\n    this.hideVN();\n    const root = this.rootRef.current; if (!root) return;\n    this.mode = 'intro';\n    ['[data-hud]', '[data-cross]', '[data-hint]', '[data-joy]', '[data-home]', '[data-sound]', '[data-voice-toggle]'].forEach((s) => {\n      const el = root.querySelector(s); if (el) el.style.opacity = '0';\n    });\n    const vpanel = root.querySelector('[data-voice-panel]'); if (vpanel) vpanel.style.display = 'none';\n    const arrow = root.querySelector('[data-arrow]'); if (arrow) arrow.style.display = 'none';\n    const prompt = root.querySelector('[data-mestre-prompt]'); if (prompt) prompt.style.display = 'none';\n    this.hideOrbitMenu();\n    const mf = root.querySelector('[data-mestre-flow]'); if (mf) mf.style.display = 'none';\n    const intro = root.querySelector('[data-intro]'); if (intro) intro.style.display = 'flex';\n    this.introStep(this.mapaReal ? 'guia' : 'title');\n  }\n\n  hideOrbitMenu() {\n    const root = this.rootRef.current; if (!root) return;\n    const menu = root.querySelector('[data-orbit-menu]'); if (menu) menu.style.display = 'none';\n  }\n\n  openMestre() {\n    if (this.mode === 'mestre') return;\n    const THREE = window.THREE;\n    this._mestreReturn = (this.mode === 'play') ? 'play' : 'orbit';\n    this.mode = 'mestre';\n    this.vnFade(); // transição suave 3D → tela 2D de diálogo\n    this.estagio = 'formal'; this.escolhaSinal = ''; o real → motor astrológico (compartilhado pelas 2 entradas) ─────────\n  async calcularMapaReal(nome, apelido, data, hora, local) {\n    if (!data) return { erro: 'Preciso ao menos da sua data de nascimento para calcular o mapa — sem ela não consigo prosseguir.' };\n    try {\n      const motor = await import(window.__resources.motorAstral);\n      const mapa = motor.calcularMapaNatal(data, hora, local);\n      if (!mapa) return { erro: 'Não consegui calcular com esses dados — confira a data e tente de novo.' };\n      this.mapaReal = mapa;\n      this._motor = motor;\n      this.leituraReal = motor.leituraNativaSigno(mapa.sol.signo);\n      this.nomeUsuario = nome || '';\n      this.apelidoUsuario = apelido || (nome || '').split(' ')[0] || '';\n      // Primeiro, o mesmo formato de memória que \"O Parque - Modulador.html\" lê —\n      // assim a jornada completa (4 Partidas + Atos) continua de onde paramos, com\n      // o MESMO mapa, em vez de recomeçar do zero ou encurtar o que já foi calculado.\n      try {\n        const j = {\n          nomeComp: nome || '', apel: this.apelidoUsuario, nome: nome || '',\n          data: data || '', hora: hora || '', cnasc: local || '', catual: local || '',\n          sent: '', terapia: '', intuito: '',\n          sol: '', lua: '', asc: '', marte: '', venus: '', mercurio: '', saturno: '', jupiter: '', quiron: ''\n        };\n        localStorage.setItem('iet_parque_v10', JSON.stringify({ j: j, raio: this.leituraReal.raioId, partida: 1, mapa: mapa, ts: new Date().toLocaleDateString('pt-BR') }));\n      } catch (e) {}\n      return { mapa };\n    } catch (e) {\n      return { erro: 'Não consegui calcular agora. Tente de novo em instantes.' };\n    }\n  }\n\n  // Entrada 1 — tela 2 da jornada guiada (intro overlay).\n  async processarCadastroIntro() {\n    const root = this.rootRef.current; if (!root) return;\n    const nome = (root.querySelector('[data-icad-nome]') || {}).value || '';\n    const apelido = (root.querySelector('[data-icad-apelido]') || {}).value || '';\n    const data = (root.querySelector('[data-icad-data]') || {}).value || '';\n    const hora = (root.querySelector('[data-icad-hora]') || {}).value || '';\n    const local = (root.querySelector('[data-icad-local]') || {}).value || '';\n    const erroEl = root.querySelector('[data-icad-erro]');\n    const r = await this.calcularMapaReal(nome, apelido, data, hora, local);\n    if (r.erro) { if (erroEl) { erroEl.textContent = r.erro; erroEl.style.display = 'block'; } return; }\n    if (erroEl) erroEl.style.display = 'none';\n    try { if (window.IET_KPI) window.IET_KPI.garantirSessao({ nome, data_nascimento: data || null, hora_nascimento: hora || null, cidade_nascimento: local }); } catch (e) {}\n    this.introStep('guia');\n  }\n\n  // Entrada 2 — fallback dentro do fluxo do Mestre (quem entrou andando, sem dados).\n  async processarCadastro() {\n    const root = this.rootRef.current; if (!root) return;\n    const nome = (root.querySelector('[data-cad-nome]') || {}).value || '';\n    const data = (root.querySelector('[data-cad-data]') || {}).value || '';\n    const hora = (root.querySelector('[data-cad-hora]') || {}).value || '';\n    const local = (root.querySelector('[data-cad-local]') || {}).value || '';\n    const erroEl = root.querySelector('[data-cad-erro]');\n    const r = await this.calcularMapaReal(nome, '', data, hora, local);\n    if (r.erro) { if (erroEl) { erroEl.textContent = r.erro; erroEl.style.display = 'block'; } return; }\n    if (erroEl) erroEl.style.display = 'none';\n    try { if (window.IET_KPI) window.IET_KPI.garantirSessao({ nome, data_nascimento: data || null, hora_nascimento: hora || null, cidade_nascimento: local }); } catch (e) {}\n    const key = this.raioIdParaMasterKey(this.leituraReal.raioId);\n    const el = key && root.querySelector('[data-master=\"' + key + '\"]');\n    if (el) this.selectMaster(el, { silent: true });\n    this.setMProgress(25, '180');\n    this.mostrarDiagnosticoReal(root);\n  }\n\n  closeMestre() {\n    const root = this.rootRef.current; if (!root) return;\n    root.querySelector('[data-mestre-flow]').style.display = 'none';\n    this.stopSpeak();\n    this.hideVN();\n    this.vnFade(); // transição suave 2D → volta ao parque 3D\n    if (!this.mestreDone) this.restoreCore();\n    if (this._mestreReturn === 'play') {\n      this.mode = 'play';\n      ['[data-hud]', '[data-cross]', '[data-hint]', '[data-joy]', '[data-sound]', '[data-voice-toggle]'].forEach((s) => { const el = root.querySelector(s); if (el) el.style.opacity = '1'; });\n      this._nearMestre = false;\n    } else {\n      this.startOrbit();\n    }\n  }\n\n  processarPiaget() {\n    const root = this.rootRef.current; if (!root) return;\n    const fx = root.querySelector('[data-mestre-faixa]');\n    if (fx && fx.value) this.estagio = fx.value;\n    // Versão adulta com mapa real calculado: pula o rastreador genérico\n    // e vai direto para a leitura de verdade (nunca inventada).\n    if (this.estagio === 'formal' && this.mapaReal) {\n      this.irParaDiagnostico4D();\n      return;\n    }\n    this.escolhaSinal = '';\n    const box = root.querySelector('[data-mestre-options]');\n    let opts = [];\n    if (this.estagio === 'pre') {\n      opts = [\n        { id: 's-gestao', t: 'Sinto que preciso arrumar e cuidar de tudo sozinho, sem que ninguém me ajude.' },\n        { id: 's-isolamento', t: 'Acho que não posso chorar e preciso ser sempre forte, sozinho, sem pedir ajuda.' },\n      ];\n    } else if (this.estagio === 'concreto') {\n      opts = [\n        { id: 's-gestao', t: 'Percebo que passo muito mais horas cuidando, limpando e organizando sozinho do que deveria.' },\n        { id: 's-isolamento', t: 'Vejo que guardo as minhas dores, não busco ajuda e finjo que está tudo bem.' },\n      ];\n    } else {\n      opts = [\n        { id: 's-gestao', t: '<b style=\"color:#ede9ff;\">Sobrecarga de gestão:<\u002Fb> mente acelerada, exaustão por gerir tudo sozinho, pânico e burnout silencioso.' },\n        { id: 's-isolamento', t: '<b style=\"color:#ede9ff;\">Autossuficiência forçada:<\u002Fb> isolamento afetivo, fuga em adicções (álcool, telas, jogos) e recusa a pedir ajuda.' },\n        { id: 's-institucional', t: '<b style=\"color:#ede9ff;\">Bloqueio institucional:<\u002Fb> ansiedade crônica por antecipar rejeição e barreiras de acesso à saúde.' },\n      ];\n    }\n    box.innerHTML = '';\n    opts.forEach((o) => {\n      const el = document.createElement('div');\n      el.style.cssText = 'display:flex;align-items:center;gap:12px;padding:13px;border-radius:11px;border:.5px solid rgba(255,255,255,.1);background:#14142a;cursor:pointer;font-family:system-ui,sans-serif;';\n      el.innerHTML = '<div data-dot style=\"flex:none;width:14px;height:14px;border-radius:50%;border:1px solid #4a4860;\"><\u002Fdiv><span style=\"font-size:13.5px;font-style:italic;line-height:1.5;color:#cfc9ea;\">' + o.t + '<\u002Fspan>';\n      el.addEventListener('click', () => this.capturarSinal(o.id, el));\n      box.appendChild(el);\n    });\n    this.setMProgress(35, '250');\n    this.mScreen('sinais');\n    this.falarVN('Perceba, por similaridade de vivência, qual destes nós ressoa em você hoje.', { quem: 'tati' });\n  }\n\n  capturarSinal(tipo, el) {\n    const root = this.rootRef.current; if (!root) return;\n    this.escolhaSinal = tipo;\n    root.querySelectorAll('[data-mestre-options] > div').forEach((d) => {\n      d.style.borderColor = 'rgba(255,255,255,.1)'; d.style.background = '#14142a';\n      const dot = d.querySelector('[data-dot]'); if (dot) { dot.style.background = 'transparent'; dot.style.borderColor = '#4a4860'; }\n    });\n    el.style.borderColor = '#a08fff'; el.style.background = 'rgba(160,143,255,.1)';\n    const dot = el.querySelector('[data-dot]'); if (dot) { dot.style.background = '#a08fff'; dot.style.borderColor = '#a08fff'; }\n    // biofeedback no cristal\n    if (tipo === 's-gestao') { this.setCoreColor(0xff8c6b, 2.4); this.monad.scale.set(0.8, 0.8, 0.8); }\n    else if (tipo === 's-isolamento') { this.setCoreColor(0x6ba4ff, 0.25); this.monad.scale.set(1.25, 0.9, 1.25); }\n    else { this.setCoreColor(0xa08fff, 1.8); this.monad.scale.set(0.95, 0.95, 0.95); }\n  }\n\n  irParaDiagnostico4D() {\n    const root = this.rootRef.current;\n    if (this.estagio === 'formal' && this.mapaReal) { this.mostrarDiagnosticoReal(root); return; }\n    if (!this.escolhaSinal) { this.flashInstrucao(); return; }\n    const target = root.querySelector('[data-mestre-diag]');\n    const card = (tag, tagColor, tagBg, body) =>\n      '<div style=\"background:#14142a;border:.5px solid rgba(160,143,255,.2);border-radius:14px;padding:14px 16px;margin-bottom:11px;\">' +\n      '<div style=\"display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;margin-bottom:7px;color:' + tagColor + ';background:' + tagBg + ';\">' + tag + '<\u002Fdiv>' +\n      '<div style=\"font-size:13.5px;line-height:1.6;color:#cfc9ea;\">' + body + '<\u002Fdiv><\u002Fdiv>';\n\n    let bio, psi, alma, voz;\n    const mc = this.mestreCor || '#a08fff';\n    const masterBlock =\n      '<div style=\"background:rgba(20,20,42,.6);border:.5px solid ' + mc + '55;border-left:3px solid ' + mc + ';border-radius:14px;padding:13px 15px;margin-bottom:13px;\">' +\n      '<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px;\"><span style=\"font-size:14px;\">🔮<\u002Fspan>' +\n      '<span style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:' + mc + ';font-family:system-ui,sans-serif;\">' + (this.mestreRaio || 'O Mestre') + ' · ' + (this.mestreNome || '') + '<\u002Fspan><\u002Fdiv>' +\n      '<div style=\"font-size:11px;color:#9896b8;font-family:system-ui,sans-serif;margin-bottom:6px;\">' + (this.mestreChacra || '') + ' · ' + (this.mestreVirtude || '') + '<\u002Fdiv>' +\n      '<div style=\"font-size:13px;font-style:italic;line-height:1.6;color:#cfc9ea;\">Pela Terceira Visão, observe suas camadas com compaixão — sem punição. Iluminar o padrão já é o começo da cura.<\u002Fdiv><\u002Fdiv>';\n    if (this.estagio === 'formal') {\n      if (this.escolhaSinal === 's-gestao') {\n        bio = '<b style=\"color:#ede9ff;\">Bioquímica · Corpo físico.<\u002Fb> Saturação por cortisol e adrenalina. A mente fica em radar permanente de sobrevivência, tensionando ombros e gerando pânico ou burnout silencioso.';\n        psi = '<b style=\"color:#ede9ff;\">Personalidade emocional.<\u002Fb> Sobrecarga de tarefas assumida como prova de amor. O cuidado é invisibilizado e romantizado como obrigação individual, não coletiva.';\n        alma = '<b style=\"color:#ede9ff;\">Feridas de alma.<\u002Fb> Ferida de injustiça ativa: rigidez estrutural para produzir mais, sustentando a engrenagem alheia à custa do esvaziamento de si.';\n        voz = 'A sobreposição de tarefas e a gestão mental esgotam sua bioquímica. O cuidado romantizado esvazia o aspecto político de compartilhar essa carga.';\n      } else if (this.escolhaSinal === 's-isolamento') {\n        bio = '<b style=\"color:#ede9ff;\">Bioquímica · Corpo físico.<\u002Fb> Bloqueio crônico de ocitocina e repressão somática. Desgastes físicos são calados, gerando negligência médica e refúgio em adicções (álcool, tabaco, excessos).';\n        psi = '<b style=\"color:#ede9ff;\">Personalidade emocional.<\u002Fb> Treinamento para autossuficiência e frieza. O próprio cuidado é visto como fraqueza, distanciando a pessoa do sentir e gerando depressão silenciosa.';\n        alma = '<b style=\"color:#ede9ff;\">Feridas de alma.<\u002Fb> Ferida de abandono ou rejeição camuflada em orgulho e rigidez. Barreiras internas para se conectar com a própria fragilidade.';\n        voz = 'O treinamento para o distanciamento do cuidado gera isolamento e adoecimento psíquico. Cuidar cura a solidão.';\n      } else {\n        bio = '<b style=\"color:#ede9ff;\">Bioquímica · Corpo físico.<\u002Fb> Alerta inflamatório persistente no sistema nervoso autônomo, induzido pelo estresse social e de minoria.';\n        psi = '<b style=\"color:#ede9ff;\">Personalidade emocional.<\u002Fb> Ansiedade e ideação decorrentes do medo de exclusão e da violência estrutural oculta nos sistemas de amparo padrão.';\n        alma = '<b style=\"color:#ede9ff;\">Feridas de alma.<\u002Fb> Ferida de rejeição sistemática: bloqueios de confiança para buscar suporte nas instituições de saúde.';\n        voz = 'O medo do não-reconhecimento afasta o ser humano do cuidado básico. Iluminamos o padrão para abrir rotas seguras.';\n      }\n      target.innerHTML = masterBlock +\n        card('🌍 Físico', '#ff8c6b', 'rgba(255,140,107,.2)', bio) +\n        card('💧 Emocional', '#6ba4ff', 'rgba(107,164,255,.2)', psi) +\n        card('🔥 Alma', '#a08fff', 'rgba(160,143,255,.2)', alma);\n    } else {\n      const s = 'O Mestre mostra: quando dividimos o peso da organização e aceitamos expressar nossas fragilidades e choros, o corpo fica leve e o Parque ganha harmonia. Qualquer pessoa pode cuidar, sentir e pedir ajuda.';\n      target.innerHTML = masterBlock + card('⬡ Consciência coletiva', '#5ecfb0', 'rgba(94,207,176,.2)', s);\n      voz = s;\n    }\n    this.setMProgress(72, '480');\n    this.mScreen('diagnostico');\n    this.falarVN(voz, { quem: 'mestre' });\n  }\n\n  mostrarDiagnosticoReal(root) {\n    const target = root.querySelector('[data-mestre-diag]');\n    try {\n      this._mostrarDiagnosticoReal(root, target);\n    } catch (e) {\n      // Nunca deixa a tela em branco: mostra ao menos a leitura do Sol calculada.\n      const leitura = this.leituraReal, mapa = this.mapaReal;\n      if (target && leitura && mapa) {\n        target.innerHTML = '<div style=\"background:#14142a;border:.5px solid rgba(160,143,255,.2);border-radius:14px;padding:14px 16px;\">' +\n          '<div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:' + (leitura.cor || '#a08fff') + ';font-family:system-ui,sans-serif;margin-bottom:7px;\">☀ Seu Sol · ' + mapa.sol.signo + '<\u002Fdiv>' +\n          '<div style=\"font-size:13.5px;line-height:1.6;color:#cfc9ea;\">' + leitura.texto + '<\u002Fdiv><\u002Fdiv>';\n        this.setMProgress(72, '480');\n        this.mScreen('diagnostico');\n        this.falarVN(leitura.texto, { quem: 'mestre' });\n      }\n    }\n  }\n\n  _mostrarDiagnosticoReal(root, target) {\n    const motor = this._motor, mapa = this.mapaReal, leitura = this.leituraReal;\n    const mc = this.mestreCor || '#a08fff';\n    const masterBlock =\n      '<div style=\"background:rgba(20,20,42,.6);border:.5px solid ' + mc + '55;border-left:3px solid ' + mc + ';border-radius:14px;padding:13px 15px;margin-bottom:13px;\">' +\n      '<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px;\"><span style=\"font-size:14px;\">🔮<\u002Fspan>' +\n      '<span style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:' + mc + ';font-family:system-ui,sans-serif;\">' + (this.mestreRaio || 'O Mestre') + ' · ' + (this.mestreNome || '') + '<\u002Fspan><\u002Fdiv>' +\n      '<div style=\"font-size:11px;color:#9896b8;font-family:system-ui,sans-serif;margin-bottom:6px;\">' + (this.mestreChacra || '') + ' · ' + (this.mestreVirtude || '') + '<\u002Fdiv>' +\n      '<div style=\"font-size:13px;font-style:italic;line-height:1.6;color:#cfc9ea;\">Pela Terceira Visão, observe suas camadas com compaixão — sem punição. Nada aqui foi inventado: é calculado do seu mapa real.<\u002Fdiv><\u002Fdiv>';\n\n    const card = (tag, tagColor, tagBg, body) =>\n      '<div style=\"background:#14142a;border:.5px solid rgba(160,143,255,.2);border-radius:14px;padding:14px 16px;margin-bottom:11px;\">' +\n      '<div style=\"display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;margin-bottom:7px;color:' + tagColor + ';background:' + tagBg + ';\">' + tag + '<\u002Fdiv>' +\n      '<div style=\"font-size:13.5px;line-height:1.6;color:#cfc9ea;\">' + body + '<\u002Fdiv><\u002Fdiv>';\n\n    const nome = this.apelidoUsuario || this.nomeUsuario || '';\n    const saud = nome ? nome + ', seu' : 'Seu';\n    const signoCard = card('☀ ' + saud + ' Sol · ' + mapa.sol.signo, leitura.cor, leitura.cor + '22', leitura.texto);\n\n    // Leitura personalizada POR PARTIDA (Físico/Emocional/Mental/Personalidade):\n    // para cada uma, calcula os aspectos reais entre os pontos daquela partida\n    // e interpreta o par específico de planeta+signo — nunca um texto genérico\n    // por \"tipo\" de aspecto solto.\n    const chavesPartida = motor.CHAVES_PARTIDA || {\n      1: { label: 'Físico · Terra', chaves: ['sol', 'lua', 'mar', 'sat', 'asc'] },\n      2: { label: 'Emocional · Água', chaves: ['lua', 'ven', 'net', 'plu', 'asc'] },\n      3: { label: 'Mental · Ar', chaves: ['mer', 'sat', 'ura', 'jup', 'asc'] },\n      4: { label: 'Personalidade · Fogo', chaves: ['sol', 'mar', 'jup', 'nno', 'asc', 'mc'] }\n    };\n    const partidaCor = { 1: '#ff8c6b', 2: '#a08fff', 3: '#e8c97a', 4: '#5ecfb0' };\n    let partidasHtml = '';\n    let vozesPartidas = [];\n    [1, 2, 3, 4].forEach((pid) => {\n      const conf = chavesPartida[pid];\n      const asp = motor.calcularAspectos(mapa, conf.chaves);\n      const pCor = partidaCor[pid];\n      if (!asp.length) {\n        partidasHtml += card(conf.label, pCor, pCor + '22', 'Sem aspectos relevantes na orbe calculada entre esses pontos — território em equilíbrio, sem atrito nem fusão aparente agora.');\n        return;\n      }\n      const alvo = asp[0];\n      const na = motor.PLAN_ASTRO[alvo.a] || { n: alvo.a, chave: alvo.a };\n      const nb = motor.PLAN_ASTRO[alvo.b] || { n: alvo.b, chave: alvo.b };\n      const signoA = (mapa[alvo.a] || {}).signo, signoB = (mapa[alvo.b] || {}).signo;\n      const texto = motor.interpretarAspecto({ n: na.n, chave: alvo.a }, signoA, { n: nb.n, chave: alvo.b }, signoB, alvo.def);\n      const corpo = '<strong style=\"color:#ede9ff;\">' + na.n + ' em ' + signoA + '<\u002Fstrong> <span style=\"color:' + motor.ASPECTO_NAT[alvo.def.nat].cor + ';\">' + alvo.def.sb + ' ' + alvo.def.nome + '<\u002Fspan> <strong style=\"color:#ede9ff;\">' + nb.n + ' em ' + signoB + '<\u002Fstrong> <span style=\"color:#6c6a88;font-size:11px;\">(orbe ' + alvo.orbe.toFixed(1) + '°)<\u002Fspan><br><span style=\"display:inline-block;margin-top:6px;\">' + texto + '<\u002Fspan>';\n      partidasHtml += card(conf.label, pCor, pCor + '22', corpo);\n      vozesPartidas.push(conf.label.split('·')[0].trim() + ': ' + texto);\n    });\n\n    target.innerHTML = masterBlock + signoCard + '<div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9896b8;font-family:system-ui,sans-serif;margin:14px 0 8px;\">⛓ Aspectos calculados, personalizados por etapa<\u002Fdiv>' + partidasHtml;\n    this.setMProgress(72, '480');\n    this.mScreen('diagnostico');\n    this.falarVN(leitura.texto + ' ' + vozesPartidas.join(' '), { quem: 'mestre' });\n  }\n\n  // Conversor mínimo de markdown simples (###, **, listas, parágrafos) → HTML inline.\n  mdParaHtml(md) {\n    const esc = (s) => s.replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;');\n    const linhas = String(md || '').split('\\n');\n    let html = '';\n    linhas.forEach((linha) => {\n      let l = linha.trim();\n      if (!l) return;\n      if (l.startsWith('### ')) {\n        html += '<div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#e8c97a;font-family:system-ui,sans-serif;margin:14px 0 6px;\">' + esc(l.slice(4)) + '<\u002Fdiv>';\n        return;\n      }\n      if (l.startsWith('#### ') || l.startsWith('## ') || l.startsWith('# ')) {\n        html += '<div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#e8c97a;font-family:system-ui,sans-serif;margin:12px 0 5px;\">' + esc(l.replace(/^#+\\s*/, '')) + '<\u002Fdiv>';\n        return;\n      }\n      l = esc(l).replace(/\\*\\*(.+?)\\*\\*/g, '<strong style=\"color:#ede9ff;\">$1<\u002Fstrong>');\n      if (l.startsWith('- ') || l.startsWith('* ')) {\n        html += '<div style=\"font-size:13px;line-height:1.6;color:#cfc9ea;margin-bottom:4px;\">• ' + l.slice(2) + '<\u002Fdiv>';\n      } else {\n        html += '<div style=\"font-size:13.5px;line-height:1.65;color:#cfc9ea;margin-bottom:8px;\">' + l + '<\u002Fdiv>';\n      }\n    });\n    return html;\n  }\n\n  async gerarLeituraViva() {\n    const root = this.rootRef.current; if (!root) return;\n    const box = root.querySelector('[data-leitura-viva-content]');\n    const btn = root.querySelector('[data-gerar-leitura-viva]');\n    if (!this.mapaReal || !this._motor || !box) return;\n    if (!window.claude || !window.claude.complete) {\n      box.innerHTML = '<div style=\"font-size:12px;color:#9896b8;font-family:system-ui,sans-serif;\">A Leitura Viva não está disponível neste ambiente agora.<\u002Fdiv>';\n      return;\n    }\n    if (btn) { btn.textContent = '🌌 Consultando o Mestre...'; btn.disabled = true; btn.style.opacity = '0.6'; }\n    box.innerHTML = '<div style=\"font-size:12px;color:#9896b8;font-family:system-ui,sans-serif;font-style:italic;\">Tati está lendo seu mapa com calma — isso leva alguns segundos...<\u002Fdiv>';\n    try {\n      const { SYSTEM_PROMPT } = await import(window.__resources.motorPrompt);\n      // Banco de conhecimento alquímico compartilhado (Matriz Raios/Sombras,\n      // Astrologia Hermética, Tarot e Glossário da Tati à Guiar).\n      let BLOCO = '';\n      try { BLOCO = (await import(window.__resources.ietConhecimento)).BLOCO_PROMPT || ''; } catch (e) {}\n      const motor = this._motor, mapa = this.mapaReal;\n      const asp = motor.calcularAspectos(mapa, ['sol', 'lua', 'mer', 'ven', 'mar', 'jup', 'sat', 'asc', 'mc']).slice(0, 5);\n      const aspTxt = asp.map((x) => {\n        const na = motor.PLAN_ASTRO[x.a] || { n: x.a }, nb = motor.PLAN_ASTRO[x.b] || { n: x.b };\n        return '- ' + na.n + ' em ' + (mapa[x.a] || {}).signo + ' (Casa ' + (mapa[x.a] || {}).casa + ') ' + x.def.nome + ' ' + nb.n + ' em ' + (mapa[x.b] || {}).signo + ' (Casa ' + (mapa[x.b] || {}).casa + '), orbe ' + x.orbe.toFixed(1) + '°';\n      }).join('\\n');\n      const dados = 'Nome: ' + (this.nomeUsuario || 'não informado') + ' | Como gostaria de ser chamado(a): ' + (this.apelidoUsuario || this.nomeUsuario || 'não informado') + '\\n' +\n        'Sol em ' + mapa.sol.signo + ' · Casa ' + mapa.sol.casa + '\\n' +\n        'Lua em ' + mapa.lua.signo + ' · Casa ' + mapa.lua.casa + '\\n' +\n        'Ascendente em ' + mapa.asc.signo + '\\n' +\n        'Aspectos relevantes:\\n' + (aspTxt || '(nenhum na orbe calculada)') + '\\n' +\n        'Raio ativo no jogo: ' + (this.leituraReal ? this.leituraReal.raioId : '') + ' (' + (this.mestreRaio || '') + ' · ' + (this.mestreNome || '') + ')\\n' +\n        'Partida ativa: Personalidade (jornada geral de autoconhecimento no Parque)' +\n        this.contextoCRM();\n      const texto = await window.claude.complete({\n        model: 'claude-sonnet-4-5',\n        max_tokens: 1600,\n        system: SYSTEM_PROMPT + BLOCO,\n        messages: [{ role: 'user', content: dados }]\n      });\n      box.innerHTML = this.mdParaHtml(texto);\n    } catch (e) {\n      box.innerHTML = '<div style=\"font-size:12px;color:#ff8c6b;font-family:system-ui,sans-serif;\">Não consegui gerar a leitura viva agora. Tente de novo em instantes.<\u002Fdiv>';\n    } finally {\n      if (btn) { btn.textContent = '✨ Gerar novamente'; btn.disabled = false; btn.style.opacity = '1'; }\n    }\n  }\n\n  flashInstrucao() {\n    const root = this.rootRef.current;\n    const el = root.querySelector('[data-mestre-instrucao]');\n    if (!el) return;\n    el.textContent = 'Selecione uma vivência para sintonizar a biomodulação.';\n    el.style.color = '#ff8c6b';\n    setTimeout(() => { el.style.color = '#cfc9ea'; }, 1600);\n  }\n\n  irParaIntegracao() {\n    const root = this.rootRef.current;\n    this.mestreDone = true;\n    // regeneração harmônica: verde-esmeralda (parassimpático)\n    this.setCoreColor(0x5ecfb0, 0.4); this.monad.scale.set(1.4, 1.4, 1.4);\n    this.monad.material.emissiveIntensity = 1.1; this.monLight.intensity = 2.4;\n    const t = root.querySelector('[data-mestre-integ]');\n    let txt, voz;\n    if (this.estagio === 'formal') {\n      txt = '<b style=\"color:#5ecfb0;\">A nova ética do cuidar<\u002Fb><br><br>' +\n        '<b style=\"color:#ede9ff;\">• O Caminho:<\u002Fb> restabeleça o auto-zelo físico e mental, rompendo adicções e negligências de saúde.<br><br>' +\n        '<b style=\"color:#ede9ff;\">• O Praticante:<\u002Fb> faça a divisão horizontal do tempo de cuidado em seu lar, encarando-o como trabalho e responsabilidade política compartilhada.<br><br>' +\n        '<b style=\"color:#ede9ff;\">• A Testemunha (seu propósito):<\u002Fb> propague esse modelo. O Parque forma profissionais conscientes para liderar a Nova Economia do Cuidado, a assistência integrativa e projetos sociais sustentáveis.';\n      voz = 'A nova ética do cuidar tem três passos: o caminho do auto-acolhimento, o praticante da divisão justa, e a testemunha que expande esse cuidado para o mundo.';\n    } else {\n      txt = 'Parabéns! Você ativou a Insígnia da Cooperação Universal. Cuidar de si e do próximo é a tarefa mais importante de todos os guardiões do Parque.';\n      voz = txt;\n    }\n    t.innerHTML = txt;\n    this.setMProgress(100, '750');\n    this.mScreen('integracao');\n    this.falarVN(voz, { quem: 'mestre' });\n  }\n\n  collect(o) {\n    const THREE = window.THREE;\n    o.collected = true; o.grp.visible = false;\n    this.collected++;\n    o.raio.done++;\n    // burst\n    const b = this.glowSprite(o.raio.cor); b.scale.set(2.6, 2.6, 1);\n    b.position.copy(o.grp.position); this.scene.add(b);\n    this.bursts.push({ s: b, life: 0, max: 0.7 });\n    this.chime(o.raio.id);\n    this.showCard(o.raio, o.data);\n    this.speak(o.data.t + '. ' + o.data.d);\n    if (o.raio.done >= o.raio.orbs.length && !o.raio.complete) {\n      o.raio.complete = true;\n      o.raio.beam.material.opacity = 0.28;\n      o.raio.cap.material.emissiveIntensity = 2.2;\n      o.raio.ring.material.opacity = 0.7;\n      o.raio.light.intensity = 1.8;\n      this.monad.material.emissiveIntensity += 0.7;\n      this.monLight.intensity += 0.5;\n    }\n    this.updateHUD();\n    if (this.collected >= this.orbs.length) {\n      this.monad.material.emissiveIntensity = 3.4; this.monLight.intensity = 3.2;\n      setTimeout(() => { const w = this.rootRef.current.querySelector('[data-win]'); if (w) w.style.display = 'flex'; this.mode = 'won'; }, 900);\n    }\n  }\n\n  // ── AVATAR 3D · beija-flor andrógino em 3ª pessoa ──────────────\n  // O beija-flor é o próprio PaZciente navegando seus estados internos:\n  // iridescência verde→azul→roxo reagindo às luzes, flutuação suave e\n  // rastro de partículas nas asas — leveza para reduzir o estresse motor.\n  buildAvatar() {\n    const THREE = window.THREE;\n    const grp = new THREE.Group();\n    const mat = new THREE.MeshStandardMaterial({ color: 0x1c4a44, emissive: 0x2fae88, emissiveIntensity: 0.55, metalness: 0.85, roughness: 0.28 });\n    this._avMat = mat;\n    const body = new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 16), mat);\n    body.scale.set(0.75, 0.8, 1.25); body.castShadow = true; grp.add(body);\n    const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 18, 14), mat);\n    head.position.set(0, 0.22, -0.34); head.castShadow = true; grp.add(head);\n    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.55, 8), new THREE.MeshStandardMaterial({ color: 0x2a2436, roughness: 0.5 }));\n    beak.rotation.x = -Math.PI / 2; beak.position.set(0, 0.2, -0.72); grp.add(beak);\n    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.62, 6), mat);\n    tail.rotation.x = Math.PI / 2.3; tail.position.set(0, 0.0, 0.55); tail.scale.set(1, 1, 0.35); grp.add(tail);\n    // asas: pivôs no ombro para bater sem deslocar\n    const wingMat = new THREE.MeshStandardMaterial({ color: 0x24506e, emissive: 0x4a7fd8, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.3, transparent: true, opacity: 0.92 });\n    this._wingMat = wingMat;\n    const mkWing = (side) => {\n      const pivot = new THREE.Group();\n      const w = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 8), wingMat);\n      w.scale.set(1.55, 0.07, 0.65); w.position.x = side * 0.42; w.castShadow = true;\n      pivot.add(w); pivot.position.set(side * 0.16, 0.14, 0);\n      grp.add(pivot); return pivot;\n    };\n    this.wingL = mkWing(-1); this.wingR = mkWing(1);\n    grp.position.set(0, 1.4, 14);\n    grp.visible = false;\n    this.scene.add(grp);\n    this.avatar = grp; this._avYaw = 0;\n    // rastro de partículas das asas\n    this.avTrail = [];\n    for (let i = 0; i < 16; i++) {\n      const s = this.glowSprite(0x7fe0c0);\n      s.scale.set(0.55, 0.55, 1); s.visible = false;\n      this.scene.add(s); this.avTrail.push(s);\n    }\n  }\n\n  updateAvatar(dt, t) {\n    if (!this.avatar) return;\n    const THREE = window.THREE;\n    const hover = 1.35 + Math.sin(t * 2.1) * 0.14;\n    this.avatar.position.set(this.player.x, hover, this.player.z);\n    // orienta na direção do voo (ou da câmera quando pairando), com suavidade\n    let head = this.yaw;\n    if (this._moving && this._vel && this._vel.lengthSq() > 0.4) head = Math.atan2(-this._vel.x, -this._vel.z);\n    let dy = head - this._avYaw;\n    while (dy > Math.PI) dy -= Math.PI * 2;\n    while (dy < -Math.PI) dy += Math.PI * 2;\n    this._avYaw += dy * Math.min(1, 8 * dt);\n    this.avatar.rotation.y = this._avYaw;\n    this.avatar.rotation.z = Math.max(-0.5, Math.min(0.5, -dy * 2.2));\n    // asas: batida rápida voando, pairado suave quando parado\n    this._wingT = (this._wingT || 0) + dt * (this._moving ? 26 : 13);\n    const w = Math.sin(this._wingT) * (this._moving ? 1.05 : 0.75);\n    this.wingL.rotation.z = 0.35 + w;\n    this.wingR.rotation.z = -0.35 - w;\n    // iridescência viva: tom desliza verde→azul→roxo e reage às luzes da cena\n    const hue = 0.38 + 0.22 * (0.5 + 0.5 * Math.sin(t * 0.7 + this._avYaw));\n    this._avMat.emissive.setHSL(hue, 0.85, 0.38);\n    this._avMat.color.setHSL(hue, 0.6, 0.22);\n    if (this._wingMat) this._wingMat.emissive.setHSL(hue + 0.08, 0.8, 0.42);\n    // rastro de partículas\n    this._trailAcc = (this._trailAcc || 0) + dt;\n    if (this._trailAcc > 0.05 && this.avTrail) {\n      this._trailAcc = 0;\n      this._trailI = (this._trailI || 0);\n      const s = this.avTrail[this._trailI % this.avTrail.length]; this._trailI++;\n      s.position.set(this.player.x + (Math.random() - 0.5) * 0.5, hover + 0.1 + (Math.random() - 0.5) * 0.4, this.player.z + (Math.random() - 0.5) * 0.5);\n      s.material.opacity = this._moving ? 0.5 : 0.22;\n      s.material.color.setHSL(hue, 0.9, 0.62);\n      s.visible = true;\n    }\n    if (this.avTrail) this.avTrail.forEach((s) => {\n      if (s.visible) { s.material.opacity *= (1 - 2.2 * dt); if (s.material.opacity < 0.02) s.visible = false; }\n    });\n  }\n\n  // ── CRM DE CONHECIMENTO UNIVERSAL ───────────────────────────────\n  // Todos os personagens têm acesso ao histórico real do PaZciente\n  // (progresso na Grade dos 28 + telemetria cognitiva) para acolher\n  // o momento emocional exato — nunca falas estáticas.\n  contextoCRM() {\n    try {\n      const linhas = [];\n      const g = JSON.parse(localStorage.getItem('iet_parque_v10') || 'null');\n      if (g && g.j && g.j.apel) linhas.push('PaZciente: ' + g.j.apel + (g.j.sent ? ' | Estado declarado na chegada: \"' + g.j.sent + '\"' : '') + (g.j.intuito ? ' | Intuito: \"' + g.j.intuito + '\"' : ''));\n      const gr = JSON.parse(localStorage.getItem('iet_grade28_v2') || 'null');\n      if (gr && typeof gr.done === 'number') {\n        const RA = ['Azul', 'Dourado', 'Rosa', 'Branco', 'Verde', 'Rubi', 'Violeta'];\n        const CA = ['Físico', 'Emocional', 'Mental', 'Personalidade'];\n        const d = Math.max(0, Math.min(28, gr.done));\n        linhas.push('Progresso na Grade dos 28: ' + d + '/28 · ' + (d >= 28 ? 'ciclo completo, ordem livre' : 'cursando Raio ' + RA[Math.floor(d / 4)] + ' · campo ' + CA[d % 4]));\n      }\n      const ks = JSON.parse(localStorage.getItem('iet_kpi_respostas') || '[]');\n      if (ks.length) {\n        const ult = ks.slice(-12);\n        const lat = ult.map((r) => r.latenciaMs).filter((n) => typeof n === 'number');\n        const mlat = lat.length ? Math.round(lat.reduce((a, b) => a + b, 0) / lat.length) : null;\n        const bks = ult.reduce((a, r) => a + (r.backspaces || 0), 0);\n        const tk = ult.reduce((a, r) => a + (r.totalTeclas || 0), 0);\n        const voz = ult.filter((r) => r.modoResposta === 'voz').length;\n        linhas.push('Telemetria cognitiva recente (' + ult.length + ' respostas): latência média ' + (mlat != null ? (mlat / 1000).toFixed(1) + 's' : '—') + ' · taxa de correções ' + (tk ? Math.round(bks / tk * 100) + '%' : '—') + ' · respostas por voz ' + voz + '/' + ult.length);\n      }\n      return linhas.length ? '\\nCRM DO PAZCIENTE (histórico real — personalize o acolhimento para este exato momento emocional e cognitivo; NUNCA cite números friamente nem mencione \"telemetria\"):\\n- ' + linhas.join('\\n- ') : '';\n    } catch (e) { return ''; }\n  }\n\n  animate() {\n    this._raf = requestAnimationFrame(() => this.animate());\n    const THREE = window.THREE;\n    const dt = Math.min(this.clock.getDelta(), 0.05);\n    const t = this.clock.elapsedTime;\n\n    // orbs bob/spin\n    this.orbs.forEach((o) => {\n      if (!o.grp.visible) return;\n      o.grp.position.y = o.baseY + Math.sin(t * 1.6 + o.phase) * 0.22;\n      o.core.rotation.y += dt * 0.8; o.core.rotation.x += dt * 0.4;\n      const p = 0.85 + Math.sin(t * 3 + o.phase) * 0.18;\n      o.halo.scale.set(2.4 * p + 0.3, 2.4 * p + 0.3, 1);\n    });\n    // monad\n    const cs = this.coreSpin == null ? 1 : this.coreSpin;\n    this.monad.rotation.y += dt * 0.4 * cs; this.monad.rotation.x += dt * 0.15 * cs;\n    this.monad.position.y = 3.2 + Math.sin(t * 0.8) * 0.12;\n    this.monGlow.position.copy(this.monad.position);\n    // caps spin\n    this.RAIOS.forEach((R) => { R.cap.rotation.y += dt * 0.9; if (R.complete) R.beam.material.opacity = 0.22 + Math.sin(t * 2) * 0.08; });\n    // motes drift\n    const pa = this.motes.geometry.attributes.position;\n    for (let i = 0; i < pa.count; i++) {\n      let y = pa.getY(i) + dt * 0.5;\n      if (y > 34) y = 0;\n      pa.setY(i, y);\n    }\n    pa.needsUpdate = true;\n    this.motes.rotation.y += dt * 0.01;\n    // bursts\n    for (let i = this.bursts.length - 1; i >= 0; i--) {\n      const b = this.bursts[i]; b.life += dt;\n      const k = b.life / b.max;\n      const sc = 2.6 + k * 7;\n      b.s.scale.set(sc, sc, 1);\n      b.s.material.opacity = Math.max(0, 1 - k);\n      if (b.life >= b.max) { this.scene.remove(b.s); this.bursts.splice(i, 1); }\n    }\n\n    if (this.mode === 'intro') {\n      const a = t * 0.12;\n      this.camera.position.set(Math.cos(a) * 48, 16 + Math.sin(t * 0.2) * 2, Math.sin(a) * 48);\n      this.camera.lookAt(0, 3, 0);\n    } else if (this.mode === 'play') {\n      this.handleMove(dt);\n      if (this.avatar) this.avatar.visible = true;\n      this.updateAvatar(dt, t);\n      // câmera em 3ª pessoa: segue o beija-flor por trás com amortecimento\n      this.camera.rotation.set(this.pitch, this.yaw, 0);\n      const back = new THREE.Vector3(); this.camera.getWorldDirection(back);\n      const camTarget = new THREE.Vector3(this.player.x, 0, this.player.z)\n        .addScaledVector(back, -5.4).add(new THREE.Vector3(0, 3.0, 0));\n      if (camTarget.y < 0.6) camTarget.y = 0.6;\n      if (!this._camPos) this._camPos = camTarget.clone();\n      this._camPos.lerp(camTarget, Math.min(1, 6 * dt));\n      this.camera.position.copy(this._camPos);\n      this.camera.lookAt(this.player.x, (this.avatar ? this.avatar.position.y : 1.4) + 0.5, this.player.z);\n      // collect check\n      this.orbs.forEach((o) => {\n        if (!o.collected) {\n          const dx = o.grp.position.x - this.player.x, dz = o.grp.position.z - this.player.z;\n          if (dx * dx + dz * dz < 5.3) this.collect(o);\n        }\n      });\n      // Mestre proximity\n      const distC = Math.hypot(this.player.x, this.player.z);\n      const near = distC < 8.5;\n      if (near !== this._nearMestre) {\n        this._nearMestre = near;\n        const pr = this.rootRef.current && this.rootRef.current.querySelector('[data-mestre-prompt]');\n        if (pr) pr.style.display = near ? 'inline-flex' : 'none';\n      }\n      this.updateArrow();\n    } else if (this.mode === 'mestre') {\n      this.camera.position.lerp(this._mestreCam.pos, 0.07);\n      this.camera.lookAt(this._mestreCam.look);\n    } else if (this.mode === 'orbit') {\n      const a = (t - (this._orbitT || 0)) * 0.16;\n      this.camera.position.set(Math.cos(a) * 13, 5.2 + Math.sin(t * 0.3) * 0.6, Math.sin(a) * 13);\n      this.camera.lookAt(0, 3.0, 0);\n    }\n\n    this.renderer.render(this.scene, this.camera);\n  }\n\n  handleMove(dt) {\n    const THREE = window.THREE;\n    let f = 0, r = 0;\n    const k = this.keys;\n    if (k['w'] || k['arrowup']) f += 1;\n    if (k['s'] || k['arrowdown']) f -= 1;\n    if (k['d'] || k['arrowright']) r += 1;\n    if (k['a'] || k['arrowleft']) r -= 1;\n    f += this.move.y; r += this.move.x;\n    const wantsMove = (Math.abs(f) > 0.05 || Math.abs(r) > 0.05);\n    if (wantsMove && !this._firstMoveDone) { this._firstMoveDone = true; this.onFirstMove(); }\n    // velocidade suave: acelera/desacelera em vez de andar/parar abruptamente\n    if (!this._vel) this._vel = new THREE.Vector3();\n    const fwd = new THREE.Vector3(); this.camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();\n    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();\n    const dir = new THREE.Vector3().addScaledVector(fwd, f).addScaledVector(right, r);\n    if (dir.lengthSq() > 1) dir.normalize();\n    const speed = 9;\n    const target = dir.multiplyScalar(wantsMove ? speed : 0);\n    const easing = wantsMove ? 8 : 11; // acelera suave, freia um pouco mais rápido\n    this._vel.lerp(target, Math.min(1, easing * dt));\n    this._moving = this._vel.lengthSq() > 0.02;\n    if (!this._moving) return;\n    this.player.addScaledVector(this._vel, dt);\n    // keep inside park & out of monad pedestal — desliza pela borda em vez de travar\n    const rad = Math.hypot(this.player.x, this.player.z);\n    if (rad > 66) { this.player.multiplyScalar(66 / rad); this._vel.multiplyScalar(0.4); }\n    if (rad < 3.2) { const s = 3.2 / (rad || 0.001); this.player.x *= s; this.player.z *= s; this._vel.multiplyScalar(0.4); }\n  }\n\n  onFirstMove() {\n    const root = this.rootRef.current; if (!root) return;\n    const hint = root.querySelector('[data-hint]');\n    if (hint) {\n      hint.style.transition = 'opacity .3s';\n      hint.style.opacity = '0';\n      setTimeout(() => {\n        hint.innerHTML = 'Ótimo! Agora siga a trilha dourada no chão<br>até o próximo Raio ✦';\n        hint.style.opacity = '1';\n        setTimeout(() => {\n          hint.style.opacity = '0';\n          setTimeout(() => {\n            hint.innerHTML = this.isTouch\n              ? 'Joystick para andar<br>arraste a tela para olhar<br>siga a seta dourada'\n              : 'WASD / setas para andar<br>arraste o mouse para olhar<br>siga a seta dourada';\n            hint.style.opacity = '1';\n          }, 350);\n        }, 3800);\n      }, 320);\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
